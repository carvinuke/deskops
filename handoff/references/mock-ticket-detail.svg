<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DeskOps Lab ticket detail</title><desc id="desc">Original schematic of a ticket detail page with requester context, activity, resolution objectives and clear actions.</desc>
<defs><style>
*{box-sizing:border-box} text{font-family:Arial,Helvetica,sans-serif;fill:#26323c} .muted{fill:#6d7b87} .tiny{font-size:10px;letter-spacing:1.2px;fill:#798895} .small{font-size:12px} .body{font-size:13px} .heading{font-size:17px;font-weight:600} .blue{fill:#008fce} .line{stroke:#dfe5e9;stroke-width:1} .surface{fill:#fff;stroke:#dfe5e9;stroke-width:1} .subtle{fill:#f7f9fb} .pale{fill:#edf8fd} .mono{font-family:Consolas,monospace}
</style></defs>
<rect width="100%" height="100%" rx="8" fill="#f7f9fb" stroke="#dce3e8"/>

<rect x="1" y="1" width="1198" height="54" rx="7" fill="#fff"/><path d="M1 55H1199" class="line"/>
<text x="26" y="32" class="small blue">‹ Dashboard</text><text x="150" y="32" class="small muted">Tools⌄</text><text x="1070" y="32" class="small muted">Options ···</text>
<text x="28" y="88" class="small mono blue">INC-1042</text><rect x="111" y="70" width="63" height="23" rx="3" fill="#fff0ef" stroke="#f3c5c3"/><text x="142" y="85" text-anchor="middle" font-size="10" font-weight="700" fill="#d92d35">HIGH</text>
<text x="28" y="127" font-size="25" font-weight="700">Account locked after returning from vacation</text>
<text x="28" y="158" class="tiny">ASSIGNEE</text><circle cx="135" cy="154" r="13" fill="#edf3f7"/><text x="135" y="158" text-anchor="middle" font-size="9" font-weight="700" fill="#5f6f7d">AM</text><text x="155" y="158" class="body">Alex Morgan</text><rect x="263" y="140" width="105" height="28" rx="3" fill="#edf8fd" stroke="#a6dff3"/><text x="315" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#008fce">Assigned to me</text>
<rect x="28" y="187" width="755" height="168" rx="5" class="surface"/><text x="49" y="214" class="tiny blue">REQUESTER</text><text x="49" y="241" class="heading">Maya Chen</text><text x="49" y="263" class="small muted">Finance · Floor 2 · Ext. 4421</text><text x="49" y="285" class="small muted">maya.chen@northstar.example</text><path d="M420 225V329" class="line"/><text x="445" y="214" class="tiny">AFFECTED ASSET</text><text x="445" y="241" class="body" font-weight="600">NS-FIN-014</text><text x="445" y="261" class="small muted">Windows workstation</text><text x="445" y="286" class="tiny">CATEGORY</text><text x="445" y="307" class="body">Access / Account lockout</text>
<rect x="28" y="373" width="755" height="162" rx="5" class="surface"/><text x="49" y="401" class="tiny blue">DESCRIPTION</text><text x="49" y="430" class="body">“I’m back from vacation and my account says it’s locked. I can’t open</text><text x="49" y="450" class="body">the Finance share and payroll is due this afternoon. My colleague can</text><text x="49" y="470" class="body">still open it.”</text><text x="49" y="506" class="small muted">Already tried: Restarted the laptop twice. Same message.</text>
<rect x="28" y="553" width="755" height="123" rx="5" class="surface"/><text x="49" y="581" class="tiny blue">ACTIVITY / WORK NOTES</text><circle cx="54" cy="608" r="3" fill="#008fce"/><text x="66" y="612" class="small">Ticket opened by Maya Chen · 09:12</text><circle cx="54" cy="635" r="3" fill="#c1cbd3"/><text x="66" y="639" class="small muted">No technician actions yet</text>
<rect x="807" y="187" width="365" height="221" rx="5" class="surface"/><text x="830" y="216" class="tiny blue">TROUBLESHOOTING</text><text x="830" y="244" class="heading">Work the evidence</text><text x="830" y="271" class="small muted">One employee is affected; a colleague can</text><text x="830" y="289" class="small muted">still access the share. Inspect the user account.</text><rect x="830" y="310" width="150" height="34" rx="3" fill="#008fce"/><text x="905" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Open Tools</text><rect x="990" y="310" width="158" height="34" rx="3" fill="#fff" stroke="#cfd9df"/><text x="1069" y="331" text-anchor="middle" font-size="12" fill="#26323c">Check fix</text><text x="830" y="376" class="small muted">Hints do not affect your score.</text>
<rect x="807" y="423" width="365" height="143" rx="5" class="surface"/><text x="830" y="452" class="tiny blue">REQUIRED OUTCOME</text><circle cx="838" cy="480" r="6" fill="#f3f6f8" stroke="#aab7c0"/><text x="854" y="484" class="small">Correct user is unlocked</text><circle cx="838" cy="508" r="6" fill="#f3f6f8" stroke="#aab7c0"/><text x="854" y="512" class="small">Requester confirms sign-in</text><text x="830" y="543" class="small muted">Check fix updates this list.</text>
<rect x="807" y="581" width="365" height="95" rx="5" class="surface"/><rect x="830" y="601" width="138" height="38" rx="3" fill="#008fce"/><text x="899" y="625" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">Close Ticket</text><rect x="980" y="601" width="168" height="38" rx="3" fill="#fff" stroke="#d4dde2"/><text x="1064" y="625" text-anchor="middle" font-size="12">Escalate to Security</text><text x="830" y="660" class="small muted">Only close after verifying the fix.</text>

</svg>