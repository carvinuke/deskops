<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc">
<title id="title">DeskOps Lab tools menu</title><desc id="desc">Original schematic of a categorized top-bar tools menu in a light IT admin interface.</desc>
<defs><style>
*{box-sizing:border-box} text{font-family:Arial,Helvetica,sans-serif;fill:#26323c} .muted{fill:#6d7b87} .tiny{font-size:10px;letter-spacing:1.2px;fill:#798895} .small{font-size:12px} .body{font-size:13px} .heading{font-size:17px;font-weight:600} .blue{fill:#008fce} .line{stroke:#dfe5e9;stroke-width:1} .surface{fill:#fff;stroke:#dfe5e9;stroke-width:1} .subtle{fill:#f7f9fb} .pale{fill:#edf8fd} .mono{font-family:Consolas,monospace}
</style></defs>
<rect width="100%" height="100%" rx="8" fill="#f7f9fb" stroke="#dce3e8"/>

<rect x="1" y="1" width="798" height="54" rx="7" fill="#fff"/><path d="M1 55H799" class="line"/>
<rect x="22" y="15" width="26" height="26" rx="5" class="pale" stroke="#9ddcf2"/><path d="M28 21h14v10H28z M31 34h8" fill="none" stroke="#008fce" stroke-width="1.8"/><text x="60" y="33" font-size="17" font-weight="700">DeskOps Lab</text><text x="260" y="33" class="small muted">Dashboard</text><rect x="322" y="10" width="76" height="34" rx="4" class="pale" stroke="#b6e5f5"/><text x="360" y="31" text-anchor="middle" class="small blue" font-weight="600">Tools⌃</text>
<rect x="252" y="58" width="470" height="626" rx="5" fill="#fff" stroke="#d8e1e6"/><text x="278" y="91" class="tiny blue">INFRASTRUCTURE</text>
<rect x="273" y="102" width="427" height="54" rx="3" fill="#fff"/><text x="291" y="125" font-size="18" fill="#008fce">▦</text><text x="326" y="122" class="body" font-weight="600">Directory</text><text x="326" y="140" class="small muted">Accounts, permissions and sign-in state</text><rect x="273" y="159" width="427" height="54" rx="3" fill="#fff"/><text x="291" y="182" font-size="18" fill="#008fce">▤</text><text x="326" y="179" class="body" font-weight="600">Server Room</text><text x="326" y="197" class="small muted">Network devices and shared services</text><rect x="273" y="216" width="427" height="54" rx="3" fill="#fff"/><text x="291" y="239" font-size="18" fill="#008fce">▣</text><text x="326" y="236" class="body" font-weight="600">Remote Desktop</text><text x="326" y="254" class="small muted">Connect to a user workstation</text><rect x="273" y="273" width="427" height="54" rx="3" fill="#fff"/><text x="291" y="296" font-size="18" fill="#008fce">▥</text><text x="326" y="293" class="body" font-weight="600">Computer Deployment</text><text x="326" y="311" class="small muted">Build and provision a new PC</text><rect x="273" y="330" width="427" height="54" rx="3" fill="#fff"/><text x="291" y="353" font-size="18" fill="#008fce">▱</text><text x="326" y="350" class="body" font-weight="600">PC Shelf</text><text x="326" y="368" class="small muted">View spare and loan equipment</text><path d="M274 414H700" class="line"/><text x="278" y="441" class="tiny blue">EMAIL</text><text x="291" y="410" font-size="18" fill="#008fce">✉</text><text x="326" y="407" class="body" font-weight="600">Mail Admin</text><text x="326" y="425" class="small muted">Message trace, mailbox and inbox rules</text><text x="291" y="467" font-size="18" fill="#008fce">◇</text><text x="326" y="464" class="body" font-weight="600">Mail Security</text><text x="326" y="482" class="small muted">Review and release quarantined mail</text><path d="M274 562H700" class="line"/><text x="278" y="589" class="tiny blue">KNOWLEDGE</text><text x="291" y="622" font-size="18" fill="#008fce">▤</text><text x="326" y="618" class="body" font-weight="600">Documentation</text><text x="326" y="636" class="small muted">Search procedures and troubleshooting notes</text><text x="278" y="665" class="tiny">MANAGEMENT</text>
<rect x="30" y="90" width="190" height="135" rx="5" class="surface"/><text x="49" y="117" class="tiny">DESIGN NOTE</text><text x="49" y="143" class="body" font-weight="600">Top-bar first</text><text x="49" y="165" class="small muted">No permanent sidebar.</text><text x="49" y="182" class="small muted">Group consoles by how an</text><text x="49" y="199" class="small muted">IT team owns the work.</text>
<rect x="30" y="245" width="190" height="159" rx="5" class="surface"/><text x="49" y="272" class="tiny">VISUAL RULE</text><text x="49" y="300" class="body" font-weight="600">Neutral by default</text><text x="49" y="322" class="small muted">Use blue for active states</text><text x="49" y="339" class="small muted">and actions. Keep priority</text><text x="49" y="356" class="small muted">colors reserved for ticket</text><text x="49" y="373" class="small muted">urgency and status.</text>
<rect x="30" y="424" width="190" height="132" rx="5" class="surface"/><text x="49" y="451" class="tiny">BEHAVIOR</text><text x="49" y="479" class="body" font-weight="600">Real tool state</text><text x="49" y="501" class="small muted">Actions in one console</text><text x="49" y="518" class="small muted">must update the same</text><text x="49" y="535" class="small muted">ticket and entity data.</text>

</svg>