<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskOps Lab</title>
<!--
  DeskOps Lab — an offline IT service-desk training sandbox.
  Everything (styles, data, icons, logic) lives in this one file. No network, no login.
  Every account, device, mailbox and command is fictional local game state.
-->
<style>
/* ===== Tokens ===== */
:root{
  --bg:#F6F8FA; --surface:#fff; --text:#20252B; --text2:#66717D; --muted:#6B7682; --line:#DFE4E8;
  --blue:#0098D7; --blue-d:#0083BA; --blue-bg:#EDF8FE;
  --crit:#C8262E; --high:#B9531B; --med:#93650A; --low:#7A6C22;
  --ok:#1F7A54; --warn:#94600F; --off:#7E8892; --down:#B4363C;
  --r:6px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
/* ===== Base ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:28px;line-height:1.2}
h2{font-size:18px}
h3{font-size:15px}
p{margin:.3em 0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--text2)}
.small{font-size:12px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.label.blue{color:var(--blue)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hide{display:none!important}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#c6ced5;background:#fafbfc}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--crit);border-color:#efc3c5}
.btn.danger.solid{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{color:var(--off);background:#f3f5f7;border-color:var(--line);cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-weight:500}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical}
input[type=search]{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card>.hd{padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.card>.bd{padding:16px 20px}
.card+.card{margin-top:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--crit)}.dot.warn{background:var(--warn)}
.st{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.st.ok{color:var(--ok)}.st.bad{color:var(--down)}.st.warn{color:var(--warn)}.st.off{color:var(--muted)}
.pri{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.pri::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.pri.critical{color:var(--crit)}.pri.high{color:var(--high)}.pri.medium{color:var(--med)}.pri.low{color:var(--low)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);background:#fff}
.chip.blue{background:var(--blue-bg);border-color:#bfe3f5;color:#0077a8}
.chip.ok{background:#eaf6f0;border-color:#bfe2d0;color:var(--ok)}
.chip.bad{background:#fdeeee;border-color:#f2c6c8;color:var(--down)}
.chip.warn{background:#fdf5e8;border-color:#efd9b3;color:var(--warn)}
.note{border-left:3px solid var(--blue);background:var(--blue-bg);padding:10px 12px;border-radius:4px;margin:10px 0}
.note.warn{border-color:var(--warn);background:#fdf6ea}
.note.bad{border-color:var(--crit);background:#fdf0f0}
.note.ok{border-color:var(--ok);background:#ecf7f1}
.bar{height:6px;background:#eef1f4;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.hot>i{background:var(--crit)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--blue-bg)}
.tablewrap{overflow-x:auto}
.empty{padding:28px 20px;text-align:center;color:var(--text2)}

/* ===== Top bar ===== */
#topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 20px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:22px;background:none;border:0;cursor:pointer;padding:0}
.brand svg{flex:none}
.nav{background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text2);font-weight:500}
.nav:hover{color:var(--text);background:#f2f4f6}
.nav.on{color:var(--blue)}
.topright{margin-left:auto;display:flex;align-items:center;gap:14px}
#pts{color:var(--blue);font-weight:600;white-space:nowrap}
.who{text-align:right;line-height:1.2;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:6px}
.who:hover{background:#f2f4f6}
.who b{display:block;font-size:13px}
#memNote{background:#fdf6ea;border-bottom:1px solid #efd9b3;color:#7a5410;font-size:12.5px;padding:6px 20px}

/* ===== Popovers / menus ===== */
[popover]{margin:0;inset:auto;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;box-shadow:0 8px 28px rgba(20,30,40,.12);max-width:calc(100vw - 16px);color:var(--text)}
.menu button{display:flex;width:100%;text-align:left;gap:12px;align-items:flex-start;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--blue-bg)}
.menu .grp{padding:10px 10px 4px;border-top:1px solid var(--line);margin-top:4px}
.menu .grp:first-child{border-top:0;margin-top:0}
.toolsgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;width:560px}
.toolsgrid .grp{grid-column:span 1}
.tico{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;flex:none;color:var(--blue)}
.menu .tn{font-weight:600;display:block}
.menu .td{font-size:12px;color:var(--text2)}
.prof{width:290px;padding:14px}
.prof label{display:flex;gap:8px;align-items:center;margin:8px 0}

/* ===== Layout ===== */
#app{min-height:calc(100vh - 56px)}
.wrap{max-width:1220px;margin:0 auto;padding:24px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:22px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:end}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:11px 20px;cursor:pointer}
.qrow:hover,.qrow:focus-visible{background:#f8fbfd}
.qrow:last-child{border-bottom:0}
.qrow .t{font-weight:600;display:block;margin:1px 0}
.qrow .chev{color:var(--muted)}
.svc{display:flex;align-items:center;gap:10px;padding:6px 0}
.svc span:nth-child(2){flex:1}
.act-item{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.act-item:last-child{border-bottom:0}

/* ===== Ticket ===== */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;margin-top:20px;align-items:start}
.thead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ttitle{font-size:26px;margin:8px 0 10px}
.avatar{width:28px;height:28px;border-radius:50%;background:#e9eef2;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--text2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two>div+div{border-left:1px solid var(--line);padding-left:20px}
.objs{list-style:none;padding:0;margin:8px 0}
.objs li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.objs .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid #c3ccd4;flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#fff}
.objs .ck.y{background:var(--ok);border-color:var(--ok)}
.hints{margin:8px 0 0;padding-left:18px}
.hints li{margin:4px 0}
.log{list-style:none;padding:0;margin:0}
.log li{display:flex;gap:10px;padding:5px 0;font-size:13px}
.log li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.log li.sys::before{background:#c8d0d6}
.log .tm{color:var(--muted);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.banner{border-radius:8px;padding:12px 16px;margin-top:14px;display:flex;gap:12px;align-items:center}
.banner.ok{background:#ecf7f1;border:1px solid #bfe2d0}

/* ===== Split view ===== */
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.split>.split-tabs{display:none}
.tside .card>.bd{padding:14px 16px}
.tside .ttitle{font-size:18px}

/* ===== Consoles ===== */
.console{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:520px}
.chd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chd h2{font-size:17px;display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--text2);font-weight:500;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.cbody{padding:18px}
.flash{margin:12px 18px 0;padding:9px 12px;border-radius:6px;background:var(--blue-bg);border:1px solid #c7e7f6;font-size:13px}
.flash.warn{background:#fdf6ea;border-color:#efd9b3}
.dir{display:grid;grid-template-columns:240px 150px minmax(0,1fr);min-height:470px}
.dir>div{padding:14px}
.dir>div+div{border-left:1px solid var(--line)}
.ulist{list-style:none;margin:10px 0 0;padding:0}
.ulist button{width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:6px;cursor:pointer}
.ulist button:hover{background:#f4f6f8}
.ulist button.on{background:var(--blue-bg)}
.ulist small{display:block;color:var(--text2)}
.vtabs button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text2)}
.vtabs button.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:10px 0}
.kv dt{color:var(--text2)}
.kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:20px;margin:4px 0 2px}
.topo{width:100%;height:auto;max-width:820px;display:block;margin:0 auto}
.topo .node{cursor:pointer}
.topo .node:focus{outline:none}
.topo .node:focus rect,.topo .node:hover rect{stroke:var(--blue);stroke-width:2}
.kb{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:470px}
.kb>div{padding:16px}
.kb>div+div{border-left:1px solid var(--line)}
.steps li{margin:6px 0}
.mailpane{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;margin-bottom:14px}
.mailpane label{font-size:12px;color:var(--text2);display:grid;gap:3px}

/* ===== Remote desktop ===== */
.rdp{border:1px solid #1d3a4c;border-radius:8px;overflow:hidden;background:#123}
.rdp.max{position:fixed;inset:8px;z-index:20;display:flex;flex-direction:column}
.rdpbar{display:flex;gap:10px;align-items:center;background:#0d2433;color:#d6e6ef;padding:7px 12px;font-size:12.5px;flex-wrap:wrap}
.rdpbar .btn{background:#17384b;border-color:#2b5068;color:#e5f1f7}
.desk{position:relative;min-height:470px;flex:1;background:linear-gradient(160deg,#1b4a63 0%,#123a4f 45%,#0e2d3e 100%);padding:16px}
.desk::after{content:"";position:absolute;right:-60px;bottom:-60px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.04);pointer-events:none}
.icons{display:grid;grid-template-columns:repeat(auto-fill,84px);gap:8px;position:relative;z-index:1}
.dicon{background:none;border:0;color:#eaf4f9;display:grid;justify-items:center;gap:5px;padding:8px 4px;border-radius:6px;cursor:pointer;font-size:12px;text-align:center}
.dicon:hover,.dicon:focus-visible{background:rgba(255,255,255,.1)}
.dicon .tico{background:rgba(255,255,255,.92);border:0;width:38px;height:38px}
.win{position:absolute;z-index:2;left:120px;top:24px;right:24px;bottom:56px;background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.win .wt{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;gap:8px}
.win .wb{padding:14px;overflow:auto;flex:1}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:40px;background:rgba(6,20,29,.85);display:flex;align-items:center;gap:6px;padding:0 10px;color:#d6e6ef;font-size:12px;z-index:3}
.taskbar .tb{background:none;border:0;color:#d6e6ef;padding:6px 10px;border-radius:4px;cursor:pointer}
.taskbar .tb.on{background:rgba(255,255,255,.14)}
.term{background:#0f1a22;color:#cfe3ee;font-family:var(--mono);font-size:12.5px;border-radius:6px;padding:10px;min-height:240px;white-space:pre-wrap;overflow:auto;max-height:320px}
.termin{display:flex;gap:6px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:12.5px}
.termin input{flex:1;font-family:var(--mono)}

/* ===== Dialog / toasts ===== */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,calc(100vw - 24px));box-shadow:0 18px 50px rgba(20,30,40,.22);color:var(--text)}
dialog::backdrop{background:rgba(20,30,40,.35)}
.dh{padding:18px 22px 6px}
.db{padding:6px 22px 14px}
.df{padding:12px 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.prev{border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:10px}
.prev div{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:13px}
.prev .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:#20252B;color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.warn{background:#7a4a0c}

/* ===== Responsive ===== */
@media (max-width:1099px){
  .split{grid-template-columns:1fr}
  .split>.split-tabs{display:flex;gap:4px;margin-bottom:4px}
  .split.pane-tool .tside,.split.pane-ticket .tmain{display:none}
  .tgrid{grid-template-columns:1fr}
  .dash{grid-template-columns:1fr}
}
@media (max-width:860px){
  .dir,.kb{grid-template-columns:1fr}
  .dir>div+div,.kb>div+div{border-left:0;border-top:1px solid var(--line)}
  .stats{grid-template-columns:1fr 1fr}
  .mailpane{grid-template-columns:1fr 1fr}
  .toolsgrid{grid-template-columns:1fr;width:min(340px,calc(100vw - 16px))}
  .two{grid-template-columns:1fr}
  .two>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}
  .win{left:8px;right:8px;top:8px}
  .kv{grid-template-columns:120px 1fr}
}
@media (max-width:640px){
  .wrap{padding:16px}
  #topbar{padding:0 10px;gap:0}
  .brand span,.who small,.navtxt,#navDash{display:none}
  .brand{margin-right:6px}
  .topright{gap:8px}
  h1{font-size:23px}
  .ttitle{font-size:21px}
  td,th{padding:8px 6px}
  .qrow{padding:11px 14px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.qrow,.nav,.tab{transition:background-color .15s,border-color .15s,color .15s}
}
</style>
</head>
<body>
<header id="topbar">
  <button class="brand" data-act="go" data-id="dash" aria-label="DeskOps Lab dashboard">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="6" fill="#EDF8FE" stroke="#0098D7"/><rect x="6" y="7" width="12" height="9" rx="1.5" fill="none" stroke="#0098D7" stroke-width="1.6"/><rect x="10" y="11" width="12" height="9" rx="1.5" fill="#fff" stroke="#0098D7" stroke-width="1.6"/></svg>
    <span>DeskOps Lab</span>
  </button>
  <button class="nav" id="navDash" data-act="go" data-id="dash">Dashboard</button>
  <button class="nav" id="navTools" popovertarget="toolsPop">Tools ▾</button>
  <button class="nav" data-act="guide"><span class="navtxt">Shift </span>Guide</button>
  <div class="topright">
    <span id="pts" aria-live="polite">0 pts</span>
    <button class="who" popovertarget="profPop" aria-label="Profile and settings"><small class="label">Local technician</small><b id="who">Technician</b></button>
  </div>
</header>
<div id="memNote" class="hide" role="status">This browser is blocking local storage, so progress lives in memory and will be lost when the tab closes.</div>
<div id="toolsPop" popover class="menu"></div>
<div id="profPop" popover class="menu prof"></div>
<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   1. SEED — static content (tickets, articles) and the initial world.
   Ticket text/objectives live here in code; only mutable state is saved.
   ===================================================================== */
const PRI = {
  critical:{w:'Critical', rank:0, pts:30, pen:20},
  high:    {w:'High',     rank:1, pts:22, pen:15},
  medium:  {w:'Medium',   rank:2, pts:15, pen:10},
  low:     {w:'Low',      rank:3, pts:10, pen:10}
};
const GROUPS = ['Domain Users','Finance-Share','Sales-Share','HR-Share','Support-Share','Operations-Share','Executive-Share'];
const SHARES = [
  {path:'\\\\FILE01\\Finance', group:'Finance-Share', files:['Payroll_Oct.xlsx','Supplier_Payments.xlsx','Month_End_Checklist.docx']},
  {path:'\\\\FILE01\\Sales', group:'Sales-Share', files:['Pipeline_Q4.xlsx','Pricing_2026.pdf','Client_Notes']},
  {path:'\\\\FILE01\\HR', group:'HR-Share', files:['Onboarding','Policies','Starters_October.xlsx']},
  {path:'\\\\FILE01\\Support', group:'Support-Share', files:['Runbooks','Escalation_Contacts.docx']},
  {path:'\\\\FILE01\\Operations', group:'Operations-Share', files:['Facilities_Rota.xlsx','Vendors']},
  {path:'\\\\FILE01\\Executive', group:'Executive-Share', files:['Board_Packs','Strategy_2027.pptx']},
  {path:'\\\\FILE01\\Public', group:'Domain Users', files:['Office_Map.pdf','Canteen_Menu.pdf']}
];
const HOSTS = { // name resolution for the simulated terminal
  'edge':'10.0.0.1','gateway':'10.0.0.1','firewall':'10.0.0.254','dc01':'10.0.0.10','dc02':'10.0.0.11','file01':'10.0.0.20',
  'mail01':'10.0.0.25','print01':'10.0.0.30','intranet.northstar.local':'10.0.0.40','northstar.example':'203.0.113.40','web.example':'198.51.100.7'
};
const O = (ok, done, todo) => ({ok, done, todo});
const svcUp = (s, srv, name) => s.net.servers[srv].services[name] === 'running';

const TICKETS = [
{ref:'INC-1042', pri:'high', cat:'Access / Account lockout', req:'mchen', asset:'NS-FIN-014', assetType:'Windows workstation', created:'08:12',
 title:'Account locked after returning from vacation',
 desc:'Hi, I’m back from vacation and my account says it’s locked. I can’t open the Finance share and payroll is due this afternoon. My colleague can still open it.',

const KEY = 'deskops-lab-v1';
let S, memoryOnly = false, bootNote = null;
function validSave(s){
  return s && s.v===1 && s.users && s.workstations && s.net && s.mail && s.ui && s.profile && s.tickets &&
    TICKETS.every(t=>s.tickets[t.ref]);
}
function load(){
  let raw;
  try { raw = localStorage.getItem(KEY); } catch(e){ memoryOnly = true; return seed(); }
  if (!raw) return seed();
  try { const s = JSON.parse(raw); if (validSave(s)) return s; } catch(e){}
  bootNote = 'Saved progress couldn’t be read, so a fresh shift was started.';
  return seed();
}

/* Whether a workstation is reachable and has internal (company network) access. */
function netState(s, w){
  if (!w.power) return {up:false, internal:false, why:'Powered off'};
  if (w.remote) return {up:true, internal:w.vpn.connected, why:w.vpn.connected?'Connected over VPN':'Off-site — VPN not connected'};
  const d = s.net.devices;
  if (d.edge.status!=='online' || d.fw.status!=='online') return {up:false, internal:false, why:'Core network (edge router / firewall) is down'};
  const sw = Object.values(d).find(x=>x.kind==='switch' && x.floor===w.floor);
  if (sw && sw.status!=='online') return {up:false, internal:false, why:`Unreachable: ${sw.name} is down`};
  const wifiOk = w.wifi.connected==='Northstar-Staff';
  return {up:true, internal:wifiOk, why: wifiOk ? 'On the office network' : (w.wifi.connected ? 'On guest Wi-Fi (no internal access)' : 'Wi-Fi disconnected')};
}

  /* Terminal: an allowlist of fictional commands with scripted output. Nothing reaches the host OS. */
  term(s,host,line){
    const w=s.workstations[host], n=netState(s,w), owner=w.owner||'kiosk';
    const [cmd, ...args] = line.trim().split(/\s+/); const c=(cmd||'').toLowerCase(), a=(args[0]||'').toLowerCase();
    const ip = w.remote ? '192.168.1.23' : `10.0.${w.floor}.${40+Number(w.tag.slice(-2))}`;
    if (!c) return [];
    if (c==='help') return ['Lab commands: ipconfig, ping <host>, nslookup <host>, whoami, hostname, gpupdate /force, sfc /scannow, cls'];
    if (c==='whoami') return [`northstar\\${owner}`];
    if (c==='hostname') return [host];
    if (c==='ipconfig') {
      const out = [`Wireless adapter Wi-Fi:`];
      if (w.wifi.connected) out.push(`   SSID . . . . . . . . . : ${w.wifi.connected}`, `   IPv4 Address . . . . . : ${w.wifi.connected==='Northstar-Guest'?'172.20.4.18':ip}`, `   Default Gateway  . . . : ${w.remote?'192.168.1.1':w.wifi.connected==='Northstar-Guest'?'172.20.4.1':'10.0.0.1'}`);
      else out.push('   Media State  . . . . . : Media disconnected');
      if (w.remote || w.vpn.connected) out.push('', 'VPN adapter Northstar:', w.vpn.connected?'   IPv4 Address . . . . . : 10.8.0.14':'   Media State  . . . . . : Media disconnected');
      return out;
    }
    if (c==='ping' || c==='nslookup') {
      if (!a) return [`Usage: ${c} <host>`];
      const target = HOSTS[a] ? HOSTS[a] : (/^\d+\.\d+\.\d+\.\d+$/.test(a) ? a : null);
      if (!target) return [`${c==='ping'?'Ping request could not find host':'*** Can’t find'} ${a}.`];
      const internal = target.startsWith('10.');
      const devDown = Object.values(s.net.devices).some(d=>d.ip===target && d.status!=='online');
      const reach = n.up && (internal ? n.internal && !devDown : (w.remote || w.wifi.connected));
      if (c==='nslookup') return reach||!internal ? [`Name:    ${a}`, `Address: ${target}`] : ['DNS request timed out.'];
      if (!reach) return [`Pinging ${target} with 32 bytes of data:`, 'Request timed out.', 'Request timed out.', 'Request timed out.', `Packets: Sent = 3, Received = 0 (100% loss)`];
      if (internal) w.netOk = true;
      return [`Pinging ${target} with 32 bytes of data:`, ...[3,2,4].map(t=>`Reply from ${target}: bytes=32 time=${t+(w.remote?18:0)}ms TTL=64`), 'Packets: Sent = 3, Received = 3 (0% loss)'];
    }
    if (c==='gpupdate') return n.internal ? ['Updating policy...', 'Computer Policy update has completed successfully.', 'User Policy update has completed successfully.'] : ['Updating policy...', 'The processing of policy failed: the domain controller could not be reached.'];
    if (c==='sfc') return ['Beginning system scan...', 'Verification 100% complete.', 'System File Checker did not find any integrity violations.'];

/* =====================================================================
   4. SCENARIOS — per-ticket objective checks over shared state.
   ===================================================================== */
function check(s, ref){
  const T=TK[ref], done=[], todo=[];
  T.obj.forEach(o=>{ (o.ok(s)?done:todo).push(o); });
  return {done:done.map(o=>o.done), todo:todo.map(o=>o.todo), complete:todo.length===0};
}
const isResolved = (s, ref) => s.tickets[ref].status==='assigned' && check(s,ref).complete;
function statusWord(ref){ const t=S.tickets[ref];
  if (isResolved(S,ref)) return 'Resolved';
  return {open:'Open', assigned:'Assigned', closed:'Closed', escalated:'Escalated', waiting:'Not arrived'}[t.status]; }

/* =====================================================================
   5. LIFECYCLE + SCORING
   ===================================================================== */
function notesBonus(T, notes){
  const n=(notes||'').toLowerCase(); let b=0;
  if (n.length>=40) b++;
  if (T.keys.some(k=>n.includes(k))) b++;
  if (/verif|confirm|test/.test(n)) b++;
  return b;
}
/* mode: 'close' | 'escalate'. Returns {lines:[[label,pts]], total, outcome}. */
function scoreFor(s, ref, mode, notes){
  const T=TK[ref], t=s.tickets[ref], P=PRI[T.pri], lines=[]; let outcome;
  if (mode==='escalate' && !T.security){ lines.push(['Routine escalation (work not needing Security)', -8]); outcome='Escalated'; }
  else if (mode==='escalate' || check(s,ref).complete){
    lines.push([`${P.w} ticket resolved`, P.pts]);
    if (mode==='escalate'){ const r=rule(s,'r1'); if (r.inspected && !r.deleted) lines.push(['Correct security escalation', 12]); outcome='Routed to Security'; }
    else outcome='Resolved';
    const nb=notesBonus(T,notes); if (nb) lines.push(['Resolution notes', nb]);
  } else { lines.push([`Closed while unresolved (${P.w})`, -P.pen]); outcome='Closed unresolved'; }
  Object.values(t.penalties).forEach(([p,why])=>lines.push([why,-p]));
  const raw=lines.reduce((a,l)=>a+l[1],0), total=Math.max(-20,Math.min(42,raw));
  if (total!==raw) lines.push(['Ticket score cap (−20…+42)', total-raw]);
  return {lines, total, outcome};
}
function arrivals(s){
  TICKETS.forEach(T=>{ const t=s.tickets[T.ref];
    if (t.status==='waiting' && ['closed','escalated'].includes(s.tickets[T.after].status)){
      t.status='open'; if (T.arrive) T.arrive(s);
      logEntry(s,'Service Desk',T.ref,`New ticket ${T.ref} arrived: ${T.title}`,null); } });
}
function logEntry(s, tool, entity, text, ref){
  s.log.unshift({t:now(), tool, entity, text, ref});
  if (s.log.length>400) s.log.length=400;
}
function finishTicket(ref, mode, notes){
  const t=S.tickets[ref], sc=scoreFor(S,ref,mode,notes);
  t.status = mode==='escalate' ? 'escalated' : 'closed';
  t.result = {mode, outcome:sc.outcome, lines:sc.lines, total:sc.total, notes, at:now(), model:TK[ref].model};
  S.profile.points += sc.total;
  logEntry(S,'Service Desk',ref,`${ref} ${mode==='escalate'?'escalated to Security':'closed'} · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`,ref);
  delete S.ui.drafts[ref];
  arrivals(S);
  return sc;
}

    ${items.map(x=>`<tr><td class="mono">${x.m.time}</td><td>${esc(x.m.from)}</td><td>${esc(x.m.to)}</td><td>${esc(x.m.subject)}</td><td><span class="chip ${x.kind==='phish'?'bad':'warn'}">${esc(x.reason)}</span></td>

        : `<span class="chip ${x.state==='released'?'ok':''}">${x.state==='released'?'Released · Delivered':x.reported?'Blocked · Reported':'Blocked'}</span>`}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nothing matches.</td></tr>'}</tbody></table></div></div>`;
}

function cDocs(){
  const q=(S.ui.q.kb||'').toLowerCase();
  const list=KB.filter(a=>!q || [a.title,a.cat,a.tools.join(' '),a.steps.join(' ')].some(x=>x.toLowerCase().includes(q)));
  const a=KB.find(x=>x.id===S.ui.sel.kb) || list[0];
  return `<div class="kb"><div>${search('kb','Search articles','Search documentation')}<ul class="ulist">${list.map(x=>`<li><button class="${a&&a.id===x.id?'on':''}" data-act="sel" data-id="kb" data-arg="${x.id}">${esc(x.title)}<small>${x.cat}</small></button></li>`).join('')||'<li class="muted small">No articles match.</li>'}</ul></div>
    <div>${a?`<div class="label blue">${a.cat}</div><h3 style="font-size:19px;margin:4px 0 10px">${esc(a.title)}</h3><ol class="steps">${a.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <div class="row" style="margin-top:12px"><span class="label">Tools</span>${a.tools.map(t=>`<span class="chip blue">${t}</span>`).join('')}<span class="label" style="margin-left:10px">Related</span>${a.rel.map(r=>`<span class="chip">${r}</span>`).join('')}</div>`:'<p class="muted">No article selected.</p>'}</div></div>`;
}

function cAssets(){
  const q=(S.ui.q.as||'').toLowerCase();
  const rows=Object.values(S.workstations).filter(w=>!q || [w.host,w.tag,w.serial,w.owner?S.users[w.owner].name:''].some(x=>x.toLowerCase().includes(q)));
  const sel=(host,field,opts,cur)=>`<select data-bind="asset" data-id="${host}" data-arg="${field}" data-key="as-${host}-${field}" aria-label="${field} for ${host}">${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;
  return `<div class="cbody">${search('as','Tag, hostname, serial or owner','Search assets')}
    <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Asset tag</th><th>Hostname</th><th>Owner</th><th>Serial</th><th>Warranty</th><th>Location</th><th>State</th></tr></thead><tbody>
    ${rows.map(w=>`<tr><td class="mono">${w.tag}</td><td class="mono">${w.host}<div class="small muted">${esc(w.model)}</div></td><td>${w.owner?esc(S.users[w.owner].name):'<span class="muted">Shared</span>'}</td><td class="mono">${w.serial}</td>
      <td>${w.warranty}${w.warranty<new Date().toISOString().slice(0,10)?' <span class="chip bad">Expired</span>':''}</td>
      <td>${sel(w.host,'site',[...new Set([w.site,'Floor 1','Floor 2','Floor 3','Remote (home)','IT storeroom'])],w.site)}</td><td>${sel(w.host,'state',['In use','Spare','In repair','Retired'],w.state)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No assets match.</td></tr>'}</tbody></table></div></div>`;
}
const CONSOLE = {directory:cDirectory, server:cServer, rdp:cRdp, mailadmin:cMailAdmin, mailsec:cMailSec, docs:cDocs, assets:cAssets};

/* =====================================================================
   7. EVENTS — one delegated click/input/keydown handler each.
   All environment mutations funnel through act().
   ===================================================================== */
function act(tool, entity, action, fn){
  const text = fn(S);
  const ref = S.ui.ticket && S.tickets[S.ui.ticket].status==='assigned' ? S.ui.ticket : null;
  if (text) { logEntry(S, tool, entity, text, ref); S.ui.flash = {tool, text}; }
  const key = action+':'+entity;
  TICKETS.forEach(T=>{ const p=T.penalties && T.penalties[key], t=S.tickets[T.ref];
    if (p && t.status==='assigned' && !t.penalties[key]) { t.penalties[key]=p; toast(`${T.ref}: ${p[1]} (−${p[0]} pts at close)`, 'warn'); } });
  render();
}
function hidePops(){ document.querySelectorAll('[popover]').forEach(p=>{ try { p.hidePopover(); } catch(e){} }); }
const splitArg = a => { const i=a.indexOf(':'); return i<0 ? [a,''] : [a.slice(0,i), a.slice(i+1)]; };
const danger = (title, body, ok, fn) => confirmDlg(title, `<p>${body}</p>`, ok, true, fn);

const ACT = {
  go(d){ S.ui.view=d.id; if (d.id==='dash') S.ui.ticket=null; hidePops(); render(); scrollTo(0,0); },
  open(d){ S.ui.view='ticket'; S.ui.ticket=d.id; hidePops(); render(); scrollTo(0,0); },
  tool(d){ S.ui.view='tool'; S.ui.tool=d.id; S.ui.flash=null; S.ui.tab.split='tool'; hidePops(); render(); scrollTo(0,0); },
  tab(d){ S.ui.tab[d.id]=d.arg; render(); },
  sel(d){ S.ui.sel[d.id]=d.arg; render(); },
  selDev(d){ S.ui.sel.dev=d.id; render(); },
  pastSel(d){ S.ui.past=d.id; render(); },
  claim(d){ const t=S.tickets[d.id]; t.status='assigned'; t.assignee=S.profile.name; S.ui.ticket=d.id; hidePops();
    logEntry(S,'Service Desk',d.id,`${d.id} assigned to ${S.profile.name}`,d.id); render(); },
  unclaim(d){ const t=S.tickets[d.id]; t.status='open'; t.assignee=null; hidePops();
    logEntry(S,'Service Desk',d.id,`${d.id} returned to the queue`,d.id); render(); },
  hint(d){ S.tickets[d.id].hints++; render(); },
  checkFix(d){ const t=S.tickets[d.id], c=check(S,d.id); t.checked=true;
    toast(c.complete ? `${d.id}: all requirements met.` : `${d.id}: ${c.done.length} of ${c.done.length+c.todo.length} requirements met. ${c.todo[0]}.`); render(); },
  addNote(d){ const v=$('noteIn').value.trim(); if (!v) return; S.tickets[d.id].notes.push({t:now(), text:v}); render(); },
  closeDlg(d){ hidePops(); closeDialog(d.id); },
  escalateDlg(d){ hidePops(); escalateDialog(d.id); },
  doClose(d){ const sc=finishTicket(d.id,'close',S.ui.drafts[d.id]||''); closeDlg();
    S.ui.view='past'; S.ui.past=d.id; S.ui.ticket=null; toast(`${d.id} closed · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`); render(); },
  doEscalate(d){ const notes=S.ui.drafts[d.id]||''; if (notes.trim().length<15) return;
    const sc=finishTicket(d.id,'escalate',notes); closeDlg(); S.ui.view='past'; S.ui.past=d.id; S.ui.ticket=null;
    if (d.id==='INC-1049') { const r=rule(S,'r1'); if (!r.deleted) r.action+=' — disabled by Security, evidence preserved'; }
    toast(`${d.id} escalated · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`); render(); },
  dlgCancel(){ closeDlg(); },
  confirmOk(){ const f=pendingConfirm; pendingConfirm=null; closeDlg(); if (f) f(); },
  guide(){ hidePops(); guideDialog(false); },
  startShift(){ closeDlg(); renderMenus(); render(); },
  resetDlg(){ hidePops(); danger('Reset all progress?', 'This clears your points, ticket history and every change to the simulated environment, then starts a fresh shift. It can’t be undone.', 'Reset progress',
    ()=>{ S=seed(); S.profile.firstRun=false; renderMenus(); render(); guideDialog(true); toast('Progress reset. Fresh shift started.'); }); },

  dir(d){ const id=d.id, u=S.users[id], run=op=>act('Directory', id, op, s=>ENV[op](s,id));
    if (d.arg==='disable') return danger(`Disable ${u.id}?`, `${esc(u.name)} won’t be able to sign in until the account is enabled again.`, 'Disable account', ()=>run('disable'));
    if (d.arg==='resetMfa') return danger(`Reset MFA for ${u.id}?`, `Only do this after confirming the caller’s identity. ${esc(first(u.name))} will have to re-enrol a device at next sign-in.`, 'Reset MFA', ()=>run('resetMfa'));
    if (d.arg==='resetPassword') return confirmDlg(`Reset password for ${u.id}`, `<p>A temporary lab password will be issued. No real password is set or stored.</p>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mustChk" checked> User must change password at next sign-in</label>`, 'Reset password', false,
      ()=>{ const must=$('mustChk').checked; act('Directory', id, 'resetPassword', s=>ENV.resetPassword(s,id,must)); });
    run(d.arg); },
  dirGroup(d){ const [op,g]=splitArg(d.arg), grp = op==='add' ? $('grpSel').value : g;
    act('Directory', d.id, op+'Group', s=>op==='add' ? ENV.addGroup(s,d.id,grp) : ENV.removeGroup(s,d.id,grp)); },
  dev(d){ const x=S.net.devices[d.id], run=()=>act('Server Room', d.id, d.arg, s=>ENV[d.arg](s,d.id));
    if ((x.kind==='router'||x.kind==='firewall') && d.arg!=='on') return danger(`${d.arg==='off'?'Power off':'Reboot'} ${x.name}?`, `Every floor depends on the ${x.name}. ${d.arg==='off'?'Powering it off cuts the whole office off':'A reboot drops the whole office for about two minutes'}.`, d.arg==='off'?'Power off':'Reboot anyway', run);
    if (d.arg==='off' && x.kind!=='printer') return danger(`Power off ${x.name}?`, `Everything connected through ${x.name} will lose its network.`, 'Power off', run);
    run(); },
  srvAct(d){ act('Server Room', d.id, d.arg, s=>d.arg==='testPage' ? ENV.testPage(s) : ENV.rebootServer(s,d.id)); },
  svc(d){ const [op,n]=splitArg(d.arg), stop=op==='stop';
    act('Server Room', d.id, stop?'stopService':'restartService', s=>stop ? ENV.stopService(s,d.id,n) : ENV.restartService(s,d.id,op)); },

  rdpConnect(d){ const w=S.workstations[d.id];
    confirmDlg(`Remote session to ${w.host}`, `<p>Owner: <b>${w.owner?esc(S.users[w.owner].name):'Shared device'}</b> · ${esc(w.site)}</p>
      ${kv([['Sign in as','<span class="mono">NORTHSTAR\\svc-deskops-lab</span>'],['Credential','Lab service credential (simulated, nothing stored)']])}
      <p class="muted small">Sessions are simulated inside this page. No real machine is contacted.</p>`, 'Connect', false,
      ()=>{ S.ui.rdp={host:w.host, app:null, max:false}; S.ui.sel.share=null; logEntry(S,'Remote Desktop',w.host,`Remote session opened to ${w.host}`,S.ui.ticket); render(); }); },
  rdpOff(){ logEntry(S,'Remote Desktop',S.ui.rdp.host,`Remote session to ${S.ui.rdp.host} closed`,S.ui.ticket); S.ui.rdp=null; render(); },
  rdpMax(){ S.ui.rdp.max=!S.ui.rdp.max; render(); },
  rdpApp(d){ S.ui.rdp.app=d.id||null; S.ui.sel.share=null; render(); },
  rdpAct(d){ const [op,arg]=splitArg(d.arg);
    act('Remote Desktop', d.id, op, s=>{ const r=ENV[op](s,d.id,arg); if (op==='openShare') S.ui.sel.share = r.startsWith('Opened') ? arg : null; return r; }); },

  trace(){ const f={who:S.ui.q.traceWho, status:S.ui.q.traceStatus, time:S.ui.q.traceTime};
    act('Mail Admin','trace','trace', s=>{ S.ui.trace=ENV.trace(s,f); return `Message trace${f.who?` for “${f.who}”`:''} returned ${S.ui.trace.length} result${S.ui.trace.length===1?'':'s'}.`; }); },
  mb(d){ const gb=Number(($('quotaSel')||{}).value||5);
    act('Mail Admin', d.id, d.arg, s=>d.arg==='setQuota' ? ENV.setQuota(s,d.id,gb) : ENV[d.arg](s,d.id)); },
  rule(d){ const r=rule(S,d.id);
    if (d.arg==='inspect') { S.ui.sel.rule=d.id; return act('Mail Admin', d.id, 'inspectRule', s=>ENV.inspectRule(s,d.id)); }
    danger(`Delete rule “${r.name}”?`, r.external ? 'This rule looks like a compromise indicator. Deleting it destroys evidence Security needs, and the attacker may still have access. Escalating is the safe path.' : 'The rule will be removed from the mailbox.',
      r.external ? 'Delete anyway' : 'Delete rule', ()=>act('Mail Admin', d.id, 'deleteRule', s=>ENV.deleteRule(s,d.id))); },
  qAct(d){ const q=S.mail.quarantine.find(x=>x.id===d.id), run=()=>act('Mail Security', d.id, d.arg, s=>ENV[d.arg](s,d.id));
    if (d.arg==='release' && q.kind==='phish') return danger('Release a phishing message?', 'The filter scored this as a credential-harvest attempt. Releasing it puts a live phishing link in a user’s inbox. Keep it blocked or report it to Security instead.', 'Release anyway', run);
    run(); }
};

/* Two-way bindings for inputs: search boxes, selects, checkboxes, drafts. */
const BIND = {
  q(el){ S.ui.q[el.dataset.id]=el.value; render(); },
  sel(el){ S.ui.sel[el.dataset.id]=el.value; render(); },
  name(el){ S.profile.name=el.value.trim()||'Technician'; $('who').textContent=S.profile.name; save(); },
  hints(el){ S.settings.hints=el.checked; render(); },
  split(el){ S.settings.split=el.checked; render(); },
  draft(el){ const ref=el.dataset.id; S.ui.drafts[ref]=el.value; save();
    $('cnt').textContent = `${el.value.length}/600` + (el.dataset.esc?' · at least 15 characters':'');
    $('prev').innerHTML = prevHtml(scoreFor(S, ref, el.dataset.esc?'escalate':'close', el.value));
    if (el.dataset.esc) $('closeGo').disabled = el.value.trim().length<15; },
  vpnProfile(el){ act('Remote Desktop', el.dataset.id, 'vpnProfile', s=>ENV.vpnProfile(s, el.dataset.id, el.value)); },
  asset(el){ act('Asset Management', el.dataset.id, 'setAsset', s=>ENV.setAsset(s, el.dataset.id, el.dataset.arg, el.value)); }
};
function runTerm(el){
  const host=el.dataset.term, line=el.value; if (!line.trim()) return;
  const out=ENV.term(S, host, line), prev=S.ui.term[host]||[];
  S.ui.term[host] = /^\s*cls\b/i.test(line) ? [] : prev.concat([`${host}> ${line}`], out).slice(-80);
  logEntry(S,'Remote Desktop',host,`Ran “${line.trim()}” on ${host}`, S.ui.ticket && S.tickets[S.ui.ticket].status==='assigned' ? S.ui.ticket : null);
  render(); const t=app.querySelector('.term'); if (t) t.scrollTop=t.scrollHeight;
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f=ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset); }
});
document.addEventListener('input', e=>{ const el=e.target, f=el.dataset && BIND[el.dataset.bind]; if (f) f(el); });
document.addEventListener('keydown', e=>{
  const el=e.target;
  if (e.key==='Enter' && el.dataset && el.dataset.term) { e.preventDefault(); runTerm(el); return; }
  if (e.key==='Enter' && el.id==='noteIn') { e.preventDefault(); ACT.addNote({id:S.ui.ticket}); return; }
  if ((e.key==='Enter'||e.key===' ') && el.getAttribute && el.getAttribute('role')==='button' && el.tagName!=='BUTTON') { e.preventDefault(); el.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if (e.key==='Escape' && !dlg.open && S.ui.rdp && S.ui.rdp.max) { S.ui.rdp.max=false; render(); }
});
/* Place popovers under the button that opened them. */
document.addEventListener('toggle', e=>{
  const p=e.target; if (!p.matches || !p.matches('[popover]') || e.newState!=='open') return;
  const b=document.activeElement && document.activeElement.getAttribute('popovertarget')===p.id ? document.activeElement : document.querySelector(`[popovertarget="${p.id}"]`);
  if (!b) return; const r=b.getBoundingClientRect();
  p.style.top=(r.bottom+6)+'px'; p.style.left=Math.max(8, Math.min(r.left, innerWidth-p.offsetWidth-8))+'px';
}, true);

/* =====================================================================
   8. SELF-TEST — runs every scenario from a fresh seed (open index.html#selftest).
   ===================================================================== */
function selfTest(){
  const out=[], ok=(c,n)=>out.push([!!c,n]), done=(s,r)=>check(s,r).complete;
  const fresh=ref=>{ const s=seed(), T=TK[ref]; if (T.after){ s.tickets[T.after].status='closed'; arrivals(s); } return s; };
  let s, s2;
  s=fresh('INC-1042'); ok(!done(s,'INC-1042'),'1042 not complete at seed');
  ENV.resetPassword(s,'mchen',true); ok(!done(s,'INC-1042'),'1042 password reset alone does not unlock');
  ENV.unlock(s,'mchen'); ok(done(s,'INC-1042'),'1042 unlock completes it');
  s=fresh('INC-1043'); ENV.unlock(s,'ebrooks'); ok(!done(s,'INC-1043') && check(s,'INC-1043').done.length===1,'1043 unlock alone is partial');
  ENV.resetPassword(s,'ebrooks',true); ok(!done(s,'INC-1043'),'1043 still needs a sign-in test');
  ENV.testSignIn(s,'ebrooks'); ok(done(s,'INC-1043'),'1043 complete after unlock + reset + test');
  s=fresh('INC-1044'); ok(s.tickets['INC-1044'].status==='open' && !s.users.mchen.groups.includes('Finance-Share'),'1044 arrives after 1042 and removes the group');
  ok(seed().tickets['INC-1044'].status==='waiting','1044 waits at seed');
  ENV.unlock(s,'mchen'); ENV.resetPassword(s,'mchen',false); ok(!done(s,'INC-1044'),'1044 password reset does not fix permissions');
  ENV.addGroup(s,'mchen','Finance-Share'); ok(!done(s,'INC-1044') && ENV.openShare(s,'NS-FIN-014','\\\\FILE01\\Finance').includes('denied'),'1044 needs a session refresh');
  ENV.refreshSession(s,'mchen'); ok(done(s,'INC-1044') && ENV.openShare(s,'NS-FIN-014','\\\\FILE01\\Finance').startsWith('Opened'),'1044 complete and share opens');
  s=fresh('INC-1045'); ok(!netState(s,s.workstations['NS-MKT-011']).up,'Floor 3 hosts offline at seed');
  ENV.reboot(s,'edge'); ok(!done(s,'INC-1045'),'1045 core reboot is not the fix');
  ENV.on(s,'sw3'); ok(done(s,'INC-1045') && netState(s,s.workstations['NS-MKT-011']).up,'1045 switch restores Floor 3');
  s=fresh('INC-1046'); ENV.connectWifi(s,'NS-OPS-021','Northstar-Staff'); ok(s.workstations['NS-OPS-021'].wifi.connected===null,'1046 broken profile cannot connect');
  ENV.forgetWifi(s,'NS-OPS-021','Northstar-Staff'); ENV.connectWifi(s,'NS-OPS-021','Northstar-Staff'); ok(!done(s,'INC-1046'),'1046 still needs a connectivity test');
  ENV.term(s,'NS-OPS-021','ping 10.0.0.1'); ok(done(s,'INC-1046'),'1046 complete after ping');
  s=fresh('INC-1047'); ENV.trace(s,{who:'priya'}); ok(!done(s,'INC-1047'),'1047 trace alone does not fix');
  ENV.release(s,'q1'); ok(!done(s,'INC-1047'),'1047 needs delivery confirmed');
  ENV.trace(s,{who:'priya'}); ok(done(s,'INC-1047'),'1047 complete after re-trace');
  s=fresh('INC-1048'); ENV.testMail(s,'awilson'); ok(!done(s,'INC-1048'),'1048 test bounces while full');
  ENV.enableArchive(s,'awilson'); ENV.testMail(s,'awilson'); ok(done(s,'INC-1048'),'1048 complete after archive + test');
  s=fresh('INC-1049'); ENV.inspectRule(s,'r1'); s.tickets['INC-1049'].status='escalated'; ok(done(s,'INC-1049'),'1049 complete when inspected + escalated');
  s2=fresh('INC-1049'); ENV.inspectRule(s2,'r1'); ENV.deleteRule(s2,'r1'); s2.tickets['INC-1049'].status='escalated'; ok(!done(s2,'INC-1049'),'1049 deleting the rule is not rewarded');
  s=fresh('INC-1050'); ENV.reboot(s,'prn1'); ok(!done(s,'INC-1050'),'1050 printer reboot is not the fix');
  ENV.restartService(s,'PRINT01','Print Spooler'); ENV.testPage(s); ok(done(s,'INC-1050'),'1050 complete after spooler + test page');
  s=fresh('INC-1051'); ENV.vpnConnect(s,'NS-SALES-008'); ok(!s.workstations['NS-SALES-008'].vpn.connected,'1051 legacy profile fails');
  ENV.vpnProfile(s,'NS-SALES-008','Northstar-Staff'); ENV.vpnConnect(s,'NS-SALES-008'); ENV.term(s,'NS-SALES-008','ping file01'); ok(done(s,'INC-1051'),'1051 complete after profile + connect + ping');
  ok(ENV.term(seed(),'NS-OPS-021','rm -rf /')[0].includes('not recognized'),'terminal rejects unknown commands');
  s=fresh('INC-1042'); ENV.unlock(s,'mchen'); ok(scoreFor(s,'INC-1042','close','Unlocked mchen in Directory and confirmed Maya can sign in.').total===25,'score: High + full notes bonus = 25');
  ok(scoreFor(fresh('INC-1045'),'INC-1045','close','').total===-20,'score: unresolved Critical close = −20');
  s=fresh('INC-1049'); ENV.inspectRule(s,'r1'); ok(scoreFor(s,'INC-1049','escalate','Rule forwards all mail to external-archive@outside.example').total===42,'score: security escalation capped at +42');
  ok(scoreFor(fresh('INC-1042'),'INC-1042','escalate','not security').total===-8,'score: routine escalation = −8');
  return {pass: out.every(r=>r[0]), results: out};
}
window.selfTest = selfTest;

/* ===== Boot ===== */
S = load();
if (memoryOnly) $('memNote').classList.remove('hide');
renderMenus(); render();
if (bootNote) toast(bootNote, 'warn');
if (location.hash==='#selftest') {
  const r=selfTest();
  openDlg(`<div class="dh"><h2 id="dlgTitle">Self-test: ${r.pass?'all passed':'FAILURES'}</h2></div><div class="db"><ul class="objs">${r.results.map(([p,n])=>`<li><span class="ck ${p?'y':''}">${p?'✓':''}</span><span>${esc(n)}</span></li>`).join('')}</ul></div><div class="df"><button class="btn primary" data-act="dlgCancel">Close</button></div>`);
} else if (S.profile.firstRun) { S.profile.firstRun=false; save(); guideDialog(true); }
</script>
