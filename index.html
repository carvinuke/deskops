   addPerson(s, user('tmorgan','Tara Morgan','Marketing','Designer',3,'4911',null,[],{enabled:false, presence:'offline', lastSignIn:'Jul 31, 16:05', licences:['office'], startDate:'2022-03-01'}), null,
     mbx(1.2,null,{type:'shared', name:'Tara Morgan (left)', address:'tara.morgan@northstar.example', owner:'hlindqvist', quotaGB:50, policy:'Leaver mailbox. Hannah Lindqvist reviews it.'}));
   s.hr.leavers.push({id:'HR-LVR-0071', user:'tmorgan', lastDay:'Fri Jul 31', manager:'Hannah Lindqvist', notes:'Mailbox already converted to shared. Keep the account disabled for the 2-year retention. Licences can be reclaimed.'});
   s.licences.office.total=licUsed(s,'office').length; s.chat.facts.lostBefore1063=lost; },
 title:'Back from parental leave: account disabled',
 desc:'(Company Chat, from Maya Chen’s account) “Hi IT, it’s Leah Fontaine, I’m borrowing Maya’s PC. First day back from parental leave and my laptop says ‘Your account has been disabled’. I’m at my old desk on Floor 2 and my desk phone works. Could you help me get back in today? I have month-end reconciliations waiting.”',
 impact:'One returning Finance analyst is fully blocked during month-end.',
 tried:'Tried her password on her laptop and on webmail. Same message both times.',
 hints:['The chat came from Maya’s account. Who are you actually talking to? Then read the HR note on Leah’s Directory record: more than one thing changed while she was away.',
   'Verify Leah through her own record (desk extension x4418 or her registered mobile). Then check Licences: the Office pool is full, so look for a seat held by someone who has left.',
   'Verify identity… (callback to number on record), Enable account, Reset password… (must change, read to user on the verified call), remove Office Suite from leaver tmorgan in Licence pools and assign it to Leah, Test sign-in, then Remote Desktop › NS-FIN-027 › Office Suite › Refresh licence.'],
 model:'The request arrived through Maya Chen’s chat account, so I verified Leah by calling her desk extension on record (x4418); she confirmed employee ID E44181. The parental-leave workflow (LOA-0193, return date today) had disabled her account, her password had expired during leave, and her Office licence had been released. Re-enabled the account and read a temporary password to her on the verified call, set to change at next sign-in. The Office Suite pool was full, so I reclaimed the seat still held by leaver Tara Morgan (left Jul 31) and assigned it to Leah. The sign-in test passed and Office shows as licensed on NS-FIN-027 after a licence refresh.',
 keys:['lfontaine','leah','loa-0193','tmorgan','callback','e44181'],
 penalties:{'enable:lfontaine':[3,'Re-enabled an account on a request from Maya’s chat without confirming who was typing', s=>!leahVerified(s)],
   'resetPassword:lfontaine':[3,'Reset a password on a request from Maya’s chat without confirming who was typing', s=>!leahVerified(s)],
   'resetPassword:lfontaine#to':[2,'Sent Leah’s temporary password somewhere other than the verified call, where Maya or someone else could read it', (s,a)=>!!a[2] && a[2]!=='tech'],
   'removeLicence:*':[3,'Took Office Suite from an active colleague: they just lost Word, Excel and Outlook mid-day', (s,a)=>{ const u=s.users[a[0]]; return a[1]==='office' && !!u && u.enabled && !u.deleted && u.id!=='lfontaine' && !s.hr.leavers.some(l=>l.user===u.id); }],
   'createUser:*':[3,'Created a second identity: a new account has none of Leah’s mailbox, files or Finance history', (s,a)=>isLeah(a)],
   'createDuplicate:*':[3,'Created a second identity: a new account has none of Leah’s mailbox, files or Finance history', (s,a)=>isLeah(a)]},
 obj:[O(leahVerified, 'Leah verified through a channel on her own record', 'The request came from Maya’s chat account and Leah hasn’t been verified'),
   O(s=>s.users.lfontaine.enabled, 'Account re-enabled', 'Leah’s account is still disabled'),
   O(s=>{ const u=s.users.lfontaine; return !u.pwdExpired && u.mustChange && u.credsTo==='tech'; }, 'Expired password reset, must change at next sign-in, read to Leah on the verified call', 'Leah’s password is still expired, or the temporary password went somewhere other than the verified call'),
   O(s=>s.users.lfontaine.licences.includes('office') && !Object.values(s.users).some(u=>u.enabled && !u.deleted && u.lostLicence && !(s.chat.facts.lostBefore1063||[]).includes(u.id)),
     'Office Suite seat reclaimed from a leaver and assigned to Leah', 'Leah has no Office licence, or an active colleague lost theirs to free a seat'),
   O(s=>s.users.lfontaine.signInOk && s.workstations['NS-FIN-027'].officeOk, 'Sign-in test passed and Office shows as licensed on NS-FIN-027', 'Access hasn’t been verified end to end')],
 guide:{
  symptomsToNotice:['The sender in Company Chat is Maya Chen, not Leah. The person typing is unconfirmed.',
    'Directory › Leah Fontaine shows an HR note: disabled by the leave workflow LOA-0193, return date today, Office licence released.',
    'Authentication shows three problems: Disabled, password Expired, and no Office Suite licence.',
    'Licence pools › Office Suite (Standard) shows 0 free, and one holder is a disabled leaver from July.'],
  diagnosis:'The visible symptom (disabled) is only the first of three layers the leave workflow left behind. Fix only the obvious one and the next appears: enable, and sign-in fails on the expired password; fix that, and Excel opens unlicensed. Before touching anything, deal with the channel. A chat from someone else’s account is a classic pretext, so verify Leah through something on her own record: her desk extension works because she says she’s at her desk, and her registered mobile works for a code. The HR leave record authorises re-enabling, so no extra approval is needed. For the licence, the pool is exhausted. Reclaim a seat from a disabled leaver (Tara Morgan, last sign-in Jul 31, mailbox already shared), never from an active colleague. Verify end to end: a sign-in test, then Office reports licensed on her laptop.',
  perfectSteps:['Open the chat from Maya Chen (dashboard › Incoming contacts › Open chat) and select Log as INC-1063. Optionally reply that you’ll call Leah on her desk line.',
    'Open INC-1063 and select Assign to me.',
    'Open Tools › Directory, search “leah” and select Leah Fontaine. Read the HR note on Profile, then on Authentication note Disabled, password Expired and the Blocked sign-in at 09:19.',
    'Select Verify identity…, choose “Callback to number on record” and select Run check. Leah answers x4418 and quotes E44181.',
    'On Authentication select Enable account.',
    'Select Reset password…, keep “User must change password at next sign-in” ticked, choose “Read to user on a verified call” and select Reset password.',
    'Open the Licences tab: Office Suite (Standard) shows 0 free and Assign is greyed out. Select View licence pools.',
    'In Licence pools › Office Suite (Standard), find Tara Morgan · Disabled · last sign-in Jul 31 and select Remove.',
    'Back in Users › Leah Fontaine › Licences, select Assign on Office Suite (Standard).',
    'On Authentication select Test sign-in. Expect “Sign-in test passed for lfontaine. They’ll be asked to choose a new password.”',
    'Open Tools › Remote Desktop, connect to NS-FIN-027, open Office Suite and select Refresh licence. Expect “Product activated”.',
    'Select Check fix, write the note and select Close ticket.'],
  verify:['Directory › Leah Fontaine › Authentication: Enabled, password Current with Must change, sent via “Read to user on a verified call”, identity check Callback to number on record, last sign-in test Passed.',
    'Licence pools › Office Suite (Standard): Leah is a holder, Tara Morgan isn’t, and every holder still listed is who it was before.',
    'Remote Desktop › NS-FIN-027 › Office Suite shows Licensed.'],
  commonMistakes:['Trusting the chat because it came from a real internal account. It was the wrong person’s account.',
    'Fixing “disabled”, closing, and getting a reopen an hour later about the password or Excel.',
    'Freeing a seat by taking it from an active colleague.',
    'Creating a new account instead of restoring the old one.',
    'Sending the temporary password into Maya’s chat or to her manager.'],
  realWorldNote:'Leave workflows often disable accounts and release licences to save cost, and returners then hit several failures in a row. A good technician checks every layer before calling back. Reclaiming licences from leavers is routine cost control, and a pool full of disabled holders is a common audit finding.',
  idealNotes:'Leah Fontaine back from parental leave (LOA-0193, return today). Request came via Maya Chen’s chat, so I verified Leah by calling her desk x4418 on record (employee ID E44181 matched). Three issues: disabled by the leave workflow, password expired, Office licence released. Re-enabled; temporary password read on the verified call, must change at next sign-in. Office pool at 0 free, so I reclaimed the seat from leaver tmorgan (disabled since Jul 31) and assigned it to Leah. Sign-in test passed; Office licensed on NS-FIN-027 after a refresh.'}},

{ref:'INC-1065', shift:3, pri:'critical', cat:'Security / Social engineering', reqName:'Caller claiming to be Avery Wilson’s assistant', reqDept:'Executive Office (unverified)', reqLoc:'Unknown', reqExt:'—', reqEmail:'not given',
 asset:'awilson', assetType:'Executive account (password and MFA)', created:'07:52', security:true,
 intake:{via:'voicemail', name:'Caller says: “Callum, Avery Wilson’s new EA”', role:'Claims to be executive assistant · Executive Office (not in Directory)', ext:'—', callerId:'+1 555-0193 (external · not in Directory)', dur:'0:36',
   text:'Hi, it’s Callum, Avery Wilson’s new EA. Avery’s stuck at the airport and locked out, and she’s got the board call at ten. Can you reset her password and text it to me on 555-0193, and switch off the phone approval thing for today? She’s really not happy. I’ll be waiting.'},
 arrive:s=>{ const u=s.users.awilson; Object.assign(u, {presence:'online', device:'NS-EXEC-001', lastSignIn:'Today 08:40 · NS-EXEC-001 (Floor 2, on-site)'});
   u.signins.unshift({t:'Today 08:40', host:'NS-EXEC-001', loc:'Northstar HQ · Floor 2', app:'Desktop sign-in', result:'Success'});
   u.verifyFail=(u.verifyFail||[]).concat('callback-given');
   u.verifyText=Object.assign({}, u.verifyText, {'callback-given':'You called +1 555-0193. It went to an anonymous voicemail box. That number isn’t on any Northstar record, so it can’t verify anything.'});
   s.chat.facts.aw1065={resets:u.pwdResetCount||0, mfa:u.mfaResetCount||0}; },
 title:'Voicemail: urgent password reset for the Chief of Staff',
 desc:'Voicemail 07:52: “Hi, it’s Callum, Avery Wilson’s new EA. Avery’s stuck at the airport and locked out, and she’s got the board call at ten. Can you reset her password and text it to me on 555-0193, and switch off the phone approval thing for today? She’s really not happy. I’ll be waiting.”',
 impact:'If acted on, an attacker could take over an executive account that holds board materials. The pressure and urgency point to social engineering.',
 tried:'The caller says Avery tried her password “a few times”.',
 hints:['Before you touch Avery’s account, look at it. Is she actually locked out? Where did she last sign in? Does she have an assistant on record?',
   'Contact Avery through a channel you already trust (Company Chat, where she’s online), not the number in the message.',
   'Ask Avery in Company Chat, save the voicemail to the ticket and forward it to Security, then escalate with the caller’s number and claims in your notes. Don’t reset anything.'],
 model:'An unverified caller (“Callum”, +1 555-0193) left a voicemail asking for Avery Wilson’s password to be reset and texted to him, and for MFA to be switched off. Directory shows Avery isn’t locked, signed in on-site at 08:40 today on NS-EXEC-001, and has no assistant on record; nobody called Callum is in Directory. Avery confirmed in Company Chat that she is at her desk, has no EA called Callum and made no request. Made no changes to her account. Saved the voicemail to the ticket, forwarded it to Security and escalated as a suspected social-engineering attempt.',
 keys:['awilson','avery','555-0193','callum','vishing','social engineering'],
 penalties:{'resetPassword:awilson':[6,'Reset an executive’s password for an unverified caller: Avery is on-site and signed in at 08:40'],
   'resetMfa:awilson':[6,'Removed MFA from an executive account on a caller’s word'],
   'vmDelete:vm-INC-1065':[3,'Deleted the voicemail: Security needs the number and the recording']},
 chatActions:[{id:'aw-ea', user:'awilson', label:'INC-1065 · Ask Avery to verify the voicemail request', ask:'Quick check from the service desk: did you ask an assistant called Callum to get your password reset this morning?',
   reply:'No. I’m at my desk on Floor 2, I haven’t been near an airport, and I don’t have an assistant called Callum. I didn’t ask for this, please treat it as suspicious.', set:s=>{ s.chat.verified['INC-1065']='awilson'; }}],
 obj:[O(s=>s.chat.verified['INC-1065']==='awilson', 'Request checked with the real Avery through Company Chat', 'The request hasn’t been checked with the real Avery through a channel you trust'),
   O(s=>{ const u=s.users.awilson, f=s.chat.facts.aw1065||{}; return (u.pwdResetCount||0)===f.resets && (u.mfaResetCount||0)===f.mfa; }, 'Avery’s password and MFA left untouched', 'Avery’s credentials were changed on an unverified request'),
   O(s=>{ const v=s.voicemails.find(x=>x.id==='vm-INC-1065'); return !!v && v.saved && v.forwarded && !v.deleted; }, 'Voicemail saved to the ticket and forwarded to Security', 'The voicemail evidence hasn’t been kept for Security'),
   O(s=>s.tickets['INC-1065'].status==='escalated', 'Escalated to Security', 'Not yet routed to Security')],
 guide:{
  symptomsToNotice:['Urgency and authority pressure: an executive, a board call at ten, “she’s really not happy”.',
    'The caller asks for two things no process allows: a password sent to a third party’s phone, and MFA switched off.',
    'The callback number isn’t on any record, and nobody called Callum is in Directory.',
    'The account contradicts the story: not locked, and signed in on-site at 08:40.'],
  diagnosis:'Nothing is wrong with Avery’s account. The incident is the call itself. Every element matches a classic help-desk vishing pretext: a high-value target, an intermediary who can’t be verified, time pressure, and requests to send credentials to a new channel and weaken MFA. Directory disproves the story: Avery isn’t locked, last signed in from her office workstation this morning, and has no assistant listed. Even if the story were true, the answer would be the same: credentials only go to the account holder through a verified channel. Confirm with the real person through a channel you already trust (Company Chat shows her online on NS-EXEC-001), change nothing, keep the evidence (recording and number), and hand it to Security, who can check whether other staff were targeted.',
  perfectSteps:['Open Voicemails and read the 07:52 message. Select Log as ticket. Don’t delete it.',
    'Open INC-1065 and select Assign to me.',
    'Open Tools › Directory, search “avery” and select Avery Wilson. On Profile note Assistant: — and Mobile +1 555-0110, which doesn’t match the caller’s number.',
    'On Authentication note Lockout: Not locked and Last sign-in: Today 08:40 · NS-EXEC-001. Don’t select Reset password… or Reset MFA….',
    'Search Directory for “callum”: no accounts match.',
    'Open Company Chat › Avery Wilson (Online) and select “INC-1065 · Ask Avery to verify the voicemail request”. She is at her desk, has no assistant called Callum and didn’t ask for this.',
    'Back in Voicemails, select Save to INC-1065, then Forward to Security on the 07:52 message.',
    'Select Escalate to Security and write the evidence: caller name and number, time, what was asked for, the Directory facts and Avery’s denial. Don’t close it.'],
  verify:['Directory › Avery Wilson › Authentication shows no password reset today and MFA Enrolled.',
    'The voicemail shows “Saved to ticket” and “Forwarded to Security”, and it isn’t deleted.',
    'Avery’s denial is in Company Chat.',
    'The ticket is Escalated, and the notes include +1 555-0193.'],
  commonMistakes:['Resetting “just to be safe” without sending the password. It still disrupts the executive and shows the attacker the desk will act on a call.',
    'Calling the attacker’s number to verify.',
    'Deleting the voicemail as obvious spam, which destroys the evidence Security needs.',
    'Refusing and closing quietly. Security should know, because these campaigns usually target several people.',
    'Sending Avery a verification code, which looks like the MFA-fatigue prompts attackers use.'],
  realWorldNote:'Phone-based social engineering of service desks, often against executives and their “assistants”, has led to major breaches. Typical demands are a password reset to a new number and MFA re-registration. Mature service desks never send credentials to anyone but the verified account holder, verify executive requests through a known channel, and report every attempt to Security.',
  idealNotes:'Suspected social engineering. Voicemail 07:52 from “Callum, Avery’s new EA” (+1 555-0193) asked to reset Avery Wilson’s password, text it to him, and disable MFA before a 10:00 board call. Evidence: Avery not locked; last sign-in today 08:40 on NS-EXEC-001 (on-site); no assistant on record; no “Callum” in Directory. Avery confirmed in Company Chat she is at her desk, has no EA called Callum and made no request. No changes to her account. Voicemail saved to the ticket and forwarded to Security. Escalated to Security for investigation and a staff alert.'}},

{ref:'INC-1066', shift:3, pri:'critical', cat:'Network / Name resolution', reqName:'Multiple users', reqDept:'Floors 1–2 · All departments', reqLoc:'Floors 1 and 2', reqExt:'4000', reqEmail:'office-managers@northstar.example',
 asset:'Name resolution (DNS)', assetType:'Shared infrastructure service', created:'08:49',
 arrive:s=>{ s.net.servers.DC01.services['DNS Server']='stopped'; s.net.dnsVerified=false;
   s.net.servers.DC01.events.unshift({t:'08:44', level:'Error', source:'Service Control Manager', id:7031, text:'The DNS Server service terminated unexpectedly. It has done this 1 time(s).'}); },
 title:'Intranet and shared drives “can’t be found” for everyone',
 desc:'Since about quarter to nine nobody on floors 1 and 2 can open the intranet or any mapped drive. The browser says the site can’t be reached and File Explorer says the network path wasn’t found. Wi-Fi shows connected and the desk phones are fine.',
 impact:'Office-wide loss of the intranet, mapped drives and web browsing. People already signed in stay signed in, but nobody can reach anything by name.',
 tried:'Users restarted PCs and reconnected Wi-Fi. One person tried a different browser.',
 hints:['Look at what fails and what still works. Everything that breaks is reached by name. Try reaching a server by its address instead.',
   'Remote into an office PC such as NS-HR-003. In Terminal compare ping file01 with ping 10.0.0.20, then run nslookup file01 and note which server it asks.',
   'Server Room › Servers › DC01 › Services: start the DNS Server service. Then on the PC run ipconfig /flushdns and nslookup intranet.northstar.local.'],
 model:'Every working floor lost everything reached by name. From NS-HR-003, ping 10.0.0.20 worked but ping and nslookup by name timed out against DC01 (10.0.0.10), while nslookup against DC02 (10.0.0.11) answered, which isolated the fault to DC01’s DNS service. DC01’s event log showed the DNS Server service terminated unexpectedly at 08:44 (event 7031). Started the DNS Server service on DC01 with no reboot, flushed the PC’s negative cache, and confirmed nslookup intranet.northstar.local returns 10.0.0.40. Follow-up for Infrastructure: clients only get DC01 as their DNS server, so add DC02 as a secondary.',
 keys:['dc01','dns server','7031','nslookup','10.0.0.10','flushdns'],
 penalties:{'reboot:DC01':[4,'Rebooted a domain controller when one stopped service needed starting: nobody could sign in for 6 minutes'],
   'stopService:DC02':[5,'Stopped DNS on DC02, the last working DNS server', (s,a)=>a[1]==='DNS Server'],
   'reboot:edge':[4,'Rebooted the edge router: pings to IP addresses already proved the network works'],'off:edge':[4,'Powered off the edge router: pings to IP addresses already proved the network works'],
   'reboot:fw':[4,'Rebooted the firewall: pings to IP addresses already proved the network works'],'off:fw':[4,'Powered off the firewall: pings to IP addresses already proved the network works']},
 obj:[O(s=>dnsUp(s,'DC01'), 'DNS Server service is running on DC01', 'DNS Server on DC01 is still stopped'),
   O(s=>s.net.dnsVerified===true && dnsUp(s,'DC01'), 'Name resolution verified from an office workstation', 'Nobody has confirmed from a workstation that names resolve since the fix')],
 guide:{
  symptomsToNotice:['Everything that fails is reached by a name (intranet address, \\\\FILE01 paths, websites).',
    'Wi-Fi shows connected, which means the link and the IP address are fine.',
    'Several floors are affected at once, so this is a shared service, not one PC.',
    'Desk phones still work. They don’t depend on the same name lookups.'],
  diagnosis:'First split connectivity from name resolution. If ping 10.0.0.20 replies but ping file01 says “could not find host”, routing, switching and the server are fine and only the name-to-address step is failing. nslookup shows which DNS server the client asks (dc01.northstar.local) and that it times out. Pointing the same query at DC02 (nslookup file01 10.0.0.11) gets an answer, which proves the records are fine and DC01’s DNS service is the single failed part. ipconfig /all shows clients only get 10.0.0.10 as their DNS server, which is why the healthy DC02 doesn’t take over. DC01’s event log (7031, service terminated unexpectedly) confirms it. The fix is starting one service; rebooting the domain controller or touching network gear is far bigger than this needs.',
  perfectSteps:['Open INC-1066 and select Assign to me. It is Critical and affects several floors.',
    'Open Tools › Remote Desktop, search “NS-HR-003” and select Connect, then Connect in the dialog.',
    'Open Terminal. Run ping 10.0.0.20 and expect 3 replies: the network path is fine.',
    'Run ping file01 and expect “could not find host”: the name step is what fails.',
    'Run nslookup file01 and expect “Server: dc01.northstar.local” and “DNS request timed out”.',
    'Optional: run nslookup file01 10.0.0.11. DC02 answers, so DC01 is the problem. Run ipconfig /all and note that DNS Servers lists only 10.0.0.10.',
    'Open Tools › Server Room › Servers and select Services on DC01. DNS Server shows stopped. Select “Event log & scheduled tasks” and read event 7031 at 08:44.',
    'Back on the Servers tab, open DC01’s services again and select Start next to DNS Server. Don’t select Reboot.',
    'Return to Remote Desktop › NS-HR-003 › Terminal. Run ipconfig /flushdns (the failed ping cached a negative answer), then nslookup intranet.northstar.local. Expect “Address: 10.0.0.40”. This sets the verification requirement.',
    'Optional: File Explorer › H: (\\\\FILE01\\HR) opens again.',
    'Select Check fix, write the resolution notes and select Close ticket.'],
  verify:['Server Room › DC01 › Services shows DNS Server running.',
    'nslookup intranet.northstar.local from an office PC returns 10.0.0.40 from dc01.northstar.local.',
    'ping file01 replies again.',
    'Both requirements are ticked.'],
  commonMistakes:['Rebooting DC01. It works, but it takes sign-in down for everyone, and rebooting a domain controller is a change-controlled action.',
    'Rebooting the edge router or firewall because “the internet is down”. Pings to IP addresses prove the network works.',
    'Closing after starting the service without testing from a client.',
    'Forgetting ipconfig /flushdns on a PC that cached the failure, then thinking the fix didn’t work.'],
  realWorldNote:'“IP addresses work, names don’t” is the classic sign of a DNS failure. In real directory environments, always hand out at least two DNS servers through DHCP (both domain controllers). With a single DNS server, one service crash becomes a site-wide outage. After restoring service, find out why it crashed (event logs, recent patches, disk space) and raise a problem record.',
  idealNotes:'Scope: floors 1–2 couldn’t reach anything by name. From NS-HR-003, ping 10.0.0.20 worked but ping file01 failed and nslookup timed out against 10.0.0.10 (DC01); nslookup against DC02 (10.0.0.11) answered. DC01 event 7031 at 08:44: DNS Server service terminated unexpectedly. Fix: started DNS Server on DC01 (no reboot). Verified: after ipconfig /flushdns, nslookup intranet.northstar.local returns 10.0.0.40 and ping file01 replies. Follow-up: clients only get 10.0.0.10 for DNS; recommend adding 10.0.0.11 as secondary and a problem record for the crash.'}},

{ref:'INC-1068', shift:3, after:'INC-1066', pri:'critical', cat:'Network / ISP', req:'rlindqvist', asset:'MetroFiber circuit MF-PRI-88213', assetType:'Internet circuit', created:'11:10',
 intake:{via:'voicemail', from:'rlindqvist', dur:'0:44', text:'Hi IT, it’s Rosa on reception. Visitors and half the office keep coming to the desk saying websites won’t load, and the café card reader can’t connect either. The shared drives still seem fine. I’ve got a client video call at half eleven. Could someone call me back on 3010? Thanks.'},
 arrive:s=>{ Object.assign(s.net.devices.isp, {status:'offline', up:0, faultRef:null, checked:false, incident:null, announceFrom:s.chat.announce.length,
     notice:'MetroFiber status page: major incident MF-INC-5821, fibre damage near the Riverside exchange, several business circuits affected. Engineers on site. Next update 11:45.'});
   s.net.ispVerified=false; },
 title:'Websites and card machines down, but shared drives still open',
 desc:'Voicemail, 11:10: “Hi IT, it’s Rosa on reception. Visitors and half the office keep coming to the desk saying websites won’t load, and the café card reader can’t connect either. The shared drives still seem fine. I’ve got a client video call at half eleven. Could someone call me back on 3010? Thanks.”',
 impact:'Office-wide loss of internet access, external email and card payments. Internal services (drives, intranet, printing) still work.',
 tried:'Reception restarted the café card reader and her own PC.',
 hints:['Internal things still work and only outside things fail. Find where inside stops and outside starts.',
   'From any office PC, ping 10.0.0.1, then ping web.example and run tracert web.example. Then look at the ISP tile in Server Room › Overview.',
   'Server Room › Topology › MetroFiber ISP: Check provider status, Log fault with provider on MF-PRI-88213, post the Full status update in #office-announcements, check the provider again, then ping web.example from an office PC.'],
 model:'Internal services were fine: from NS-HR-003 the gateway and FILE01 replied, but external hosts timed out and tracert died at the MetroFiber hop after our edge router. Server Room showed the MetroFiber circuit down, and the provider status page listed major incident MF-INC-5821 (fibre damage at the Riverside exchange). Logged a fault against circuit MF-PRI-88213, posted a full status update to all staff (impact, workaround, next update) and called Rosa back on 3010. The provider restored the circuit; verified with ping web.example from an office PC and posted the all-clear.',
 keys:['metrofiber','mf-pri-88213','mf-inc-5821','tracert','status update','provider'],
 penalties:{'reboot:edge':[4,'Rebooted the edge router during a provider outage: the internal network that still worked dropped too'],'off:edge':[4,'Powered off the edge router during a provider outage'],
   'reboot:fw':[4,'Rebooted the firewall during a provider outage: the internal network that still worked dropped too'],'off:fw':[4,'Powered off the firewall during a provider outage'],
   'announce:restart':[2,'Told all staff to restart their PCs and routers during a provider outage, which fixes nothing and floods the desk']},
 obj:[O(s=>s.net.devices.isp.checked===true, 'Provider status checked', 'MetroFiber’s status hasn’t been checked'),
   O(s=>!!s.net.devices.isp.faultRef, 'Fault logged with MetroFiber against circuit MF-PRI-88213', 'No fault has been logged with the provider'),
   O(s=>s.chat.announce.slice(s.net.devices.isp.announceFrom||0).some(p=>p.full), 'Full status update posted to #office-announcements', 'Staff haven’t been told what’s affected, the workaround and when the next update is'),
   O(s=>s.net.devices.isp.status==='online' && s.net.ispVerified===true, 'Internet restored and verified from an office PC', 'Internet restoration hasn’t been confirmed from an office PC')],
 guide:{
  symptomsToNotice:['Shared drives and the intranet work, so the LAN, DNS and servers are healthy.',
    'Anything that leaves the building (websites, the card reader, external mail) fails.',
    'Several unrelated device types fail together, which points to a shared upstream dependency.',
    'The caller asked for a callback. Communication is part of the fix.'],
  diagnosis:'Separate inside from outside. If internal addresses and names work but every external destination fails, the break is at or beyond the edge. tracert makes it visible: the floor switch, firewall (10.0.0.254) and edge router (10.0.0.1) answer, then the MetroFiber hop times out. Our own devices are up and forwarding, so restarting them only adds an internal outage to an external one. Server Room shows the ISP circuit down, and the provider’s status page confirms an area incident. We can’t fix it ourselves. What we own is getting our circuit attached to the provider’s incident (a fault reference), telling staff what works and when they’ll hear next, then verifying and announcing recovery.',
  perfectSteps:['Open Voicemails, read Rosa’s message and select Log as ticket. Open INC-1068 and select Assign to me.',
    'Open Tools › Remote Desktop, connect to NS-HR-003 and open Terminal. ping 10.0.0.1 and ping file01 reply: internal is fine.',
    'Run ping web.example (100% loss) and tracert web.example. It passes the floor switch, fw01 and edge01, then times out at the MetroFiber hop.',
    'Open Tools › Server Room › Overview: the ISP · MetroFiber tile shows Down; the edge router and firewall are online.',
    'Open the Topology tab and select MetroFiber ISP. Select Check provider status and read incident MF-INC-5821 (fibre damage, next update 11:45).',
    'Leave the circuit list on MF-PRI-88213 (not the backup) and select Log fault with provider. Note the fault reference.',
    'Open Company Chat › office-announcements and select Full status update. Don’t post “Ask everyone to restart”.',
    'Optional: message Rosa Lindqvist in Company Chat with the reference and suggest a mobile hotspot for her 11:30 call.',
    'Back in Server Room › Topology › MetroFiber ISP, select Check provider status again. The circuit is back online.',
    'In Remote Desktop › NS-HR-003 › Terminal run ping web.example and expect replies. This sets the verification requirement.',
    'Optional: post Resolved in #office-announcements. Select Check fix, write notes with the provider references and select Close ticket.'],
  verify:['Server Room › Overview: the ISP tile shows Online with latency.',
    'ping web.example from an office PC gets replies.',
    '#office-announcements has a full status update posted during the outage.',
    'All four requirements are ticked.'],
  commonMistakes:['Rebooting the edge router or firewall “just in case”, which knocks out the internal services that still work.',
    'Sending vague updates (“looking into it”) with no workaround or next-update time, so people keep calling.',
    'Telling users to restart devices, which is wasted effort during a provider outage.',
    'Closing the ticket when the fault is logged rather than when service is verified.',
    'Not recording the provider references, which you need for SLA credits and the post-incident review.'],
  realWorldNote:'For an ISP outage, the service desk’s job is triage, vendor engagement and communication. Keep circuit IDs, provider contacts and SLA terms in the runbook. Good updates say what’s affected, what still works, what to do instead and when the next update is. If the business can’t tolerate this, raise a problem record for a second, diverse circuit or a mobile failover.',
  idealNotes:'Internal OK (gateway, FILE01, intranet). External failed and tracert web.example stopped at the MetroFiber hop after edge01. Edge and firewall online. Server Room showed circuit MF-PRI-88213 down; provider status page listed major incident MF-INC-5821 (Riverside exchange fibre damage). Logged a fault against MF-PRI-88213. Posted a full status update to #office-announcements and called Rosa back on 3010. Provider restored the circuit; verified with ping web.example from NS-HR-003 and posted the all-clear. Suggest a problem record for a backup circuit.'}},

{ref:'INC-1069', shift:3, pri:'high', cat:'Server / Storage', reqName:'Multiple users', reqDept:'Finance, HR, Operations', reqLoc:'Floors 1 and 2', reqExt:'4000', reqEmail:'office-managers@northstar.example', asset:'FILE01', assetType:'File server', created:'09:20',
 arrive:s=>{ const x=s.net.servers.FILE01, D=fileD(s), sc=D.folders.find(f=>f.name==='Scans'), t=x.tasks.find(k=>k.purge==='Scans');
   D.unallocGB=0; D.writeOk=false; sc.deleted=false; sc.gb+=Math.max(0, D.totalGB-1-volUsed(D,x)); sc.oldGB=Math.max(0, sc.gb-13);
   Object.assign(t, {enabled:false, result:'Disabled by svc-patching during the Sep 14 maintenance window'});

   s.chat.facts.shadows1069=x.shadows.map(z=>z.id); },
 title:'“Not enough space” when saving to any shared drive',
 desc:'Since this morning people in Finance, HR and Operations get “There is not enough space on the disk” when they save anything to the shared drives. Opening files is fine, and saving to the desktop works.',
 impact:'Nobody can save to any department share. Month-end Finance work and HR onboarding are blocked.',
 tried:'Users deleted a few old files from their own folders, which made no difference.',
 hints:['Every share at once means the shared server, not individual folders. Find out what is using the space.',
   'Server Room › Storage › FILE01: look at D:’s folder breakdown, then at FILE01’s scheduled tasks under Events & tasks.',
   'Purge only Scans files older than 30 days, enable the “Purge Scans older than 30 days” task again, keep the shadow copies, then select Test write on D:.'],
 model:'Every department share lives on FILE01 D:, which had 1 GB free (event 2013 at 08:06). The folder breakdown showed D:\\Scans had ballooned because its nightly clean-up task was disabled during the Sep 14 maintenance window and never re-enabled. Purged only Scans files older than 30 days, keeping recent scans and every shadow-copy restore point, and re-enabled the clean-up task. D: is now about 62% used and a test write succeeded. Follow-up: an 85% capacity alert and a post-maintenance checklist for re-enabling tasks.',
 keys:['file01','scans','2013','purge','shadow','clean-up task'],
 penalties:{'deleteShadows:FILE01':[5,'Deleted every file-server restore point to free space'],
   'deleteFolder:FILE01':[3,'Deleted a whole folder on the file server, including recent files, instead of purging old ones'],
   'reboot:FILE01':[3,'Rebooted FILE01: everyone lost their open files and no space was freed']},
 obj:[O(s=>volUsed(fileD(s),s.net.servers.FILE01)/fileD(s).totalGB<0.9, 'FILE01 D: is below 90% used', 'FILE01 D: is still almost full'),
   O(s=>(s.chat.facts.shadows1069||[]).every(id=>s.net.servers.FILE01.shadows.some(z=>z.id===id)), 'Shadow-copy restore points preserved', 'Restore points were deleted to free space'),
   O(s=>s.net.servers.FILE01.tasks.find(k=>k.purge==='Scans').enabled, 'Scans clean-up task enabled again', 'The clean-up task that prevents this is still disabled'),
   O(s=>fileD(s).writeOk===true, 'Test write to D: succeeded', 'Writing to D: hasn’t been tested since the clean-up')],
 guide:{
  symptomsToNotice:['Every department share fails the same way. They all live on one server, FILE01.',
    'Reading works and writing fails: the classic sign of a full volume.',
    'The error is about disk space, not permissions, so don’t touch group membership.',
    'Users deleting their own small files didn’t help, so the big consumer is elsewhere.'],
  diagnosis:'The volume is full, but the real question is why it filled up. The folder breakdown shows the business shares are normal sizes while the scanner drop folder (Scans) holds hundreds of GB, almost all older than 30 days. The scheduled task that should purge it has been disabled since a maintenance window: that is the root cause. Shadow copies are another big item, but they are restore points; deleting them trades a little space for your ability to recover files, which the next ticket needs. The safe, targeted action follows the folder’s own retention rule (older than 30 days). Re-enabling the task stops it happening again. Verify by writing a file.',
  perfectSteps:['Open INC-1069 and select Assign to me.',
    'Open Tools › Server Room › Servers and select Services on FILE01: both services are running, so this isn’t a service outage.',
    'Open the Storage tab (server FILE01). D: Shares shows a red bar with 1 GB free and no unallocated space.',
    'Read the folder list: Scans is by far the biggest, and nearly all of it is older than 30 days. Shadow copies are listed separately.',
    'Open Events & tasks and choose FILE01 in the Server list. Read event 2013 at 08:06, and note that “Purge Scans older than 30 days” is Disabled since the Sep 14 maintenance window.',
    'Back on Storage, select Purge older than 30 days on the Scans row. Don’t use Delete entire folder or Delete all shadow copies.',
    'On Events & tasks, select Enable on “Purge Scans older than 30 days”.',
    'On Storage, select Test write on D:. Expect “Test file written to D: and removed”.',
    'Optional: Remote Desktop › any office PC › File Explorer › Save a test file on a share.',
    'Select Check fix, write notes (cause, action, verification, follow-up) and select Close ticket.'],
  verify:['Storage › D: is about 62% used with a normal bar, and the last test write is OK.',
    'Shadow copies still lists all three restore points.',
    'The Scans clean-up task shows Enabled.',
    'All four requirements are ticked.'],
  commonMistakes:['Deleting all shadow copies because it’s a big, easy number. You lose every restore point and break the next restore request.',
    'Deleting the whole Scans folder, including today’s unprocessed invoices.',
    'Rebooting FILE01: it frees nothing and disconnects everyone.',
    'Freeing space but not re-enabling the task, so the same ticket comes back in a few weeks.',
    'Asking users to clean their own folders. The problem isn’t user data.'],
  realWorldNote:'Monitor volumes with alerts at 80–85%, not at 100%. After any maintenance window, use a checklist to re-enable tasks that were paused. Shadow-copy storage is part of your recovery plan, so cap it with a maximum size instead of deleting it in an emergency, and escalate to Infrastructure if the cleaned volume keeps growing.',
  idealNotes:'FILE01 D: had 1 GB free (event 2013 08:06), so writes to every share failed. Cause: D:\\Scans had grown because “Purge Scans older than 30 days” was disabled during the Sep 14 maintenance window. Purged Scans files older than 30 days only; recent scans and all shadow-copy restore points kept. Re-enabled the clean-up task. D: now about 62% used. Verified with a test write to D:. Follow-up: 85% capacity alert and a post-maintenance task checklist.'}},

{ref:'INC-1070', shift:3, after:'INC-1069', pri:'medium', cat:'Server / File restore', req:'pshah', asset:'\\\\FILE01\\HR\\Starters_October.xlsx', assetType:'Shared file', created:'09:40',

   x.audit.unshift({t:'Oct 12 09:13', user:'pshah', action:'Deleted', path:'\\\\FILE01\\HR\\Starters_October (old copy).xlsx'}, {t:'Oct 12 09:14', user:'pshah', action:'Deleted', path:'\\\\FILE01\\HR\\Starters_October.xlsx'});

 title:'Starters spreadsheet vanished from the HR drive',
 desc:'I was tidying the H: drive this morning and I think I deleted the October starters spreadsheet by mistake. It’s not in my Recycle Bin. I need the version with yesterday’s changes: I added three new people at about 6pm.',
 impact:'HR can’t confirm next week’s starters’ equipment and accounts. One file is affected; the rest of the share is fine.',

   'Restore only the file, from the version modified Oct 11 18:07 (snapshot Oct 12 07:00), to its original location. Then ask Priya in Company Chat to check it.'],
 model:'FILE01’s audit log showed pshah deleted \\\\FILE01\\HR\\Starters_October.xlsx at 09:14 from her PC; network-share deletes don’t go to the Recycle Bin. Priya needed yesterday’s 6pm edits, so I picked the newest snapshot taken before the deletion (sc3, Oct 12 07:00, file modified Oct 11 18:07, 27 rows). I restored only that file to its original location and left the rest of the share alone. Priya confirmed in chat that all 27 starters, including last night’s three, are there.',

 chatConfirm:{user:'pshah', ok:s=>TK['INC-1070'].obj.slice(0,3).every(o=>o.ok(s)), ask:'I’ve restored Starters_October.xlsx to the HR drive. Can you open it and check last night’s changes are there?',

 obj:[O(s=>startersFile(s).state==='restored', 'Starters_October.xlsx is back on the HR share', 'The spreadsheet is still missing from \\\\FILE01\\HR'),

 guide:{
  symptomsToNotice:['The file was on a network drive (H: is \\\\FILE01\\HR), and the Recycle Bin only covers local disks.',
    'The user gives a timing requirement (edits at about 6pm yesterday). That decides which version is right.',
    'Only one file is affected. Everything else on the share is current and must stay that way.'],
  diagnosis:'First confirm what happened. The audit trail shows a user delete at 09:14, not corruption, ransomware or a permissions change, so a point-in-time restore is the right tool. Choose the version carefully: you want the newest snapshot taken after the last good edit and before the deletion. The Oct 12 07:00 snapshot holds the file as last saved at 18:07 yesterday, which includes the evening changes; the Oct 11 12:00 snapshot predates them. Restore the single item. Reverting the whole share would throw away everyone else’s work since 07:00. Only the requester can confirm the content is right, so close the loop with her.',
  perfectSteps:['Open INC-1070 and select Assign to me.',
    'Open Tools › Server Room › Shadow copies. In File audit, find “Oct 12 09:14 · pshah · Deleted · \\\\FILE01\\HR\\Starters_October.xlsx”.',
    'Set Share to HR and select Starters_October.xlsx (marked deleted).',
    'Compare the versions: sc3 (snapshot Oct 12 07:00) was modified Oct 11 18:07 with 27 starters; sc2 (snapshot Oct 11 12:00) was modified 11:20 with 24.',
    'On the sc3 row select Restore to original location. Don’t use Revert entire share.',
    'Optional: Remote Desktop › NS-HR-003 › File Explorer › H: lists Starters_October.xlsx again.',
    'Open Company Chat › Priya Shah and select “INC-1070 · Ask to confirm the fix”. She confirms 27 starters, including last night’s three.',

  verify:['The file shows as restored in Shadow copies, and File Explorer › H: lists it.',
    'The restore came from sc3 (modified Oct 11 18:07).',
    'Priya’s chat reply confirms the three evening additions.',
    'All four requirements are ticked.'],
  commonMistakes:['Picking a version by the snapshot label instead of reading the modified time.',
    'Reverting the whole share, which silently destroys other people’s work.',
    'Skipping the audit log and assuming permissions changed.',
    'Closing without the requester checking the content. Only she knows the three new names.',
    'Deleting shadow copies in INC-1069, which leaves only the slower nightly backup.'],
  realWorldNote:'Shadow copies (Previous Versions) are the fastest restore for file servers, but they aren’t a backup: they live on the same volume. Keep real backups too, and teach users that deletions on network drives skip the Recycle Bin. When choosing a version, always read the file’s modified time, not just the snapshot label.',
  idealNotes:'FILE01 audit: pshah deleted \\\\FILE01\\HR\\Starters_October.xlsx at 09:14 (network delete, no Recycle Bin). Previous versions: snapshot sc3 (Oct 12 07:00) holds the file modified Oct 11 18:07 (27 rows), which includes the evening edits. Restored that single file to its original location; no share-wide revert, so other HR files are untouched. Verified: Priya confirmed in chat that all 27 starters, including last night’s three, are present.'}},

 guide:{

  idealNotes:'User-reported phishing (rp2, gwhitfield). Lookalike sender it-servicedesk@northstar-helpdesk.example (domain 2 days old), SPF fail, no DKIM, Reply-To helpdesk.verify@outlook-mail.example, link to a fake sign-in page. Did not open the link. Trace: 6 recipients 09:31–09:32 (gwhitfield, mchen, pshah, jprice, ebrooks, awilson), filter score 4.1. Link protection: 0 clicks. Reported the sample to Security, soft-purged 6/6, blocked the sender. Verified: trace shows every copy Purged. Thanked Gemma.'}}
