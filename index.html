<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskOps Lab</title>
<!--
  DeskOps Lab — an offline IT service-desk training sandbox.
  Everything (styles, data, icons, logic) lives in this one file. No network, no login.
  Every account, device, mailbox and command is fictional local game state.
-->
<style>
/* ===== Tokens (dark only; every text colour clears WCAG AA on --surface) ===== */
:root{
  color-scheme:dark;
  --bg:#0a0c0f; --surface:#111418; --surface2:#15191e; --raise:#1b2027; --line:#1f262e; --line2:#2c3540;
  --text:#e7ebef; --text2:#a6b0bb; --muted:#8d99a6;
  --blue:#1ea7e1; --blue-h:#4cbcec; --blue-bg:rgba(30,167,225,.10); --blue-line:rgba(30,167,225,.38);
  --crit:#ff5a5f; --high:#ff8b3d; --med:#f2b33d; --low:#c9c35c;
  --ok:#3ccf8e; --warn:#f0a33a; --off:#6b7682; --down:#ff6b6b;
  --r:4px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --chatw:420px;
  font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
}
/* ===== Base ===== */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:44px 44px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:26px;line-height:1.2}
h2{font-size:17px}
h3{font-size:15px}
p{margin:.3em 0}
a{color:var(--blue)}
b,strong{color:#f3f6f8}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:rgba(30,167,225,.35)}
.disp,h1,.ttitle,.sect,.chd h2,.chhd h2,.dh h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--text2)}
.small{font-size:12px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.label.blue{color:var(--blue)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hide{display:none!important}
svg{flex:none}
[data-ic]{display:contents}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface2);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:600;font-size:12.5px;letter-spacing:.04em;white-space:nowrap;color:var(--text)}
.btn:hover{border-color:#3b4652;background:var(--raise)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#03141c}
.btn.primary:hover{background:var(--blue-h);border-color:var(--blue-h)}
.btn.danger{color:var(--down);border-color:rgba(255,107,107,.4)}
.btn.danger:hover{background:rgba(255,90,95,.08)}
.btn.danger.solid{background:#d83a40;color:#fff;border-color:#d83a40}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{color:var(--off);background:var(--surface);border-color:var(--line);cursor:not-allowed}
.linkbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-weight:600;letter-spacing:.04em}
.linkbtn:hover{color:var(--blue-h)}
input:not([type]),input[type=text],input[type=search],select,textarea{border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px;background:#0d1014;min-width:0;color:var(--text)}
input::placeholder,textarea::placeholder{color:#7a8693}
input:not([type]):focus,input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px var(--blue-line)}
input[type=checkbox]{accent-color:var(--blue)}
textarea{width:100%;resize:vertical}
input[type=search]{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>.hd{padding:14px 20px 12px;border-bottom:1px solid var(--line)}
.card>.bd{padding:16px 20px}
.card+.card{margin-top:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(60,207,142,.5)}.dot.bad{background:var(--crit);box-shadow:0 0 6px rgba(255,90,95,.5)}.dot.warn{background:var(--warn)}
.st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.st.ok{color:var(--ok)}.st.bad{color:var(--down)}.st.warn{color:var(--warn)}.st.off{color:var(--muted)}
.pri{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pri.critical{color:var(--crit)}.pri.high{color:var(--high)}.pri.medium{color:var(--med)}.pri.low{color:var(--low)}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:3px;padding:1px 7px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);background:var(--surface2);white-space:nowrap}
.chip.blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-h)}
.chip.ok{background:rgba(60,207,142,.08);border-color:rgba(60,207,142,.35);color:var(--ok)}
.chip.bad{background:rgba(255,90,95,.08);border-color:rgba(255,90,95,.38);color:var(--down)}
.chip.warn{background:rgba(240,163,58,.08);border-color:rgba(240,163,58,.38);color:var(--warn)}
.note{border-left:3px solid var(--blue);background:var(--blue-bg);padding:10px 12px;border-radius:3px;margin:10px 0}
.note.warn{border-color:var(--warn);background:rgba(240,163,58,.08)}
.note.bad{border-color:var(--crit);background:rgba(255,90,95,.08)}
.note.ok{border-color:var(--ok);background:rgba(60,207,142,.08)}
.bar{height:6px;background:#202730;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.hot>i{background:var(--crit)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.015)}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--blue-bg)}
.tablewrap{overflow-x:auto}
.empty{padding:28px 20px;text-align:center;color:var(--text2)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center;line-height:1;letter-spacing:0}
.badge:empty{display:none}

/* ===== Top bar ===== */
#topbar{position:sticky;top:0;z-index:10;height:68px;background:rgba(13,15,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);container-type:inline-size;container-name:top}
.tb-in{height:100%;display:flex;align-items:center;gap:4px;padding:0 18px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:0;margin-right:24px;color:var(--text);text-align:left}
.logo{width:58px;height:40px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(135deg,#123a5c,#1a5d8c);box-shadow:inset 0 0 0 1px rgba(76,188,236,.35)}
.wm{display:grid;line-height:1.05}
.wm b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.wm small{font-size:12px;font-weight:700;color:var(--text2);margin-top:3px}
.navs{display:flex;align-items:center;gap:2px}
.nav{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 12px;border-radius:4px;cursor:pointer;color:var(--text);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;position:relative}
.nav.hi{color:var(--blue)}
.nav:hover{background:rgba(255,255,255,.04);color:var(--blue-h)}
.nav.on{background:var(--blue-bg)}
.nav .badge{position:absolute;top:0;right:0}
.vsep{width:1px;height:26px;background:var(--line2);margin:0 10px}
.topright{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:4px;color:var(--blue);cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.05);color:var(--blue-h)}
.ibtn.on{background:var(--blue-bg)}
.ibtn .badge{position:absolute;top:2px;right:0}
.ptsblk{display:grid;justify-items:center;line-height:1;padding:0 14px;margin:0 6px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.ptsblk b{font-size:19px;font-weight:800;letter-spacing:.02em}
.ptsblk small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-top:4px;font-weight:600}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:4px;color:var(--text);text-align:left}
.who:hover{background:rgba(255,255,255,.05)}
.whot{display:grid;line-height:1.15}
.whot b{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whot small{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.rk-trainee{color:var(--text2)}.rk-bronze{color:#e0a072}.rk-silver{color:#cdd6df}.rk-gold{color:#f2c94c}.rk-platinum{color:#7fe0e8}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f0b54a,#e07b2e);display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#2a1600;flex:none;letter-spacing:.02em}
.who .chevd{color:var(--text2)}
#memNote{background:rgba(240,163,58,.12);border-bottom:1px solid rgba(240,163,58,.35);color:#f5c37a;font-size:12.5px;padding:6px 20px}
@container top (max-width:1120px){ .navtxt,.wm small{display:none} .nav{padding:10px} .brand{margin-right:10px} }
@container top (max-width:860px){ .wm{display:none} .ptsblk{padding:0 10px;margin:0 2px} .whot{display:none} }
@container top (max-width:620px){ #navDash,#navPast,#navAch,.vsep,.who .chevd{display:none} .tb-in{padding:0 10px;gap:0} .logo{width:44px;height:34px} .ibtn{width:36px} .nav{padding:8px} .ptsblk small{font-size:8.5px} }

/* ===== Popovers / menus ===== */
[popover]{margin:0;inset:auto;border:1px solid var(--line2);border-radius:var(--r);background:#14181d;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.55);max-width:calc(100vw - 16px);color:var(--text)}
.menu button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:none;border:0;padding:8px 10px;border-radius:3px;cursor:pointer;color:var(--text)}
.menu button:hover,.menu button:focus-visible{background:var(--blue-bg)}
.prof{width:290px;padding:14px}
.prof label{display:flex;gap:8px;align-items:center;margin:8px 0}
.prof .pmenu{border-top:1px solid var(--line);margin:10px -14px 0;padding:6px 4px 0}
/* Tools modal: a popover centred over a blurred backdrop */
#toolsPop{position:fixed;inset:0;margin:auto;width:min(512px,calc(100vw - 24px));height:fit-content;max-height:calc(100vh - 40px);overflow:auto;padding:22px 18px 14px;background:#121519;border-color:var(--line2)}
#toolsPop::backdrop{background:rgba(4,6,8,.62);backdrop-filter:blur(5px)}
#toolsPop .x{position:absolute;top:10px;right:10px;width:30px;height:30px;padding:0;justify-content:center;color:var(--text2)}
#toolsPop .grp{padding:4px 0 10px;border-top:1px solid #1e3a4a;margin-top:6px}
#toolsPop .grp:first-of-type{border-top:0;margin-top:0}
#toolsPop .grp>.label{color:var(--blue);padding:10px 2px 6px;letter-spacing:.16em}
#toolsPop .grp button{padding:10px 4px;font-size:15px;gap:14px}
#toolsPop .grp button svg{color:var(--blue)}
#toolsPop .grp button .td{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}

/* ===== Layout ===== */
#app{min-height:calc(100vh - 68px);container-type:inline-size;container-name:app}
.wrap{max-width:1560px;margin:0 auto;padding:26px 40px 60px}
body.chat-open #chat{display:flex}
@media (min-width:1200px){ body.chat-open{padding-right:var(--chatw)} }

/* ===== Dashboard / queue ===== */
.qcard{background:#121519;border:1px solid var(--line)}
.qcard+.sechd{margin-top:28px}
.qhd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 32px;border-bottom:1px solid var(--line)}
.sect{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--blue);letter-spacing:.1em}
.sect .cnt{color:var(--blue);opacity:.85}
.sechd{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px}
.sechd svg{color:var(--blue)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 18px;gap:18px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 32px 15px 22px;cursor:pointer;color:var(--text)}
.qrow:hover,.qrow:focus-visible{background:rgba(30,167,225,.05)}
.qrow:last-child{border-bottom:0}
.qrow .t{font-weight:700;font-size:16px;display:block;letter-spacing:.01em}
.qrow .rq{display:flex;gap:12px;align-items:center;margin-top:5px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-size:13.5px}
.qrow .rq .mono{color:var(--blue);letter-spacing:.02em;font-size:12px}
.qrow .pri,.qrow .chip{margin-top:3px}
.qrow .chev{color:var(--text2);margin-top:2px}
.qempty{padding:20px 32px;color:var(--text2)}
.slim{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:28px}
.mini{border:1px solid var(--line);background:rgba(17,20,24,.7);padding:14px 18px}
.health{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}
.hchip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2)}
.hchip .st{font-size:10.5px}
.act-item{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--text2)}
.act-item:last-child{border-bottom:0}
.act-item .mono{color:var(--muted)}
.svc{display:flex;align-items:center;gap:10px;padding:6px 0}
.svc span:nth-child(2){flex:1}
@container app (max-width:760px){ .slim{grid-template-columns:1fr} }

/* ===== Ticket ===== */
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:10px;background:none;border:0;color:var(--text2);cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.back:hover{color:var(--text)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:34px;height:18px;border-radius:9px;background:#2a323c;position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#cfd6dd;transition:transform .15s}
.switch input:checked+.knob{background:var(--blue)}
.switch input:checked+.knob::after{transform:translateX(16px);background:#fff}
.switch input:focus-visible+.knob{outline:2px solid var(--blue);outline-offset:2px}
.tlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1080px;margin:0 auto;align-items:start}
.tcard{background:#121519;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(30,167,225,.03),0 20px 60px rgba(0,0,0,.35)}
.tchd{position:relative;padding:26px 28px 22px;border-bottom:1px solid var(--line)}
.tmeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ref{color:var(--blue);font-size:14px;letter-spacing:.03em}
.ttitle{font-size:27px;line-height:1.25;margin:12px 120px 18px 0;letter-spacing:.06em}
.optbtn{position:absolute;top:58px;right:28px;display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--text2);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px}
.optbtn:hover{color:var(--text)}
.optbtn b{font-size:16px;letter-spacing:.05em;color:inherit}
.assignee{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:20px;padding:4px 14px 4px 4px;font-weight:700;font-size:13.5px;background:#0e1115}
.pill .avatar{width:28px;height:28px;font-size:11px}
.pill.none{color:var(--text2);font-weight:500}
.pill.none .avatar{background:#3a434d;color:#c3cbd3}
.assign{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--blue);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:6px 4px}
.assign:hover{color:var(--blue-h)}
.tcbd{padding:28px}
.desc{border:1px solid var(--line);background:#0e1115;padding:22px 24px;font-size:14.5px;line-height:1.6;color:#dfe5ea}
.desc p{margin:0 0 1.15em}
.desc p:last-child{margin:0}
.idk{text-align:center;margin:30px 0 4px}
.idk .linkbtn{font-size:14.5px;letter-spacing:.1em;text-transform:uppercase}
.hintcard{margin-top:14px}
.twork .card .hd{display:flex;align-items:center;gap:10px}
.twork .sepr{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.objs{list-style:none;padding:0;margin:8px 0}
.objs li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.objs .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid #4a5561;flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#03141c;font-weight:900}
.objs .ck.y{background:var(--ok);border-color:var(--ok)}
.hints{margin:8px 0 0;padding-left:18px}
.hints li{margin:6px 0}
.log{list-style:none;padding:0;margin:0}
.log li{display:flex;gap:10px;padding:5px 0;font-size:13px}
.log li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.log li.sys::before{background:#4a5561}
.log .tm{color:var(--muted);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.ok{background:rgba(60,207,142,.08);border:1px solid rgba(60,207,142,.35);color:#bff0d8}
.banner.ok b{color:var(--ok)}
@container app (min-width:1240px){
  .tlayout{grid-template-columns:minmax(0,1fr) 360px;max-width:1460px}
}
@container app (max-width:640px){
  .wrap{padding:16px 16px 48px}
  .tchd{padding:20px 18px 18px}
  .tcbd{padding:16px}
  .desc{padding:16px}
  .ttitle{font-size:20px;margin-right:0;margin-top:10px}
  .optbtn{position:static;margin:0 0 12px -4px}
  .qhd{padding:14px 16px}
  .qrow{padding:14px 16px;gap:10px;grid-template-columns:minmax(0,1fr) auto 14px}
  .qrow .chip,.qrow>span:empty{display:none}
  .qrow .t{font-size:14.5px}
  .qrow .rq{font-size:12px;flex-wrap:wrap;gap:4px 10px}
  .qempty{padding:16px}
  h1{font-size:21px}
  td,th{padding:8px 6px}
}

.tlayout.pastgrid{grid-template-columns:minmax(0,380px) minmax(0,1fr);max-width:none}
@container app (max-width:760px){ .tlayout.pastgrid{grid-template-columns:minmax(0,1fr)} }
/* ===== Split view ===== */
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}
.split>.split-tabs{display:none}
.tside .card{background:#121519}
.tside .card>.bd{padding:16px 18px}
.tside .ttitle{font-size:16px;margin:10px 0 8px;line-height:1.3}
.tside .desc{padding:12px 14px;font-size:13.5px;margin:10px 0}
@container app (max-width:1080px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split>.split-tabs{display:flex;gap:4px;margin-bottom:4px;border:1px solid var(--line);background:var(--surface)}
  .split.pane-tool .tside,.split.pane-ticket .tmain{display:none}
}

   2. STATE + PERSISTENCE — one root object S, saved to localStorage.
   ===================================================================== */
const KEY = 'deskops-lab-v2'; // v1 saves are ignored (fresh seed)
let S, memoryOnly = false, bootNote = null;
function validSave(s){
  return s && s.v===2 && s.users && s.workstations && s.net && s.mail && s.ui && s.ui.chat && s.profile && s.tickets && s.chat && s.voicemails && s.inventory &&
    TICKETS.every(t=>s.tickets[t.ref]);
}
function load(){
  let raw;
  try { raw = localStorage.getItem(KEY); } catch(e){ memoryOnly = true; return seed(); }
  if (!raw) return seed();
  try { const s = JSON.parse(raw); if (validSave(s)) return s; } catch(e){}
  bootNote = 'Saved progress couldn’t be read, so a fresh shift was started.';
  return seed();
}
function save(){
  if (memoryOnly) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }

}

/* Company chat: scripted, deterministic reply from a contact. Pure (reads s only), so selfTest can cover it.
   Extend here to add ticket-specific confirmations. */
function chatReply(s, userId, text){
  const u=s.users[userId], t=String(text||'').toLowerCase();
  const T=TICKETS.find(x=>x.req===userId && ['open','assigned'].includes(s.tickets[x.ref].status));
  if (T && /(try|test|check|work|now|again|fixed|sorted)/.test(t))
    return check(s,T.ref).complete ? 'I just tried again and it’s working now. Thank you so much!' : `I just tried again and it’s still not working, sorry. Same problem as in ${T.ref}.`;
  if (/^\s*(hi|hello|hey|morning|good morning)\b/.test(t)) return T ? `Hi! Thanks for picking up ${T.ref}. Let me know if you need me to try anything.` : `Hi! What can I do for you?`;
  if (/thank/.test(t)) return 'No problem, thanks for your help!';
  return T ? `Thanks, noted. I’m around if you need me to test anything for ${T.ref}.` : `Thanks for the message, ${u.id==='dokafor'?'keep me posted on the queue.':'I’ll get back to you if I need anything from IT.'}`;
}
function reqInfo(T){
  if (T.req){ const u=S.users[T.req]; return {name:u.name, dept:u.dept, loc:'Floor '+u.floor, ext:u.ext, email:u.email}; }
  return {name:T.reqName, dept:T.reqDept, loc:T.reqLoc, ext:T.reqExt, email:T.reqEmail};
}
/* Whether a workstation is reachable and has internal (company network) access. */
function netState(s, w){
  if (!w.power) return {up:false, internal:false, why:'Powered off'};
  if (w.remote) return {up:true, internal:w.vpn.connected, why:w.vpn.connected?'Connected over VPN':'Off-site — VPN not connected'};
  const d = s.net.devices;
  if (d.edge.status!=='online' || d.fw.status!=='online') return {up:false, internal:false, why:'Core network (edge router / firewall) is down'};
  const sw = Object.values(d).find(x=>x.kind==='switch' && x.floor===w.floor);
  if (sw && sw.status!=='online') return {up:false, internal:false, why:`Unreachable: ${sw.name} is down`};
  const wifiOk = w.wifi.connected==='Northstar-Staff';
  return {up:true, internal:wifiOk, why: wifiOk ? 'On the office network' : (w.wifi.connected ? 'On guest Wi-Fi (no internal access)' : 'Wi-Fi disconnected')};
}

    const [cmd, ...args] = line.trim().split(/\s+/); const c=(cmd||'').toLowerCase(), a=(args[0]||'').toLowerCase();

/* =====================================================================
   4. SCENARIOS — per-ticket objective checks over shared state.
   ===================================================================== */
function check(s, ref){
  const T=TK[ref], done=[], todo=[];
  T.obj.forEach(o=>{ (o.ok(s)?done:todo).push(o); });
  return {done:done.map(o=>o.done), todo:todo.map(o=>o.todo), complete:todo.length===0};
}
const isResolved = (s, ref) => s.tickets[ref].status==='assigned' && check(s,ref).complete;
function statusWord(ref){ const t=S.tickets[ref];
  if (isResolved(S,ref)) return 'Resolved';
  return {open:'Open', assigned:'Assigned', closed:'Closed', escalated:'Escalated', waiting:'Not arrived'}[t.status]; }

/* =====================================================================
   5. LIFECYCLE + SCORING
   ===================================================================== */
function notesBonus(T, notes){
  const n=(notes||'').toLowerCase(); let b=0;
  if (n.length>=40) b++;
  if (T.keys.some(k=>n.includes(k))) b++;
  if (/verif|confirm|test/.test(n)) b++;
  return b;
}
/* mode: 'close' | 'escalate'. Returns {lines:[[label,pts]], total, outcome}. */
function scoreFor(s, ref, mode, notes){
  const T=TK[ref], t=s.tickets[ref], P=PRI[T.pri], lines=[]; let outcome;
  if (mode==='escalate' && !T.security){ lines.push(['Routine escalation (work not needing Security)', -8]); outcome='Escalated'; }
  else if (mode==='escalate' || check(s,ref).complete){
    lines.push([`${P.w} ticket resolved`, P.pts]);
    if (mode==='escalate'){ const r=rule(s,'r1'); if (r.inspected && !r.deleted) lines.push(['Correct security escalation', 12]); outcome='Routed to Security'; }
    else outcome='Resolved';
    const nb=notesBonus(T,notes); if (nb) lines.push(['Resolution notes', nb]);
  } else { lines.push([`Closed while unresolved (${P.w})`, -P.pen]); outcome='Closed unresolved'; }
  Object.values(t.penalties).forEach(([p,why])=>lines.push([why,-p]));
  const raw=lines.reduce((a,l)=>a+l[1],0), total=Math.max(-20,Math.min(42,raw));
  if (total!==raw) lines.push(['Ticket score cap (−20…+42)', total-raw]);
  return {lines, total, outcome};
}
function arrivals(s){
  TICKETS.forEach(T=>{ const t=s.tickets[T.ref];
    if (t.status==='waiting' && ['closed','escalated'].includes(s.tickets[T.after].status)){
      t.status='open'; if (T.arrive) T.arrive(s);
      logEntry(s,'Service Desk',T.ref,`New ticket ${T.ref} arrived: ${T.title}`,null); } });
}
function logEntry(s, tool, entity, text, ref){
  s.log.unshift({t:now(), tool, entity, text, ref});
  if (s.log.length>400) s.log.length=400;
}
function finishTicket(ref, mode, notes){
  const t=S.tickets[ref], sc=scoreFor(S,ref,mode,notes);
  t.status = mode==='escalate' ? 'escalated' : 'closed';
  t.result = {mode, outcome:sc.outcome, lines:sc.lines, total:sc.total, notes, at:now(), model:TK[ref].model};
  S.profile.points += sc.total;
  logEntry(S,'Service Desk',ref,`${ref} ${mode==='escalate'?'escalated to Security':'closed'} · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`,ref);
  delete S.ui.drafts[ref];
  arrivals(S);
  return sc;
}

function render(){
  const a = document.activeElement, roots=[app, $('chat')];
  const sig = el => el.dataset.key || (el.dataset.act ? `${el.dataset.act}|${el.dataset.id||''}|${el.dataset.arg||''}` : '');
  const key = a && roots.some(r=>r.contains(a)) ? sig(a) : '', pos = a && a.selectionStart;
  if (S.ui.view==='ticket' && ['closed','escalated'].includes(S.tickets[S.ui.ticket].status)) { S.ui.view='past'; S.ui.past=S.ui.ticket; }
  app.innerHTML = VIEW[S.ui.view]();
  renderChat(); renderTop();
  if (key) {
    const n = [...document.querySelectorAll('#app [data-key],#app [data-act],#chat [data-key],#chat [data-act]')].find(e=>sig(e)===key);
    if (n) { n.focus({preventScroll:true}); try { if (pos!=null && n.setSelectionRange) n.setSelectionRange(pos,pos); } catch(e){} }
  }
  save();
}
function renderTop(){
  const p=S.profile.points, rk=rankOf(p), unread=Object.values(S.chat.unread).reduce((x,y)=>x+y,0), vm=S.voicemails.filter(v=>!v.heard).length;

/* ----- Dashboard ----- */
function qrow(T, showStatus){
  const r=reqInfo(T);
  return `<button class="qrow" data-act="open" data-id="${T.ref}">
    <span><span class="t">${esc(T.title)}</span><span class="rq"><span class="mono">${T.ref}</span><span>${esc(r.name)}</span></span></span>
    ${showStatus?`<span class="chip ${isResolved(S,T.ref)?'ok':'blue'}">${statusWord(T.ref)}</span>`:'<span></span>'}${priTag(T.pri)}<span class="chev" aria-hidden="true">${icon('chev',18)}</span></button>`;
}
function systems(){
  const d=S.net.devices, sv=S.net.servers, sw=['sw1','sw2','sw3'].filter(k=>d[k].status==='online').length;
  const rows=[
    ['Internet', d.isp.status==='online', d.isp.status==='online'?'Online':'Down'],
    ['Core network', d.edge.status==='online'&&d.fw.status==='online', d.edge.status==='online'&&d.fw.status==='online'?'Healthy':'Down'],
    ['Floor switches', sw===3, `${sw}/3 online`],
    ['Directory', serverHealthy(sv.DC01)&&serverHealthy(sv.DC02), 'Healthy'],
    ['Mail', serverHealthy(sv.MAIL01), serverHealthy(sv.MAIL01)?'Healthy':'Degraded'],
    ['Printing', serverHealthy(sv.PRINT01), serverHealthy(sv.PRINT01)?'Healthy':'Degraded']];
  return rows.map(([n,ok,w])=>`<span class="hchip"><span class="dot ${ok?'ok':'bad'}"></span>${n} ${stat(ok,w)}</span>`).join('');
}
function vDash(){
  const open=TICKETS.filter(T=>S.tickets[T.ref].status==='open').sort(byPri);
  const mine=TICKETS.filter(T=>S.tickets[T.ref].status==='assigned').sort(byPri);
  const queue = open.length ? open.map(T=>qrow(T)).join('') :
    `<div class="empty">${mine.length?'No unclaimed incidents. Finish the tickets in My Queue.':'All available incidents are cleared. Nice shift.'}<br><button class="btn" style="margin-top:12px" data-act="go" data-id="past">Review past tickets</button></div>`;
  return `<div class="wrap">
    <section class="qcard" aria-labelledby="mq"><div class="qhd"><h2 id="mq" class="sect">${icon('user',20)} My Queue <span class="cnt">${mine.length}</span></h2><span class="label">Assigned to you</span></div>
      ${mine.length ? mine.map(T=>qrow(T,true)).join('') : '<div class="qempty">Nothing assigned to you yet. Open an incident below and select <b>Assign to me</b>.</div>'}</section>
    <div class="sechd">${icon('ticket',16)} Ticket queue</div>
    <section class="qcard" aria-labelledby="qh"><div class="qhd"><h2 id="qh" class="sect">${icon('clip',20)} Incidents</h2><span class="label">${open.length} open</span></div>${queue}</section>
    <div class="slim">
      <section class="mini" aria-label="Service health"><div class="row"><span class="label">Service health</span><span class="spacer"></span><button class="linkbtn small" data-act="tool" data-id="server">Server Room ${icon('chev',14)}</button></div><div class="health">${systems()}</div></section>
      <section class="mini" aria-label="Recent activity"><div class="label">Recent activity</div><div style="margin-top:6px">
        ${S.log.length ? S.log.slice(0,3).map(l=>`<div class="act-item"><span class="mono">${l.t}</span> ${esc(l.text)}</div>`).join('') : '<p class="muted small">No actions yet this shift.</p>'}</div></section>
    </div></div>`;
}

/* ----- Ticket ----- */
function objectivesHtml(ref){
  const t=S.tickets[ref];
  if (!t.checked) return '<p class="muted small">Run <b>Check fix</b> to see which requirements are met.</p>';
  const c=check(S,ref);
  return `<ul class="objs">${c.done.map(x=>`<li><span class="ck y">✓</span><span>${esc(x)}</span></li>`).join('')}${c.todo.map(x=>`<li><span class="ck"></span><span>${esc(x)}</span></li>`).join('')}</ul>
    <p class="muted small">${c.complete?'All requirements met. Review your work and close the ticket.':'Next: '+esc(c.todo[0])+'.'} This list updates live.</p>`;
}
function hintsHtml(ref){
  if (!S.settings.hints) return '';
  const T=TK[ref], n=S.tickets[ref].hints;
  return `<ol class="hints">${T.hints.slice(0,n).map(h=>`<li>${esc(h)}</li>`).join('')}</ol>
    ${n>T.hints.length ? `<div class="note"><b>Model answer.</b> ${esc(T.model)}</div>` : ''}
    ${n<=T.hints.length ? `<button class="linkbtn small" data-act="hint" data-id="${ref}">${n<T.hints.length?`Show hint ${n+1} of ${T.hints.length}`:'Show model answer'}</button>` : ''}
    <p class="muted small">Hints don’t affect your score.</p>`;
}
function ticketLog(ref){
  const T=TK[ref], t=S.tickets[ref], r=reqInfo(T);
  const items=[...S.log.filter(l=>l.ref===ref).map(l=>({t:l.t, text:`${l.tool}: ${l.text}`})), ...t.notes.map(n=>({t:n.t, text:'Work note: '+n.text}))].reverse();
  return `<ul class="log"><li class="sys"><span class="tm">${T.created}</span><span>Ticket opened by ${esc(r.name)}</span></li>
    ${items.length ? items.map(i=>`<li><span class="tm">${i.t}</span><span>${esc(i.text)}</span></li>`).join('') : '<li class="sys"><span class="tm">—</span><span class="muted">No technician actions yet</span></li>'}</ul>`;
}

  const hd=`<div class="chhd"><h2>${icon('chat',22)} Company Chat</h2><button class="ibtn" data-act="chat" aria-label="Close company chat">${icon('x',20)}</button></div>`;

   7. EVENTS — one delegated click/input/keydown handler each.
   All environment mutations funnel through act().

function act(tool, entity, action, fn){
  const text = fn(S);
  const ref = S.ui.ticket && S.tickets[S.ui.ticket].status==='assigned' ? S.ui.ticket : null;
  if (text) { logEntry(S, tool, entity, text, ref); S.ui.flash = {tool, text}; }
  const key = action+':'+entity;
  TICKETS.forEach(T=>{ const p=T.penalties && T.penalties[key], t=S.tickets[T.ref];
    if (p && t.status==='assigned' && !t.penalties[key]) { t.penalties[key]=p; toast(`${T.ref}: ${p[1]} (−${p[0]} pts at close)`, 'warn'); } });
  render();
}
function hidePops(){ document.querySelectorAll('[popover]').forEach(p=>{ try { p.hidePopover(); } catch(e){} }); }
const splitArg = a => { const i=a.indexOf(':'); return i<0 ? [a,''] : [a.slice(0,i), a.slice(i+1)]; };
const danger = (title, body, ok, fn) => confirmDlg(title, `<p>${body}</p>`, ok, true, fn);

const ACT = {
  go(d){ S.ui.view=d.id; if (d.id==='dash') S.ui.ticket=null; hidePops(); render(); scrollTo(0,0); },
  open(d){ S.ui.view='ticket'; S.ui.ticket=d.id; hidePops(); render(); scrollTo(0,0); },
  tool(d){ S.ui.view='tool'; S.ui.tool=d.id; S.ui.flash=null; S.ui.tab.split='tool'; hidePops(); render(); scrollTo(0,0); },
  tab(d){ S.ui.tab[d.id]=d.arg; render(); },
  sel(d){ S.ui.sel[d.id]=d.arg; render(); },
  selDev(d){ S.ui.sel.dev=d.id; render(); },
  pastSel(d){ S.ui.past=d.id; render(); },
  claim(d){ const t=S.tickets[d.id]; t.status='assigned'; t.assignee=S.profile.name; S.ui.ticket=d.id; hidePops();
    logEntry(S,'Service Desk',d.id,`${d.id} assigned to ${S.profile.name}`,d.id); render(); },
  unclaim(d){ const t=S.tickets[d.id]; t.status='open'; t.assignee=null; hidePops();
    logEntry(S,'Service Desk',d.id,`${d.id} returned to the queue`,d.id); render(); },
  hint(d){ S.tickets[d.id].hints++; render(); },
  checkFix(d){ const t=S.tickets[d.id], c=check(S,d.id); t.checked=true;
    toast(c.complete ? `${d.id}: all requirements met.` : `${d.id}: ${c.done.length} of ${c.done.length+c.todo.length} requirements met. ${c.todo[0]}.`); render(); },
  addNote(d){ const v=$('noteIn').value.trim(); if (!v) return; S.tickets[d.id].notes.push({t:now(), text:v}); render(); },
  closeDlg(d){ hidePops(); closeDialog(d.id); },
  escalateDlg(d){ hidePops(); escalateDialog(d.id); },
  doClose(d){ const sc=finishTicket(d.id,'close',S.ui.drafts[d.id]||''); closeDlg();
    S.ui.view='past'; S.ui.past=d.id; S.ui.ticket=null; toast(`${d.id} closed · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`); render(); },
  doEscalate(d){ const notes=S.ui.drafts[d.id]||''; if (notes.trim().length<15) return;
    const sc=finishTicket(d.id,'escalate',notes); closeDlg(); S.ui.view='past'; S.ui.past=d.id; S.ui.ticket=null;
    if (d.id==='INC-1049') { const r=rule(S,'r1'); if (!r.deleted) r.action+=' — disabled by Security, evidence preserved'; }
    toast(`${d.id} escalated · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`); render(); },
  dlgCancel(){ closeDlg(); },
  confirmOk(){ const f=pendingConfirm; pendingConfirm=null; closeDlg(); if (f) f(); },
  guide(){ hidePops(); guideDialog(false); },
  achDlg(){ hidePops(); achDialog(); },
  hintToggle(d){ const t=S.tickets[d.id]; S.ui.hintOpen = S.ui.hintOpen===d.id ? null : d.id; if (S.ui.hintOpen && !t.hints) t.hints=1; render(); },
  heard(d){ act('Voicemails', d.id, 'heard', s=>ENV.heard(s,d.id)); },
  chat(){ const c=S.ui.chat; c.open=!c.open; hidePops(); render(); if (c.open){ const f=$('chatIn')||$('chat').querySelector('input'); if (f) f.focus(); } else $('chatBtn').focus(); },
  chatTab(d){ S.ui.chat.tab=d.id; render(); },
  chatOpen(d){ S.ui.chat.sel=d.id; delete S.chat.unread[d.id]; render(); $('chatIn').focus(); },
  chatBack(){ S.ui.chat.sel=null; render(); },
  chatPin(d){ const p=S.chat.pinned; S.chat.pinned = p.includes(d.id) ? p.filter(x=>x!==d.id) : p.concat(d.id); render(); },
  chatSend(d){ const v=$('chatIn').value; if (!v.trim()) return; act('Company Chat', d.id, 'chat', s=>ENV.chatSend(s,d.id,v)); $('chatIn').focus(); },
  startShift(){ closeDlg(); renderMenus(); render(); },
  resetDlg(){ hidePops(); danger('Reset all progress?', 'This clears your points, ticket history and every change to the simulated environment, then starts a fresh shift. It can’t be undone.', 'Reset progress',
    ()=>{ S=seed(); S.profile.firstRun=false; renderMenus(); render(); guideDialog(true); toast('Progress reset. Fresh shift started.'); }); },

  dir(d){ const id=d.id, u=S.users[id], run=op=>act('Directory', id, op, s=>ENV[op](s,id));
    if (d.arg==='disable') return danger(`Disable ${u.id}?`, `${esc(u.name)} won’t be able to sign in until the account is enabled again.`, 'Disable account', ()=>run('disable'));
    if (d.arg==='resetMfa') return danger(`Reset MFA for ${u.id}?`, `Only do this after confirming the caller’s identity. ${esc(first(u.name))} will have to re-enrol a device at next sign-in.`, 'Reset MFA', ()=>run('resetMfa'));
    if (d.arg==='resetPassword') return confirmDlg(`Reset password for ${u.id}`, `<p>A temporary lab password will be issued. No real password is set or stored.</p>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mustChk" checked> User must change password at next sign-in</label>`, 'Reset password', false,
      ()=>{ const must=$('mustChk').checked; act('Directory', id, 'resetPassword', s=>ENV.resetPassword(s,id,must)); });
    run(d.arg); },
  dirGroup(d){ const [op,g]=splitArg(d.arg), grp = op==='add' ? $('grpSel').value : g;
    act('Directory', d.id, op+'Group', s=>op==='add' ? ENV.addGroup(s,d.id,grp) : ENV.removeGroup(s,d.id,grp)); },
  dev(d){ const x=S.net.devices[d.id], run=()=>act('Server Room', d.id, d.arg, s=>ENV[d.arg](s,d.id));
    if ((x.kind==='router'||x.kind==='firewall') && d.arg!=='on') return danger(`${d.arg==='off'?'Power off':'Reboot'} ${x.name}?`, `Every floor depends on the ${x.name}. ${d.arg==='off'?'Powering it off cuts the whole office off':'A reboot drops the whole office for about two minutes'}.`, d.arg==='off'?'Power off':'Reboot anyway', run);
    if (d.arg==='off' && x.kind!=='printer') return danger(`Power off ${x.name}?`, `Everything connected through ${x.name} will lose its network.`, 'Power off', run);
    run(); },
  srvAct(d){ act('Server Room', d.id, d.arg, s=>d.arg==='testPage' ? ENV.testPage(s) : ENV.rebootServer(s,d.id)); },
  svc(d){ const [op,n]=splitArg(d.arg), stop=op==='stop';
    act('Server Room', d.id, stop?'stopService':'restartService', s=>stop ? ENV.stopService(s,d.id,n) : ENV.restartService(s,d.id,op)); },

  rdpConnect(d){ const w=S.workstations[d.id];
    confirmDlg(`Remote session to ${w.host}`, `<p>Owner: <b>${w.owner?esc(S.users[w.owner].name):'Shared device'}</b> · ${esc(w.site)}</p>
      ${kv([['Sign in as','<span class="mono">NORTHSTAR\\svc-deskops-lab</span>'],['Credential','Lab service credential (simulated, nothing stored)']])}
      <p class="muted small">Sessions are simulated inside this page. No real machine is contacted.</p>`, 'Connect', false,
      ()=>{ S.ui.rdp={host:w.host, app:null, max:false}; S.ui.sel.share=null; logEntry(S,'Remote Desktop',w.host,`Remote session opened to ${w.host}`,S.ui.ticket); render(); }); },
  rdpOff(){ logEntry(S,'Remote Desktop',S.ui.rdp.host,`Remote session to ${S.ui.rdp.host} closed`,S.ui.ticket); S.ui.rdp=null; render(); },
  rdpMax(){ S.ui.rdp.max=!S.ui.rdp.max; render(); },
  rdpApp(d){ S.ui.rdp.app=d.id||null; S.ui.sel.share=null; render(); },
  rdpAct(d){ const [op,arg]=splitArg(d.arg);
    act('Remote Desktop', d.id, op, s=>{ const r=ENV[op](s,d.id,arg); if (op==='openShare') S.ui.sel.share = r.startsWith('Opened') ? arg : null; return r; }); },

  trace(){ const f={who:S.ui.q.traceWho, status:S.ui.q.traceStatus, time:S.ui.q.traceTime};
    act('Mail Admin','trace','trace', s=>{ S.ui.trace=ENV.trace(s,f); return `Message trace${f.who?` for “${f.who}”`:''} returned ${S.ui.trace.length} result${S.ui.trace.length===1?'':'s'}.`; }); },
  mb(d){ const gb=Number(($('quotaSel')||{}).value||5);
    act('Mail Admin', d.id, d.arg, s=>d.arg==='setQuota' ? ENV.setQuota(s,d.id,gb) : ENV[d.arg](s,d.id)); },
  rule(d){ const r=rule(S,d.id);
    if (d.arg==='inspect') { S.ui.sel.rule=d.id; return act('Mail Admin', d.id, 'inspectRule', s=>ENV.inspectRule(s,d.id)); }
    danger(`Delete rule “${r.name}”?`, r.external ? 'This rule looks like a compromise indicator. Deleting it destroys evidence Security needs, and the attacker may still have access. Escalating is the safe path.' : 'The rule will be removed from the mailbox.',
      r.external ? 'Delete anyway' : 'Delete rule', ()=>act('Mail Admin', d.id, 'deleteRule', s=>ENV.deleteRule(s,d.id))); },
  qAct(d){ const q=S.mail.quarantine.find(x=>x.id===d.id), run=()=>act('Mail Security', d.id, d.arg, s=>ENV[d.arg](s,d.id));
    if (d.arg==='release' && q.kind==='phish') return danger('Release a phishing message?', 'The filter scored this as a credential-harvest attempt. Releasing it puts a live phishing link in a user’s inbox. Keep it blocked or report it to Security instead.', 'Release anyway', run);
    run(); }
};

/* Two-way bindings for inputs: search boxes, selects, checkboxes, drafts. */
const BIND = {
  q(el){ S.ui.q[el.dataset.id]=el.value; render(); },
  chatQ(el){ S.ui.chat.q=el.value; render(); },
  sel(el){ S.ui.sel[el.dataset.id]=el.value; render(); },
  name(el){ S.profile.name=el.value.trim()||'Technician'; renderTop(); save(); },
  hints(el){ S.settings.hints=el.checked; render(); },
  split(el){ S.settings.split=el.checked; render(); renderMenus(); },
  draft(el){ const ref=el.dataset.id; S.ui.drafts[ref]=el.value; save();
    $('cnt').textContent = `${el.value.length}/600` + (el.dataset.esc?' · at least 15 characters':'');
    $('prev').innerHTML = prevHtml(scoreFor(S, ref, el.dataset.esc?'escalate':'close', el.value));
    if (el.dataset.esc) $('closeGo').disabled = el.value.trim().length<15; },
  vpnProfile(el){ act('Remote Desktop', el.dataset.id, 'vpnProfile', s=>ENV.vpnProfile(s, el.dataset.id, el.value)); },
  asset(el){ act('Asset Management', el.dataset.id, 'setAsset', s=>ENV.setAsset(s, el.dataset.id, el.dataset.arg, el.value)); }
};
function runTerm(el){
  const host=el.dataset.term, line=el.value; if (!line.trim()) return;
  const out=ENV.term(S, host, line), prev=S.ui.term[host]||[];
  S.ui.term[host] = /^\s*cls\b/i.test(line) ? [] : prev.concat([`${host}> ${line}`], out).slice(-80);
  logEntry(S,'Remote Desktop',host,`Ran “${line.trim()}” on ${host}`, S.ui.ticket && S.tickets[S.ui.ticket].status==='assigned' ? S.ui.ticket : null);
  render(); const t=app.querySelector('.term'); if (t) t.scrollTop=t.scrollHeight;
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f=ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset); }
});
document.addEventListener('input', e=>{ const el=e.target, f=el.dataset && BIND[el.dataset.bind]; if (f) f(el); });
document.addEventListener('keydown', e=>{
  const el=e.target;
  if (e.key==='Enter' && el.dataset && el.dataset.term) { e.preventDefault(); runTerm(el); return; }
  if (e.key==='Enter' && el.id==='noteIn') { e.preventDefault(); ACT.addNote({id:S.ui.ticket}); return; }
  if (e.key==='Enter' && el.id==='chatIn') { e.preventDefault(); ACT.chatSend({id:S.ui.chat.sel}); return; }
  if ((e.key==='Enter'||e.key===' ') && el.getAttribute && el.getAttribute('role')==='button' && el.tagName!=='BUTTON') { e.preventDefault(); el.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
  if (e.key==='Escape' && !dlg.open && S.ui.rdp && S.ui.rdp.max) { S.ui.rdp.max=false; render(); return; }
  if (e.key==='Escape' && !dlg.open && S.ui.chat.open && !document.querySelector(':popover-open')) { ACT.chat(); }
});
/* Place popovers under the button that opened them. */
document.addEventListener('toggle', e=>{
  const p=e.target; if (!p.matches || !p.matches('[popover]:not(.modal)') || e.newState!=='open') return;
  const b=document.activeElement && document.activeElement.getAttribute('popovertarget')===p.id ? document.activeElement : document.querySelector(`[popovertarget="${p.id}"]`);
  if (!b) return; const r=b.getBoundingClientRect();
  p.style.top=(r.bottom+6)+'px'; p.style.left=Math.max(8, Math.min(r.right>innerWidth*.6 ? r.right-p.offsetWidth : r.left, innerWidth-p.offsetWidth-8))+'px';
}, true);

/* =====================================================================
   8. SELF-TEST — runs every scenario from a fresh seed (open index.html#selftest).
   ===================================================================== */
function selfTest(){
  const out=[], ok=(c,n)=>out.push([!!c,n]), done=(s,r)=>check(s,r).complete;
  const fresh=ref=>{ const s=seed(), T=TK[ref]; if (T.after){ s.tickets[T.after].status='closed'; arrivals(s); } return s; };
  let s, s2;
  s=fresh('INC-1042'); ok(!done(s,'INC-1042'),'1042 not complete at seed');
  ENV.resetPassword(s,'mchen',true); ok(!done(s,'INC-1042'),'1042 password reset alone does not unlock');
  ENV.unlock(s,'mchen'); ok(done(s,'INC-1042'),'1042 unlock completes it');
  s=fresh('INC-1043'); ENV.unlock(s,'ebrooks'); ok(!done(s,'INC-1043') && check(s,'INC-1043').done.length===1,'1043 unlock alone is partial');
  ENV.resetPassword(s,'ebrooks',true); ok(!done(s,'INC-1043'),'1043 still needs a sign-in test');
  ENV.testSignIn(s,'ebrooks'); ok(done(s,'INC-1043'),'1043 complete after unlock + reset + test');
  s=fresh('INC-1044'); ok(s.tickets['INC-1044'].status==='open' && !s.users.mchen.groups.includes('Finance-Share'),'1044 arrives after 1042 and removes the group');
  ok(seed().tickets['INC-1044'].status==='waiting','1044 waits at seed');
  ENV.unlock(s,'mchen'); ENV.resetPassword(s,'mchen',false); ok(!done(s,'INC-1044'),'1044 password reset does not fix permissions');
  ENV.addGroup(s,'mchen','Finance-Share'); ok(!done(s,'INC-1044') && ENV.openShare(s,'NS-FIN-014','\\\\FILE01\\Finance').includes('denied'),'1044 needs a session refresh');
  ENV.refreshSession(s,'mchen'); ok(done(s,'INC-1044') && ENV.openShare(s,'NS-FIN-014','\\\\FILE01\\Finance').startsWith('Opened'),'1044 complete and share opens');
  s=fresh('INC-1045'); ok(!netState(s,s.workstations['NS-MKT-011']).up,'Floor 3 hosts offline at seed');
  ENV.reboot(s,'edge'); ok(!done(s,'INC-1045'),'1045 core reboot is not the fix');
  ENV.on(s,'sw3'); ok(done(s,'INC-1045') && netState(s,s.workstations['NS-MKT-011']).up,'1045 switch restores Floor 3');
  s=fresh('INC-1046'); ENV.connectWifi(s,'NS-OPS-021','Northstar-Staff'); ok(s.workstations['NS-OPS-021'].wifi.connected===null,'1046 broken profile cannot connect');
  ENV.forgetWifi(s,'NS-OPS-021','Northstar-Staff'); ENV.connectWifi(s,'NS-OPS-021','Northstar-Staff'); ok(!done(s,'INC-1046'),'1046 still needs a connectivity test');
  ENV.term(s,'NS-OPS-021','ping 10.0.0.1'); ok(done(s,'INC-1046'),'1046 complete after ping');
  s=fresh('INC-1047'); ENV.trace(s,{who:'priya'}); ok(!done(s,'INC-1047'),'1047 trace alone does not fix');
  ENV.release(s,'q1'); ok(!done(s,'INC-1047'),'1047 needs delivery confirmed');
  ENV.trace(s,{who:'priya'}); ok(done(s,'INC-1047'),'1047 complete after re-trace');
  s=fresh('INC-1048'); ENV.testMail(s,'awilson'); ok(!done(s,'INC-1048'),'1048 test bounces while full');
  ENV.enableArchive(s,'awilson'); ENV.testMail(s,'awilson'); ok(done(s,'INC-1048'),'1048 complete after archive + test');
  s=fresh('INC-1049'); ENV.inspectRule(s,'r1'); s.tickets['INC-1049'].status='escalated'; ok(done(s,'INC-1049'),'1049 complete when inspected + escalated');
  s2=fresh('INC-1049'); ENV.inspectRule(s2,'r1'); ENV.deleteRule(s2,'r1'); s2.tickets['INC-1049'].status='escalated'; ok(!done(s2,'INC-1049'),'1049 deleting the rule is not rewarded');
  s=fresh('INC-1050'); ENV.reboot(s,'prn1'); ok(!done(s,'INC-1050'),'1050 printer reboot is not the fix');
  ENV.restartService(s,'PRINT01','Print Spooler'); ENV.testPage(s); ok(done(s,'INC-1050'),'1050 complete after spooler + test page');
  s=fresh('INC-1051'); ENV.vpnConnect(s,'NS-SALES-008'); ok(!s.workstations['NS-SALES-008'].vpn.connected,'1051 legacy profile fails');
  ENV.vpnProfile(s,'NS-SALES-008','Northstar-Staff'); ENV.vpnConnect(s,'NS-SALES-008'); ENV.term(s,'NS-SALES-008','ping file01'); ok(done(s,'INC-1051'),'1051 complete after profile + connect + ping');
  ok(ENV.term(seed(),'NS-OPS-021','rm -rf /')[0].includes('not recognized'),'terminal rejects unknown commands');
  s=fresh('INC-1042'); ENV.unlock(s,'mchen'); ok(scoreFor(s,'INC-1042','close','Unlocked mchen in Directory and confirmed Maya can sign in.').total===25,'score: High + full notes bonus = 25');
  ok(scoreFor(fresh('INC-1045'),'INC-1045','close','').total===-20,'score: unresolved Critical close = −20');
  s=fresh('INC-1049'); ENV.inspectRule(s,'r1'); ok(scoreFor(s,'INC-1049','escalate','Rule forwards all mail to external-archive@outside.example').total===42,'score: security escalation capped at +42');
  ok(scoreFor(fresh('INC-1042'),'INC-1042','escalate','not security').total===-8,'score: routine escalation = −8');
  s=seed(); ok(Object.keys(s.users).length===12 && Object.values(s.users).every(u=>s.workstations[u.host] && s.mail.mailboxes[u.id]),'12 staff, each with a workstation and mailbox');
  ok(chatReply(s,'dokafor','status?').startsWith('Thanks for the message'),'chat: default polite acknowledgement');
  ok(chatReply(s,'mchen','can you try now?').includes('still not working') ,'chat: requester reports unresolved ticket');
  ENV.unlock(s,'mchen'); ok(chatReply(s,'mchen','can you try now?').includes('working now'),'chat: requester confirms once fixed');
  ENV.chatSend(s,'jprice','Hello Jordan','09:00'); ok(s.chat.threads.jprice.length===2 && s.chat.threads.jprice[0].from==='me' && s.chat.recent[0]==='jprice','chat: send appends message + scripted reply');
  ok(ENV.chatSend(s,'jprice','   ')==='' && s.chat.threads.jprice.length===2,'chat: blank message ignored');
  ENV.heard(s,'vm1'); ok(s.voicemails[0].heard && !s.voicemails[1].heard,'voicemail: mark as listened');
  ok(rankOf(-5)==='Trainee' && rankOf(40)==='Bronze' && rankOf(179)==='Silver' && rankOf(500)==='Platinum','rank thresholds');
  ok(!validSave(Object.assign(seed(),{v:1})) && validSave(JSON.parse(JSON.stringify(seed()))),'save schema v2 only');
  return {pass: out.every(r=>r[0]), results: out};
}
window.selfTest = selfTest;

/* ===== Boot ===== */
document.querySelectorAll('[data-ic]').forEach(e=>{ e.innerHTML=icon(e.dataset.ic, e.dataset.ic==='chevd'?16:20); });
S = load();
if (memoryOnly) $('memNote').classList.remove('hide');
renderMenus(); render();
if (bootNote) toast(bootNote, 'warn');
if (location.hash==='#selftest') {
  const r=selfTest();
  openDlg(`<div class="dh"><h2 id="dlgTitle">Self-test: ${r.pass?'all passed':'FAILURES'}</h2></div><div class="db"><ul class="objs">${r.results.map(([p,n])=>`<li><span class="ck ${p?'y':''}">${p?'✓':''}</span><span>${esc(n)}</span></li>`).join('')}</ul></div><div class="df"><button class="btn primary" data-act="dlgCancel">Close</button></div>`);
} else if (S.profile.firstRun) { S.profile.firstRun=false; save(); guideDialog(true); }
</script>
