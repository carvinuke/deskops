<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskOps Lab</title>
<!--
  DeskOps Lab — an offline IT service-desk training sandbox.
  Everything (styles, data, icons, logic) lives in this one file. No network, no login.
  Every account, device, mailbox and command is fictional local game state.
-->
<style>
/* ===== Tokens (dark only; every text colour clears WCAG AA on --surface) ===== */
:root{
  color-scheme:dark;
  --bg:#0a0c0f; --surface:#111418; --surface2:#15191e; --raise:#1b2027; --line:#1f262e; --line2:#2c3540;
  --text:#e7ebef; --text2:#a6b0bb; --muted:#8d99a6;
  --blue:#1ea7e1; --blue-h:#4cbcec; --blue-bg:rgba(30,167,225,.10); --blue-line:rgba(30,167,225,.38);
  --crit:#ff5a5f; --high:#ff8b3d; --med:#f2b33d; --low:#c9c35c;
  --ok:#3ccf8e; --warn:#f0a33a; --off:#6b7682; --down:#ff6b6b;
  --r:4px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --chatw:420px;
  font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
}
/* ===== Base ===== */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:44px 44px;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:26px;line-height:1.2}
h2{font-size:17px}
h3{font-size:15px}
p{margin:.3em 0}
a{color:var(--blue)}
b,strong{color:#f3f6f8}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
::selection{background:rgba(30,167,225,.35)}
.disp,h1,.ttitle,.sect,.chd h2,.chhd h2,.dh h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--text2)}
.small{font-size:12px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.label.blue{color:var(--blue)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hide{display:none!important}
svg{flex:none}
[data-ic]{display:contents}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface2);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:600;font-size:12.5px;letter-spacing:.04em;white-space:nowrap;color:var(--text)}
.btn:hover{border-color:#3b4652;background:var(--raise)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#03141c}
.btn.primary:hover{background:var(--blue-h);border-color:var(--blue-h)}
.btn.danger{color:var(--down);border-color:rgba(255,107,107,.4)}
.btn.danger:hover{background:rgba(255,90,95,.08)}
.btn.danger.solid{background:#d83a40;color:#fff;border-color:#d83a40}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{color:var(--off);background:var(--surface);border-color:var(--line);cursor:not-allowed}
.linkbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-weight:600;letter-spacing:.04em}
.linkbtn:hover{color:var(--blue-h)}
input:not([type]),input[type=text],input[type=search],select,textarea{border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px;background:#0d1014;min-width:0;color:var(--text)}
input::placeholder,textarea::placeholder{color:#7a8693}
input:not([type]):focus,input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px var(--blue-line)}
input[type=checkbox]{accent-color:var(--blue)}
textarea{width:100%;resize:vertical}
input[type=search]{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>.hd{padding:14px 20px 12px;border-bottom:1px solid var(--line)}
.card>.bd{padding:16px 20px}
.card+.card{margin-top:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(60,207,142,.5)}.dot.bad{background:var(--crit);box-shadow:0 0 6px rgba(255,90,95,.5)}.dot.warn{background:var(--warn)}
.st{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.st.ok{color:var(--ok)}.st.bad{color:var(--down)}.st.warn{color:var(--warn)}.st.off{color:var(--muted)}
.pri{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pri.critical{color:var(--crit)}.pri.high{color:var(--high)}.pri.medium{color:var(--med)}.pri.low{color:var(--low)}
.chip{display:inline-block;border:1px solid var(--line2);border-radius:3px;padding:1px 7px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);background:var(--surface2);white-space:nowrap}
.chip.blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-h)}
.chip.ok{background:rgba(60,207,142,.08);border-color:rgba(60,207,142,.35);color:var(--ok)}
.chip.bad{background:rgba(255,90,95,.08);border-color:rgba(255,90,95,.38);color:var(--down)}
.chip.warn{background:rgba(240,163,58,.08);border-color:rgba(240,163,58,.38);color:var(--warn)}
.note{border-left:3px solid var(--blue);background:var(--blue-bg);padding:10px 12px;border-radius:3px;margin:10px 0}
.note.warn{border-color:var(--warn);background:rgba(240,163,58,.08)}
.note.bad{border-color:var(--crit);background:rgba(255,90,95,.08)}
.note.ok{border-color:var(--ok);background:rgba(60,207,142,.08)}
.bar{height:6px;background:#202730;border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--blue)}
.bar.hot>i{background:var(--crit)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.015)}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--blue-bg)}
.tablewrap{overflow-x:auto}
.empty{padding:28px 20px;text-align:center;color:var(--text2)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:800;display:inline-grid;place-items:center;line-height:1;letter-spacing:0}
.badge:empty{display:none}

/* ===== Top bar ===== */
#topbar{position:sticky;top:0;z-index:10;height:68px;background:rgba(13,15,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);container-type:inline-size;container-name:top}
.tb-in{height:100%;display:flex;align-items:center;gap:4px;padding:0 18px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:0;margin-right:24px;color:var(--text);text-align:left}
.logo{width:58px;height:40px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(135deg,#123a5c,#1a5d8c);box-shadow:inset 0 0 0 1px rgba(76,188,236,.35)}
.wm{display:grid;line-height:1.05}
.wm b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.wm small{font-size:12px;font-weight:700;color:var(--text2);margin-top:3px}
.navs{display:flex;align-items:center;gap:2px}
.nav{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:8px 12px;border-radius:4px;cursor:pointer;color:var(--text);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;position:relative}
.nav.hi{color:var(--blue)}
.nav:hover{background:rgba(255,255,255,.04);color:var(--blue-h)}
.nav.on{background:var(--blue-bg)}
.nav .badge{position:absolute;top:0;right:0}
.vsep{width:1px;height:26px;background:var(--line2);margin:0 10px}
.topright{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:4px;color:var(--blue);cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.05);color:var(--blue-h)}
.ibtn.on{background:var(--blue-bg)}
.ibtn .badge{position:absolute;top:2px;right:0}
.ptsblk{display:grid;justify-items:center;line-height:1;padding:0 14px;margin:0 6px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.ptsblk b{font-size:19px;font-weight:800;letter-spacing:.02em}
.ptsblk small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-top:4px;font-weight:600}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:4px;color:var(--text);text-align:left}
.who:hover{background:rgba(255,255,255,.05)}
.whot{display:grid;line-height:1.15}
.whot b{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whot small{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.rk-trainee{color:var(--text2)}.rk-bronze{color:#e0a072}.rk-silver{color:#cdd6df}.rk-gold{color:#f2c94c}.rk-platinum{color:#7fe0e8}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f0b54a,#e07b2e);display:inline-grid;place-items:center;font-size:12px;font-weight:800;color:#2a1600;flex:none;letter-spacing:.02em}
.who .chevd{color:var(--text2)}
#memNote{background:rgba(240,163,58,.12);border-bottom:1px solid rgba(240,163,58,.35);color:#f5c37a;font-size:12.5px;padding:6px 20px}
@container top (max-width:1120px){ .navtxt,.wm small{display:none} .nav{padding:10px} .brand{margin-right:10px} }
@container top (max-width:860px){ .wm{display:none} .ptsblk{padding:0 10px;margin:0 2px} .whot{display:none} }
@container top (max-width:620px){ #navDash,#navPast,#navAch,.vsep,.who .chevd{display:none} .tb-in{padding:0 10px;gap:0} .logo{width:44px;height:34px} .ibtn{width:36px} .nav{padding:8px} .ptsblk small{font-size:8.5px} }

/* ===== Popovers / menus ===== */
[popover]{margin:0;inset:auto;border:1px solid var(--line2);border-radius:var(--r);background:#14181d;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.55);max-width:calc(100vw - 16px);color:var(--text)}
.menu button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:none;border:0;padding:8px 10px;border-radius:3px;cursor:pointer;color:var(--text)}
.menu button:hover,.menu button:focus-visible{background:var(--blue-bg)}
.prof{width:290px;padding:14px}
.prof label{display:flex;gap:8px;align-items:center;margin:8px 0}
.prof .pmenu{border-top:1px solid var(--line);margin:10px -14px 0;padding:6px 4px 0}
/* Tools modal: a popover centred over a blurred backdrop */
#toolsPop{position:fixed;inset:0;margin:auto;width:min(512px,calc(100vw - 24px));height:fit-content;max-height:calc(100vh - 40px);overflow:auto;padding:22px 18px 14px;background:#121519;border-color:var(--line2)}
#toolsPop::backdrop{background:rgba(4,6,8,.62);backdrop-filter:blur(5px)}
#toolsPop .x{position:absolute;top:10px;right:10px;width:30px;height:30px;padding:0;justify-content:center;color:var(--text2)}
#toolsPop .grp{padding:4px 0 10px;border-top:1px solid #1e3a4a;margin-top:6px}
#toolsPop .grp:first-of-type{border-top:0;margin-top:0}
#toolsPop .grp>.label{color:var(--blue);padding:10px 2px 6px;letter-spacing:.16em}
#toolsPop .grp button{padding:10px 4px;font-size:15px;gap:14px}
#toolsPop .grp button svg{color:var(--blue)}
#toolsPop .grp button .td{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}

/* ===== Layout ===== */
#app{min-height:calc(100vh - 68px);container-type:inline-size;container-name:app}
.wrap{max-width:1560px;margin:0 auto;padding:26px 40px 60px}
body.chat-open #chat{display:flex}
@media (min-width:1200px){ body.chat-open{padding-right:var(--chatw)} }

/* ===== Dashboard / queue ===== */
.qcard{background:#121519;border:1px solid var(--line)}
.qcard+.sechd{margin-top:28px}
.qhd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 32px;border-bottom:1px solid var(--line)}
.sect{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--blue);letter-spacing:.1em}
.sect .cnt{color:var(--blue);opacity:.85}
.sechd{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px}
.sechd svg{color:var(--blue)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 18px;gap:18px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 32px 15px 22px;cursor:pointer;color:var(--text)}
.qrow:hover,.qrow:focus-visible{background:rgba(30,167,225,.05)}
.qrow:last-child{border-bottom:0}
.qrow .t{font-weight:700;font-size:16px;display:block;letter-spacing:.01em}
.qrow .rq{display:flex;gap:12px;align-items:center;margin-top:5px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-size:13.5px}
.qrow .rq .mono{color:var(--blue);letter-spacing:.02em;font-size:12px}
.qrow .pri,.qrow .chip{margin-top:3px}
.qrow .chev{color:var(--text2);margin-top:2px}
.qempty{padding:20px 32px;color:var(--text2)}
.slim{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:28px}
.mini{border:1px solid var(--line);background:rgba(17,20,24,.7);padding:14px 18px}
.health{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}
.hchip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2)}
.hchip .st{font-size:10.5px}
.act-item{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--text2)}
.act-item:last-child{border-bottom:0}
.act-item .mono{color:var(--muted)}
.svc{display:flex;align-items:center;gap:10px;padding:6px 0}
.svc span:nth-child(2){flex:1}
@container app (max-width:760px){ .slim{grid-template-columns:1fr} }

/* ===== Ticket ===== */
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:10px;background:none;border:0;color:var(--text2);cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.back:hover{color:var(--text)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:34px;height:18px;border-radius:9px;background:#2a323c;position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#cfd6dd;transition:transform .15s}
.switch input:checked+.knob{background:var(--blue)}
.switch input:checked+.knob::after{transform:translateX(16px);background:#fff}
.switch input:focus-visible+.knob{outline:2px solid var(--blue);outline-offset:2px}
.tlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:1080px;margin:0 auto;align-items:start}
.tcard{background:#121519;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(30,167,225,.03),0 20px 60px rgba(0,0,0,.35)}
.tchd{position:relative;padding:26px 28px 22px;border-bottom:1px solid var(--line)}
.tmeta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ref{color:var(--blue);font-size:14px;letter-spacing:.03em}
.ttitle{font-size:27px;line-height:1.25;margin:12px 120px 18px 0;letter-spacing:.06em}
.optbtn{position:absolute;top:58px;right:28px;display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--text2);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:4px}
.optbtn:hover{color:var(--text)}
.optbtn b{font-size:16px;letter-spacing:.05em;color:inherit}
.assignee{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:20px;padding:4px 14px 4px 4px;font-weight:700;font-size:13.5px;background:#0e1115}
.pill .avatar{width:28px;height:28px;font-size:11px}
.pill.none{color:var(--text2);font-weight:500}
.pill.none .avatar{background:#3a434d;color:#c3cbd3}
.assign{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--blue);font-weight:600;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:6px 4px}
.assign:hover{color:var(--blue-h)}
.tcbd{padding:28px}
.desc{border:1px solid var(--line);background:#0e1115;padding:22px 24px;font-size:14.5px;line-height:1.6;color:#dfe5ea}
.desc p{margin:0 0 1.15em}
.desc p:last-child{margin:0}
.idk{text-align:center;margin:30px 0 4px}
.idk .linkbtn{font-size:14.5px;letter-spacing:.1em;text-transform:uppercase}
.hintcard{margin-top:14px}
.twork .card .hd{display:flex;align-items:center;gap:10px}
.twork .sepr{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.objs{list-style:none;padding:0;margin:8px 0}
.objs li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.objs .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid #4a5561;flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:#03141c;font-weight:900}
.objs .ck.y{background:var(--ok);border-color:var(--ok)}
.hints{margin:8px 0 0;padding-left:18px}
.hints li{margin:6px 0}
.log{list-style:none;padding:0;margin:0}
.log li{display:flex;gap:10px;padding:5px 0;font-size:13px}
.log li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.log li.sys::before{background:#4a5561}
.log .tm{color:var(--muted);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.ok{background:rgba(60,207,142,.08);border:1px solid rgba(60,207,142,.35);color:#bff0d8}
.banner.ok b{color:var(--ok)}
@container app (min-width:1240px){
  .tlayout{grid-template-columns:minmax(0,1fr) 360px;max-width:1460px}
}
@container app (max-width:640px){
  .wrap{padding:16px 16px 48px}
  .tchd{padding:20px 18px 18px}
  .tcbd{padding:16px}
  .desc{padding:16px}
  .ttitle{font-size:20px;margin-right:0;margin-top:10px}
  .optbtn{position:static;margin:0 0 12px -4px}
  .qhd{padding:14px 16px}
  .qrow{padding:14px 16px;gap:10px;grid-template-columns:minmax(0,1fr) auto 14px}
  .qrow .chip,.qrow>span:empty{display:none}
  .qrow .t{font-size:14.5px}
  .qrow .rq{font-size:12px;flex-wrap:wrap;gap:4px 10px}
  .qempty{padding:16px}
  h1{font-size:21px}
  td,th{padding:8px 6px}
}

.tlayout.pastgrid{grid-template-columns:minmax(0,380px) minmax(0,1fr);max-width:none}
@container app (max-width:760px){ .tlayout.pastgrid{grid-template-columns:minmax(0,1fr)} }
/* ===== Split view ===== */
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}
.split>.split-tabs{display:none}
.tside .card{background:#121519}
.tside .card>.bd{padding:16px 18px}
.tside .ttitle{font-size:16px;margin:10px 0 8px;line-height:1.3}
.tside .desc{padding:12px 14px;font-size:13.5px;margin:10px 0}
@container app (max-width:1080px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split>.split-tabs{display:flex;gap:4px;margin-bottom:4px;border:1px solid var(--line);background:var(--surface)}
  .split.pane-tool .tside,.split.pane-ticket .tmain{display:none}
}

/* ===== Consoles ===== */

.dir{display:grid;grid-template-columns:250px 160px minmax(0,1fr);min-height:470px}
.dir>div{padding:16px}
.dir>div+div{border-left:1px solid var(--line)}
.ulist{list-style:none;margin:10px 0 0;padding:0}

.vtabs button:hover{color:var(--text)}
.vtabs button.on{background:var(--blue-bg);color:var(--blue);font-weight:700}
.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 14px;margin:12px 0}

.kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:1px solid var(--line);background:#0e1115;padding:14px 16px}
.stat b{display:block;font-size:22px;margin:4px 0 2px}
.topo{width:100%;height:auto;max-width:820px;display:block;margin:0 auto}
.topo .node{cursor:pointer}
.topo .node:focus{outline:none}

.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}

@container app (max-width:860px){
  .dir,.kb{grid-template-columns:1fr}

  .two{grid-template-columns:1fr}
  .two>div+div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px}
  .win{left:8px!important;right:8px!important;top:8px!important}

}

    'Under Available networks select Connect on Northstar-Staff (not Northstar-Guest). Expect “NS-OPS-021 connected to Northstar-Staff.”',
    'Open Terminal, type ping 10.0.0.1 and press Enter. Expect three replies and “Received = 3”.',
    'Optional: run ipconfig to see the 10.0.1.x address and Default Gateway 10.0.0.1.',
    'Select Check fix (3 of 3), write a resolution note and select Close ticket.'],
  verify:['Network & Wi-Fi: Status connected to Northstar-Staff · On the office network.',
    'Terminal: ping 10.0.0.1 gets 3 replies (0% loss).',
    'Check fix: broken profile removed, connected to Northstar-Staff, internal connectivity tested.'],
  commonMistakes:['Rebooting or powering off the Edge Router for one person’s Wi-Fi: every floor drops, and it costs 4 points.',
    'Selecting Connect on the broken profile again: authentication fails every time.',
    'Connecting to Northstar-Guest: it has internet only, so Jordan loses his shared drives.',
    'Skipping the ping: “connected” only proves the radio link, not a working route.'],
  realWorldNote:'Corrupt or outdated saved Wi-Fi profiles are common after a network changes its security settings or certificate. Forgetting the network from the taskbar doesn’t always remove a profile that was pushed by policy, so desks remove it remotely (for example with netsh wlan delete profile). If several laptops of the same model start dropping at once, suspect a Wi-Fi driver update instead.',
  idealNotes:'Cause: NS-OPS-021 (jprice) had a corrupt saved Northstar-Staff profile failing authentication; nearby users and the network were healthy. Action: removed the broken profile in Remote Desktop › Network & Wi-Fi and reconnected to Northstar-Staff. Verified: ping 10.0.0.1 from the laptop got 3 of 3 replies.'}},

{ref:'INC-1047', pri:'high', cat:'Email / Delivery', req:'pshah', asset:'priya.shah@northstar.example', assetType:'Mailbox', created:'08:39',
 title:'Supplier email is missing from the inbox',
 desc:'A supplier sent today’s onboarding spreadsheet, but it never arrived. They say they got no bounce. I checked Junk and it isn’t there.',
 impact:'HR onboarding for Monday’s starters is delayed.',
 tried:'Checked Junk and asked the supplier to resend once.',
 hints:['No bounce and not in Junk: find out where the message stopped.','Run Mail Admin › Message trace for Priya’s address. “Quarantined” means the filter is holding it.','Release the matching legitimate message in Mail Security, then re-run the trace to confirm delivery.'],
 model:'Traced the message, confirmed the filtering service quarantined it, released the verified legitimate item and confirmed delivery in Message trace.',
 keys:['pshah','priya','quarantine','brightpath'],
 penalties:{'release:q2':[6,'Released a phishing message into a user’s inbox']},
 obj:[O(s=>msg(s,'m1').status==='Delivered', 'Supplier message released', 'The supplier message is still quarantined'),
      O(s=>msg(s,'m1').verified, 'Delivery confirmed in Message trace', 'Delivery hasn’t been confirmed in Message trace')],
 guide:{
  symptomsToNotice:['No bounce for the supplier and nothing in Junk: the message was accepted, then held somewhere before the inbox.',
    'Mail Admin › Message trace for “priya.shah”: “Onboarding pack – October starters (spreadsheet)” from BrightPath Staffing at 09:02, status Quarantined, “Held by the content filter: strict attachment policy”.',
    'The same trace shows a second Quarantined message to Priya, “Action required: verify your payroll account” from secure-docs@paylink-verify.example, held as phishing.',
    'Mail Security › Quarantine: the BrightPath item’s reason is Strict attachment policy (score 5.1); the payroll message is Phishing: credential-harvest link (score 9.6).'],
  diagnosis:'A missing message with no bounce is a tracing job, not a mailbox job. Message trace shows exactly where it stopped: the content filter quarantined it under a strict attachment policy. The sender is a known staffing supplier, the subject is what Priya expects and the score is low, so it’s a false positive and safe to release. The other message held for Priya is real phishing and must stay blocked. Release only the one you checked, then trace again to prove it was delivered.',
  perfectSteps:['Open INC-1047 and select Assign to me.',
    'Open Tools › Mail Admin. On Message trace, type “priya.shah” in “Sender, recipient or display name” and select Search.',
    'Find the BrightPath Staffing row (09:02, “Onboarding pack – October starters (spreadsheet)”): Quarantined, held by the strict attachment policy.',
    'Open Tools › Mail Security › Quarantine. Check sender, recipient, subject and reason on each row.',
    'On the BrightPath row (Strict attachment policy, score 5.1) select Release. Expect “Released … Delivered to priya.shah@northstar.example.”',
    'Leave the paylink-verify.example row held, or select Report to Security on it. Never select Release on a phishing item.',
    'Back in Mail Admin › Message trace, select Search again. The BrightPath row now reads Delivered, “Released from quarantine and delivered to inbox”.',
    'Select Check fix (2 of 2), write a resolution note and select Close ticket.'],
  verify:['Message trace for priya.shah: the BrightPath message shows Delivered.',
    'Mail Security › Quarantine: BrightPath shows Released · Delivered; the payroll phishing message is still held, or Blocked · Reported.',
    'Check fix: supplier message released and delivery confirmed in Message trace.'],
  commonMistakes:['Releasing the “verify your payroll account” message: it’s credential phishing, the release dialog warns you, and it costs 6 points.',
    'Releasing without running the trace again: Check fix wants delivery confirmed in Message trace.',
    'Asking the supplier to resend again: the new copy would be held by the same policy.',
    'Releasing every quarantined item for the user “to be safe”.'],
  realWorldNote:'Quarantine false positives are normal: strict attachment policies catch spreadsheets with macros or unusual file types from senders the filter hasn’t seen before. Real desks check the sender domain, the headers and whether the user expects the message before releasing, and ask Security to tune the policy or allow-list a supplier if it keeps happening. Phishing is never released, even when the user insists.',
  idealNotes:'Cause: BrightPath Staffing onboarding spreadsheet (09:02) to pshah was quarantined by the strict attachment policy (score 5.1), a false positive. Action: checked sender and subject, released only that message in Mail Security; the payroll phishing message stays blocked. Verified: Message trace shows the BrightPath message Delivered.'}},

{ref:'INC-1048', pri:'medium', cat:'Email / Mailbox', req:'awilson', asset:'avery.wilson@northstar.example', assetType:'Mailbox', created:'09:02',
 title:'Mailbox is full and new mail bounces',
 desc:'People get a bounce when they email me, with a “mailbox full” message. I can still sign in to webmail and read old messages.',
 impact:'The Executive Office can’t receive new messages.',
 tried:'Signed out of webmail and tried again.',
 hints:['Sign-in still works, so this is mailbox delivery, not identity.','Open Avery’s mailbox in Mail Admin › Mailboxes and look at storage.','Enable the online archive (or raise the quota to the approved 10 GB), then send a test message.'],
 model:'Checked mailbox properties, found quota enforcement blocking delivery, enabled the approved archive remedy and confirmed delivery with a test message.',
 keys:['awilson','avery','quota','archive'],
 obj:[O(s=>canReceive(s.mail.mailboxes.awilson), 'Mailbox has room to receive mail', 'Avery’s mailbox is still full'),
      O(s=>s.mail.mailboxes.awilson.testOk, 'Test message delivered', 'No test message has been delivered yet')],
 guide:{
  symptomsToNotice:['Senders get a “mailbox full” bounce but Avery can sign in and read old mail: identity is fine, delivery isn’t.',
    'Mail Admin › Message trace for “avery.wilson”: “Board pack draft v3” and “Itinerary update – Thursday” Failed with 550 5.2.2 Recipient mailbox full.',
    'Mail Admin › Mailboxes › avery.wilson@northstar.example: Storage 4.95 GB of 5 GB (99%), Delivery “Blocked: quota exceeded”, Online archive Not enabled, Retention policy Executive (7 years).',
    'Server Room › Servers › MAIL01 › Event log: warning 4010, “Delivery to avery.wilson@northstar.example failed: mailbox full.”'],
  diagnosis:'The mailbox has reached its 5 GB quota, so the mail server rejects new messages. There are two approved remedies: enable the online archive (older items move out and the mailbox drops to about 2.2 GB), or raise the quota to the 10 GB approved for executives. The archive is the better first choice because it keeps the 7-year retention policy and leaves room to grow. Deleting an executive’s mail is never the fix. Finish with a test message, because a storage number alone doesn’t prove delivery.',
  perfectSteps:['Open INC-1048 and select Assign to me.',
    'Open Tools › Mail Admin › Message trace, type “avery.wilson” and select Search. Note the two Failed messages with 550 5.2.2 Recipient mailbox full.',
    'Open the Mailboxes tab. It opens on avery.wilson@northstar.example (otherwise choose it in the Mailbox list). Read Storage 4.95 GB of 5 GB and Delivery Blocked: quota exceeded.',
    'Select Enable online archive. Expect “Online archive enabled. Older items moved, mailbox now at 2.23 GB of 5 GB.”',
    'Alternative: choose “10 GB (approved for executives)” in the Quota list and select Apply quota.',
    'Leave “Send test to” on avery.wilson@northstar.example and select Send test message. Expect “Test message to avery.wilson@northstar.example delivered to Avery Wilson’s mailbox.”',
    'Select Check fix (2 of 2), write a resolution note and select Close ticket.'],
  verify:['Mailboxes › avery.wilson@northstar.example: Delivery Receiving, Online archive Enabled, “Last test delivered”.',
    'Check fix: the mailbox has room to receive mail and a test message was delivered.'],
  commonMistakes:['Resetting Avery’s password or checking MFA: sign-in works, so it’s a storage problem.',
    'Choosing the 50 GB quota: that size is for shared mailboxes, not an approved executive remedy.',
    'Fixing storage but never sending a test message, so delivery isn’t proven.',
    'Asking the Chief of Staff to delete mail that sits under a 7-year retention policy.'],
  realWorldNote:'Mailbox-full bounces (550 5.2.2) are common for executives who keep everything. An online archive moves older mail to a separate archive mailbox that is still searchable from the mail client, which suits retention policies far better than deleting. The server doesn’t retry a hard 5.x.x failure, so tell the user that anyone whose message bounced has to send it again.',
  idealNotes:'Cause: awilson mailbox at 4.95 of 5 GB, so new mail bounced with 550 5.2.2 (board pack, itinerary). Action: enabled the online archive (approved remedy, 7-year retention kept); mailbox now at 2.23 GB. Verified: test message delivered. Asked Avery to have the board office resend the board pack.'}},

{ref:'INC-1049', pri:'critical', cat:'Security / Mailbox', req:'lmartinez', asset:'leo.martinez@northstar.example', assetType:'Mailbox', created:'08:58', security:true,
 title:'Unknown forwarding address in my mailbox',
 desc:'A coworker says some replies to my password-reset emails are disappearing. I found a forwarding address I don’t recognize in my mailbox settings.',
 impact:'Possible account compromise and data exfiltration.',
 tried:'I did not create any new rules.',
 hints:['A rule that forwards everything outside the company is a security concern.','Inspect Leo’s inbox rules in Mail Admin. Preserve the evidence: this is not housekeeping.','Escalate the ticket to Security with the rule details in your notes.'],
 model:'Inspected the inbox rule, documented the external forwarding evidence, avoided destroying it and escalated to Security for containment.',
 keys:['lmartinez','leo','external-archive','outside.example','forward'],
 penalties:{'deleteRule:r1':[4,'Deleted the suspicious rule and destroyed evidence']},
 obj:[O(s=>rule(s,'r1').inspected, 'Forwarding rule inspected', 'The suspicious rule hasn’t been inspected'),
      O(s=>!rule(s,'r1').deleted, 'Rule preserved as evidence', 'The rule was deleted, so evidence is lost'),
      O(s=>s.tickets['INC-1049'].status==='escalated', 'Routed to Security', 'Not yet routed to Security')],
 guide:{
  symptomsToNotice:['Replies to Leo’s password-reset emails are disappearing, and he found a forwarding address he didn’t create.',
    'Mail Admin › Inbox rules (mailbox leo.martinez@northstar.example): a rule named “.” on All incoming messages, tagged “Forwards outside org”.',
    'View details: Action “Forward a copy to external-archive@outside.example, mark as read”; Created “Oct 9, 02:14 from an unrecognized web session”.',
    'Message trace for “leo.martinez”: the 09:10 “Rota for next week” was “Delivered to inbox (copy forwarded by rule to external-archive@outside.example)”.',
    'Directory › Leo Martinez › Mailbox warns “1 inbox rule forwards mail outside the organization”.'],
  diagnosis:'A rule with a near-invisible name (a single dot), created at 02:14 from an unknown web session, that silently forwards everything outside the company and marks it as read is a textbook sign of a compromised mailbox. Attackers use rules like this to keep reading mail, including password resets, even after the password changes. This isn’t housekeeping: the rule, its creation time and the session behind it are evidence Security needs to scope the breach. Inspect it, write it down, change nothing, and escalate. Security takes ownership and contains the account.',
  perfectSteps:['Open INC-1049 (Critical) and select Assign to me.',
    'Open Tools › Mail Admin › Inbox rules. The Mailbox list opens on leo.martinez@northstar.example.',
    'On the rule named “.” (Forwards outside org) select View details. Note Applies to: All incoming messages; Action: forward a copy to external-archive@outside.example and mark as read; Created: Oct 9, 02:14 from an unrecognized web session.',
    'Don’t select Delete. If you open the delete dialog by mistake, select Cancel.',
    'Optional evidence: Message trace for “leo.martinez” shows the 09:10 message copied to external-archive@outside.example.',
    'Optional: add a work note on the ticket with the rule details, so the evidence is on record.',
    'Select Escalate to Security (Resolution card, or Options ···). Under “Evidence for Security” write the rule name, target address, creation time and source, and that nothing was deleted (at least 15 characters).',
    'Select Escalate. The ticket moves to Past tickets as Routed to Security.'],
  verify:['Before escalating, Check fix shows 2 of 3: rule inspected and rule preserved. The third, Routed to Security, completes when you escalate.',
    'The escalation dialog’s preview includes “Correct security escalation +12”.',
    'Past tickets: outcome Routed to Security. Inbox rules still lists the rule, now marked as disabled by Security with evidence preserved.'],
  commonMistakes:['Deleting the rule: it destroys evidence and costs 4 points (the dialog warns you first).',
    'Closing instead of escalating: “Not yet routed to Security” stays unmet and it scores as closed unresolved (−20).',
    'Treating it as routine and only resetting Leo’s password: the forwarding rule keeps working after a reset.',
    'Escalating with a vague note. Security needs the rule, the address and the timestamps.'],
  realWorldNote:'Malicious forwarding rules are one of the most common steps attackers take after compromising a mailbox (business email compromise). They name rules “.” or similar to hide them and forward to free external mailboxes. A real Security team revokes sessions, resets the password and MFA, exports the rule and sign-in logs, looks for other affected mailboxes and checks what was sent out. The desk’s job is to spot it, preserve it and hand over quickly.',
  idealNotes:'Evidence: lmartinez inbox rule “.” forwards all incoming mail to external-archive@outside.example and marks it read; created Oct 9 02:14 from an unrecognized web session. Message trace confirms copies were forwarded (09:10 rota). Rule inspected and preserved, nothing deleted. Escalated to Security to contain the suspected compromise.'}},

{ref:'INC-1050', pri:'high', cat:'Server / Printing', reqName:'Multiple users', reqDept:'Office-wide · All departments', reqLoc:'All floors', reqExt:'4000', reqEmail:'office-managers@northstar.example', asset:'PRINT01', assetType:'Print server', created:'08:25',
 title:'Shared printers are stuck on “Printing”',
 desc:'Everyone in the office gets “Printing” forever, and nothing is coming out of the shared printers. The printers themselves are powered on.',
 impact:'Company-wide printing is unavailable. All printer models are affected.',
 tried:'Power-cycled one printer. It didn’t help.',
 hints:['Every printer at once means a shared dependency.','Inspect the print server in Server Room › Servers.','Restart the Print Spooler on PRINT01, then send a test page.'],
 model:'Identified the shared print server rather than a single printer, restarted the stopped spooler service and confirmed a test page printed.',
 keys:['print01','spooler'],
 obj:[O(s=>svcUp(s,'PRINT01','Print Spooler'), 'Print Spooler running on PRINT01', 'Print Spooler on PRINT01 is still stopped'),
      O(s=>s.net.servers.PRINT01.testPageOk, 'Test page printed', 'No test page has printed')],
 guide:{
  symptomsToNotice:['Every printer in the office is stuck on “Printing”, across all models: one shared component, not a printer fault.',
    'Power-cycling a printer didn’t help, as Tomasz’s 08:22 voicemail also says.',
    'Dashboard › Service health: Printing Degraded.',
    'Server Room › Servers: PRINT01 (Print Server, 10.0.0.30) is Degraded. Its Services show Print Spooler stopped and Print Web Portal running.',
    'PRINT01 › Event log & scheduled tasks: error 7031 at 08:19, “The Print Spooler service terminated unexpectedly. 0 recovery actions configured.”'],
  diagnosis:'Every print job goes through the Print Spooler service on PRINT01, which crashed at 08:19 and had no automatic restart configured. With the spooler down, jobs pile up in the queues and every printer looks busy. Restarting printers doesn’t help because nothing is being sent to them. Start the one stopped service instead of rebooting the whole server, then send a test page to prove jobs are flowing again.',
  perfectSteps:['Open INC-1050 and select Assign to me. Optional: Voicemails › Tomasz Nowak (08:22) › Mark as listened, then Save to INC-1050.',
    'Open Tools › Server Room › Servers. PRINT01 shows Degraded.',
    'Select Services on the PRINT01 row: Print Spooler is stopped.',
    'Optional: select “Event log & scheduled tasks” and read event 7031 at 08:19, then go back to the Servers tab (PRINT01’s services stay open).',
    'Select Start next to Print Spooler. Expect “Print Spooler restarted on PRINT01 and is Running.”',
    'Select Send test page on the PRINT01 row. Expect “Test page printed on PRN-F1-01.”',
    'Select Check fix (2 of 2), write a resolution note and select Close ticket.'],
  verify:['Server Room › Servers: PRINT01 Healthy, Print Spooler running.',
    'Send test page reports “Test page printed on PRN-F1-01.”',
    'Dashboard › Service health: Printing Healthy.'],
  commonMistakes:['Rebooting printers one by one in Topology: the flash says jobs are still waiting in the PRINT01 queue.',
    'Sending the test page before starting the spooler: it sticks in the queue and doesn’t count.',
    'Rebooting the whole PRINT01 server when one service needs starting. It works, but it also drops the Print Web Portal and takes longer.',
    'Closing without a test page.'],
  realWorldNote:'A crashed print spooler is a classic Windows print-server failure, often caused by a faulty printer driver or a corrupt job. Restarting the service fixes it for now. The follow-up is to set the service to restart automatically after a failure, and to find the job or driver that crashed it (event 7031 and the spooler logs) so it doesn’t happen again tomorrow.',
  idealNotes:'Cause: Print Spooler on PRINT01 crashed at 08:19 (event 7031, no recovery actions), so every queue stalled office-wide. Action: started the Print Spooler service on PRINT01 (no server reboot, no printer reboots). Verified: test page printed on PRN-F1-01. Follow-up: set spooler recovery to restart automatically.'}},

{ref:'INC-1051', pri:'high', cat:'Network / VPN', req:'ebrooks', asset:'NS-SALES-008', assetType:'Windows laptop', created:'11:20', after:'INC-1043',
 title:'VPN profile invalid when working from home',
 desc:'I’m at home and the VPN says my connection profile is invalid. The internet works and I can browse normal websites, but I can’t reach the company drive.',
 impact:'A remote worker can’t reach internal resources.',
 tried:'Restarted the laptop and checked the home router.',
 hints:['Public internet works, so the fault is in the tunnel or client profile.','Remote into NS-SALES-008 and open the VPN Client.','Select the current Northstar-Staff profile, connect, and verify by opening the S: drive or pinging FILE01.'],
 model:'Confirmed ordinary internet worked, replaced the obsolete VPN profile with the current one, connected and verified internal access.',
 keys:['ebrooks','evan','vpn','northstar-staff','ns-sales-008'],
 obj:[O(s=>s.workstations['NS-SALES-008'].vpn.profile==='Northstar-Staff', 'Current VPN profile selected', 'The VPN client still uses the retired profile'),
      O(s=>s.workstations['NS-SALES-008'].vpn.connected, 'VPN connected', 'The VPN isn’t connected'),
      O(s=>s.workstations['NS-SALES-008'].netOk, 'Internal access verified', 'Internal access hasn’t been verified')],
 guide:{
  symptomsToNotice:['Evan is at home and normal websites work, so his home internet and Wi-Fi are fine.',
    'The VPN says the connection profile is invalid, and the company drive can’t be reached: the tunnel isn’t coming up.',
    'Remote Desktop › NS-SALES-008: the session bar reads “Off-site — VPN not connected”.',
    'VPN Client: Connection profile Northstar-Legacy, Status Disconnected. Connect fails with “profile invalid. Gateway vpn-legacy.northstar.example has been retired.”',
    'File Explorer › Open on S: (\\\\FILE01\\Sales): “The network path … wasn’t found. Connect the VPN first.”'],
  diagnosis:'Internet works and only internal resources fail, so the problem is the tunnel into the company, not his router. The VPN client still uses the Northstar-Legacy profile, which points at a retired gateway, so it can never connect. Switch to the current Northstar-Staff profile, connect, and prove internal access by opening his Sales drive or pinging FILE01. INC-1051 only arrives once INC-1043 is closed, because Evan needs a working account first.',
  perfectSteps:['INC-1051 arrives after you close INC-1043. Open it and select Assign to me.',
    'Open Tools › Remote Desktop, search “NS-SALES-008”, select Connect, then Connect in the dialog. The session bar reads Off-site — VPN not connected.',
    'Open VPN Client. Connection profile shows Northstar-Legacy.',
    'Optional: select Connect to see the failure, “Connection failed: profile invalid. Gateway vpn-legacy.northstar.example has been retired.”',
    'Choose Northstar-Staff in the Connection profile list. The flash reads “VPN profile set to Northstar-Staff.”',
    'Select Connect. Expect “VPN connected with Northstar-Staff. Internal address 10.8.0.14.”',
    'Open File Explorer and select Open on S: (\\\\FILE01\\Sales). Expect “Opened \\\\FILE01\\Sales.” Alternatively open Terminal and run ping file01.',
    'Select Check fix (3 of 3), write a resolution note and select Close ticket.'],
  verify:['VPN Client: Status Connected; the session bar reads Connected over VPN.',
    'File Explorer opens \\\\FILE01\\Sales and lists Pipeline_Q4.xlsx, Pricing_2026.pdf and Client_Notes.',
    'Check fix: current profile selected, VPN connected, internal access verified.'],
  commonMistakes:['Troubleshooting Evan’s home router or Wi-Fi when ordinary websites work.',
    'Connecting the Legacy profile again and again: its gateway has been retired.',
    'Stopping at “Connected” without opening a drive or pinging an internal server.',
    'Leaving INC-1043 unresolved: a locked or expired account can’t open the share even with the VPN up.'],
  realWorldNote:'When a VPN gateway is retired, clients that still hold the old profile fail with “profile invalid”. Well-run desks push the new profile through device management before switching the old gateway off, and chase the laptops that haven’t checked in, because remote machines miss updates. Always verify with an internal resource: many VPN clients show “connected” before routes and DNS are actually working.',
  idealNotes:'Cause: NS-SALES-008 (ebrooks, working from home) still used the Northstar-Legacy VPN profile, whose gateway was retired; home internet was fine. Action: switched the VPN client to Northstar-Staff and connected (10.8.0.14). Verified: \\\\FILE01\\Sales opens over the VPN from his laptop.'}},

 guide:{

    'The monitor works on the same socket, so the wall power is fine.',

    'Asset Management › Details: warranty 2026-03-31, marked Expired, so there’s no vendor repair route.',
    'Details › User data: folders are redirected to \\\\FILE01\\Operations\\Profiles\\tnowak, so nothing is lost with the unit.',
    'PC Shelf: NSA-S201 is a Desk 24 that is Not wiped (returned by a leaver). NSA-S202 is a Desk 24 that is Wiped, with certificate WC-5521. Only NSA-S202 is clean.'],
  diagnosis:'Scope first: one machine and one user, so it isn’t the network or a server. A desktop with no power at all, right after a building power event, points to a failed power supply or motherboard. The evidence that matters is the asset record: no heartbeat, out of warranty, data stored on the server. For a critical desk with a deadline, swap the machine rather than repair it. Pick a spare that is available, wiped and not reserved (NSA-S202). Then close the loop on the old asset so the inventory is correct and the disk goes through certified disposal.',
  perfectSteps:['Open INC-1052 and select Assign to me.',
    'Open Tools › Asset Management, search “NS-OPS-030” and select Open. On the Health tab note “Off / unreachable” and the last event at 22:47.',
    'On the Details tab note Warranty 2026-03-31 (Expired) and User data “Folders redirected to \\\\FILE01\\Operations\\Profiles\\tnowak”.',
    'Optional evidence: Tools › Remote Desktop shows NS-OPS-030 Offline (“Powered off / not reachable”) and the Connect button is disabled.',
    'Open Tools › PC Shelf › Devices. Compare NSA-S201 (Not wiped, returned by a leaver) with NSA-S202 (Wiped Oct 3). Choose NSA-S202.',
    'Open Tools › Computer Deployment. Set Device: NSA-S202, Build profile / image: Standard Office · Northstar Standard 24.2, Assign to: Tomasz Nowak (tnowak), Location: Floor 1. Select Run deployment and check all five stages pass.',
    'Back in Asset Management, find NS-OPS-030 in the list and set its State dropdown to “Retired, awaiting disposal”. The owner clears automatically.',
    'Open Company Chat › Tomasz Nowak and select the quick action “INC-1052 · Ask to confirm the fix”. Tomasz confirms the dispatch board works.',
    'Select Check fix (all requirements green), write a resolution note and select Close ticket.'],
  verify:['Asset Management: the new NS-OPS-1xx host (tag NSA-S202) shows owner Tomasz Nowak, state In use, location Floor 1.',
    'Asset Management: NS-OPS-030 shows Retired, awaiting disposal, with no owner.',
    'PC Shelf: NSA-S201 is still Available and Not wiped. It wasn’t deployed.',
    'Company Chat: Tomasz confirms the dispatch board is running.'],
  commonMistakes:['Grabbing the first desktop on the shelf (NSA-S201) without reading its wipe status.',
    'Marking the dead PC Disposed straight away, which skips certified disk destruction.',
    'Setting it to In repair for an out-of-warranty unit and leaving the desk down.',
    'Taking a laptop that is reserved for a new starter.',
    'Closing without the user’s confirmation.'],
  realWorldNote:'Most service desks keep a small pool of “hot spares” for critical desks, because swapping is faster than diagnosing a dead power supply while the business waits. The swap is only safe if user data lives on the server, and only clean if every spare has a wipe certificate. Retired disks go to a certified disposal vendor; you never just bin them.',
  idealNotes:'Cause: NS-OPS-030 has no power after building power test FAC-7781. No heartbeat since 22:47, out of warranty (2026-03-31), user folders redirected to FILE01. Action: deployed clean spare NSA-S202 (Northstar Standard 24.2, wipe cert WC-5521) to tnowak on Floor 1. Set NS-OPS-030 to Retired, awaiting disposal. Didn’t use NSA-S201 (not wiped). Verified: Tomasz confirmed in chat that the dispatch board is working.'}},

{ref:'INC-1053', shift:2, pri:'medium', cat:'Hardware / New starter', req:'mchen', asset:'NSA-S120', assetType:'Northbook 14 laptop (reserved spare)', created:'09:05',
 arrive:s=>{ addPerson(s, user('nrahman','Nadia Rahman','Finance','Finance Analyst',2,'4434',null,[],{manager:'Maya Chen', lastSignIn:'Never', mustChange:true, presence:'offline', startDate:'Mon Oct 19',
     roleTemplate:'Finance Analyst: image Northstar Finance 24.2, groups Finance-Share'}), null, mbx(0,'Finance (7 years)'));
   addShelf(s,{tag:'NSA-S120', model:'Northbook 14 laptop', serial:'NB14-56120', cond:'New · boxed', bay:'Shelf A1', status:'Reserved', reservedFor:'nrahman', note:'New starter Nadia Rahman (HR-2290)', image:'Northstar Standard 24.2'}); },
 title:'New Finance starter on Monday: laptop build and handover',
 desc:'We’ve got Nadia Rahman starting in Finance on Monday as an analyst. Can you get her laptop ready so she can sit down and start on month-end straight away? She’ll need the same setup as the rest of the team, including the payroll software.',
 impact:'A new starter can’t work on day one, and month-end close is one analyst short.',
 tried:'HR says they’ve created her account.',
 hints:['Don’t guess the build. Directory › Nadia’s Profile shows her role template, and PC Shelf shows a laptop reserved for her.',
   'The reserved laptop only has the Standard image. Finance staff need Northstar Finance 24.2 (Ledgerline and Payroll Desktop), and the role template lists exactly one group.',
   'Deploy NSA-S120 with Northstar Finance 24.2 to Nadia on Floor 2, add Finance-Share in Directory, then agree an in-person handover with Maya in Company Chat. Never send Maya the password.'],
 model:'Built reserved laptop NSA-S120 with Northstar Finance 24.2 (includes Ledgerline and Payroll Desktop) and assigned it to nrahman on Floor 2. Added Finance-Share as her role template requires, and nothing more. Agreed with Maya that Nadia gets her temporary password in person after an ID check on Monday, so no credentials went over chat.',
 keys:['nrahman','nadia','nsa-s120','finance-share','role template'],
 penalties:{'addGroup:nrahman':[3,'Gave a new starter access beyond her role template (least privilege)', (s,a)=>a[1]!=='Finance-Share'],
   'chat:mc-pwd':[4,'Sent a credential to a third party over chat. Temporary passwords go to the starter in person after an ID check']},
 chatActions:[
   {id:'mc-handover', user:'mchen', label:'INC-1053 · Agree an in-person handover (ID check, then password)', ask:'Nadia’s laptop is ready. On Monday at 09:00 we’ll check her ID at the service desk and give her the temporary password in person, and she changes it when she first signs in. Does that work?',
    reply:s=>nadiaLaptopOk(s) ? 'Perfect, I’ll bring her down at 09:00. Thanks for not sending the password around.' : 'Before we plan Monday: I looked at her laptop and the payroll software isn’t on it, and it doesn’t show as hers yet. She can’t do month-end like that.',
    set:s=>{ if (nadiaLaptopOk(s)) s.chat.facts.nrahmanHandover=true; }},
   {id:'mc-pwd', user:'mchen', label:'INC-1053 · Send Nadia’s temporary password to Maya', ask:'Here’s Nadia’s temporary password so you can give it to her on Monday.', reply:'Oh, OK. I’ll write it on a sticky note for her.', set:s=>{ s.chat.facts.nrahmanPwdShared=true; }}],
 obj:[O(nadiaLaptopOk, 'Reserved laptop NSA-S120 built with Northstar Finance 24.2 for Nadia', 'Nadia’s reserved laptop isn’t built with the Finance image and assigned to her'),
   O(s=>s.users.nrahman.groups.includes('Finance-Share'), 'Nadia is in Finance-Share', 'Nadia’s account is missing the Finance-Share group from her role template'),
   O(s=>s.users.nrahman.groups.every(g=>['Domain Users','Finance-Share'].includes(g)), 'Nadia has no access beyond her role template', 'Nadia has groups her role template doesn’t list'),
   O(s=>s.chat.facts.nrahmanHandover && !s.chat.facts.nrahmanPwdShared, 'Handover agreed with Maya: ID check and password in person', 'The day-one handover hasn’t been agreed safely with Maya')],
 guide:{
  symptomsToNotice:['The ticket says “same setup as the team, including the payroll software”, so a generic build won’t do.',
    'Directory › Nadia Rahman › Profile: Role template “Finance Analyst: image Northstar Finance 24.2, groups Finance-Share”, start date Mon Oct 19.',
    'Directory › Groups: only Domain Users, even though HR “created her account”.',
    'PC Shelf: NSA-S120 is Reserved for Nadia Rahman (HR-2290) but carries the Northstar Standard 24.2 image.',
    'Computer Deployment › Image catalogue: only Northstar Finance 24.2 includes Ledgerline Accounts and Payroll Desktop.'],
  diagnosis:'A new-starter ticket is really a checklist against a source of truth: here, the role template in Directory. Compare what exists (an account with Domain Users only, a laptop with the Standard image) against what the template says (Finance image, Finance-Share). The gaps are the work. Two traps: giving extra access to save a future ticket, and handing credentials to someone other than the starter.',
  perfectSteps:['Open INC-1053 and select Assign to me.',
    'Open Tools › Directory, search “nadia”, select Nadia Rahman. On Profile read the Role template line. On Groups note only Domain Users.',
    'Open Tools › PC Shelf › Devices: confirm NSA-S120 is Reserved for Nadia Rahman and shows Northstar Standard 24.2.',
    'Open Tools › Computer Deployment. Set Device: NSA-S120, Build profile / image: Finance · Northstar Finance 24.2, Assign to: Nadia Rahman (nrahman), Location: Floor 2. Select Run deployment. There is no reservation warning because the assignee matches.',
    'Back in Directory › Nadia Rahman › Groups, choose Finance-Share in “Add to group” and select Add. Add nothing else.',
    'Optional: Tools › Asset Management shows the new NS-FIN-1xx host (tag NSA-S120) owned by Nadia Rahman with image Northstar Finance 24.2.',
    'Open Company Chat › Maya Chen and select “INC-1053 · Agree an in-person handover (ID check, then password)”. Maya agrees to bring Nadia down at 09:00.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Asset Management: the NSA-S120 host is owned by Nadia Rahman, In use, image Northstar Finance 24.2.',
    'Directory › Nadia Rahman › Groups lists exactly Domain Users and Finance-Share.',
    'Company Chat: Maya agrees to the in-person handover. No password appears in the thread.'],
  commonMistakes:['Deploying the reserved laptop with the Standard image it already has.',
    'Taking a different spare and breaking the reservation.',
    'Adding extra share groups “just in case”.',
    'Sending the temporary password to the manager to pass on.'],
  realWorldNote:'Joiner builds are driven by role templates (“birthright” access) so every analyst gets the same thing and audits stay simple. Day-one credentials are a classic leak: good desks hand them over in person, or through a self-service activation link, after an ID check. They don’t go to the manager.',
  idealNotes:'New starter nrahman (Finance Analyst, starts Oct 19). Role template: Northstar Finance 24.2 + Finance-Share. Deployed reserved NSA-S120 (HR-2290) with Northstar Finance 24.2 (Ledgerline + Payroll Desktop) to nrahman on Floor 2. Added Finance-Share only. Handover agreed with Maya Chen: ID check and temporary password in person Monday 09:00 (must change at first sign-in). No credentials sent over chat. Verified: Asset Management shows the NSA-S120 host In use for nrahman with Northstar Finance 24.2.'}},

{ref:'INC-1054', shift:2, pri:'high', cat:'Hardware / Remote replacement', req:'ckeller', asset:'NS-SALES-019', assetType:'Northbook 14 laptop', created:'08:52',
 intake:{via:'voicemail', from:'ckeller', callerId:'Mobile +1 555-0122 (on record)', dur:'0:52',
   text:'Hi, it’s Clara in Sales, extension 3122. I knocked my laptop off the kitchen counter and the screen’s shattered. I can see a bit in one corner but that’s it. I’m working from home all week with customer calls booked, so can you send me something? Oh, I moved at the start of the month, but HR should have my new address.'},
 arrive:s=>{ const w=ws('NS-SALES-019','ckeller',1,'NSA-1019','NB14-56103',{remote:true, site:'Remote (home)', image:'Northstar Sales 24.2', adp:true,
     wifi:{profiles:[{ssid:'Keller-Home', broken:false}], connected:'Keller-Home'}, stateNote:{'Retired, awaiting disposal':'This laptop has accidental-damage cover until 2027-06-30: it should go for repair.', 'Disposed':'This laptop has accidental-damage cover until 2027-06-30: it should go for repair.'}});
   w.devices.push({id:'panel', name:'Northbook 14 internal display panel', cat:'Monitors', status:'Error', code:43, broken:43, note:'Panel not responding'});
   addPerson(s, user('ckeller','Clara Keller','Sales','Regional Account Manager',1,'3122','NS-SALES-019',['Sales-Share'],{presence:'away', device:'Mobile', manager:'Grace Adeyemi',
     address:'Flat 3, 22 Lantern Row, Marlow Heath, MH2 9QD', addressUpdated:'Oct 1 (HR)', addressSaved:'7 Quarry Bend, Elmsworth, EL4 2RT'}), w, mbx(2.2));
   addShelf(s,{tag:'NSA-S121', model:'Northbook 14 laptop', serial:'NB14-56121', cond:'New · boxed', bay:'Shelf A1'}); },
 title:'Remote worker dropped laptop, screen shattered',
 desc:'I knocked my laptop off the kitchen counter and the screen’s shattered. I can see a bit in one corner but that’s it. I’m working from home all week with customer calls booked, so can you send me something? I moved at the start of the month, but HR should have my new address.',
 impact:'A remote account manager can’t work or join customer calls for the rest of the week.',
 tried:'Restarted it. The screen is still cracked and mostly black.',
 hints:['Is this software or hardware? Remote Desktop still connects to NS-SALES-019. What does Device Manager say about the internal display?',
   'The panel is physically broken, and Asset Management shows accidental-damage cover. She needs a replacement now and a repair return. She also said she moved, so compare the addresses before you ship.',
   'Deploy a spare laptop with Northstar Sales 24.2 to Clara (Remote (home)), ship it with the Directory (HR record) address, create a return label for NS-SALES-019, mark the shipment delivered, then confirm with Clara in Company Chat.'],
 model:'Remote session showed Code 43 on the internal panel, so it’s physical damage. NS-SALES-019 has accidental-damage cover until 2027-06-30. Deployed a spare Northbook 14 with Northstar Sales 24.2 to ckeller and shipped it next day to her Directory address (updated by HR Oct 1), not the stale saved address. Issued a return label for NS-SALES-019 for warranty repair. Clara confirmed delivery and sign-in.',
 keys:['ckeller','clara','ns-sales-019','lantern row','return label','code 43'],
 penalties:{'createShipment:ckeller':[4,'Shipped to the saved address book entry: Clara moved out of 7 Quarry Bend', (s,a)=>a[0] && a[0].addrSource==='saved'],
   'setAsset:NS-SALES-019':[2,'Scrapped a laptop with accidental-damage cover until 2027-06-30. Return it for repair', (s,a)=>a[1]==='state' && /Retired|Disposed/.test(a[2])]},
 chatConfirm:{user:'ckeller', ok:s=>TK['INC-1054'].obj[1].ok(s), ask:'Your replacement laptop should have arrived. Can you sign in and check the CRM opens? Please pack the old one in the same box with the return label.',
   yes:'Got it this morning! Signed in and the CRM opens fine. The old one is boxed up with the label on.', no:'Nothing’s arrived here yet, or it isn’t set up for me. I still can’t get into the CRM.'},
 obj:[O(s=>!!claraLaptop(s), 'A replacement laptop with the Sales image is assigned to Clara', 'No replacement laptop with the Sales image is assigned to Clara'),
   O(s=>{ const w=claraLaptop(s); return !!w && s.ship.shipments.some(x=>x.kind==='outbound' && x.asset===w.host && x.recipient==='ckeller' && x.address===s.users.ckeller.address && x.status==='Delivered'); },
     'Replacement delivered to her current (Directory) address', 'The replacement hasn’t been delivered to Clara’s current address'),
   O(s=>s.ship.shipments.some(x=>x.kind==='return' && x.asset==='NS-SALES-019') && ['Return in transit','Returned · Pending wipe'].includes(s.workstations['NS-SALES-019'].state),
     'Return label issued for the broken NS-SALES-019', 'No return label for the damaged laptop'),
   O(s=>s.chat.confirmed['INC-1054']==='ckeller', 'Clara confirmed she received it and can sign in', 'Clara hasn’t confirmed the replacement works')],
 guide:{
  symptomsToNotice:['Voicemail: physical damage (a drop), she works remotely, and “I moved at the start of the month”.',
    'Remote Desktop › NS-SALES-019 connects, so the operating system is fine. Device Manager › Monitors shows the internal display panel in Error (Code 43).',
    'Asset Management › NS-SALES-019 › Details: warranty 2027-06-30 and Accidental damage cover: Yes.',
    'Directory › Clara Keller › Profile: Home address Flat 3, 22 Lantern Row, updated Oct 1 (HR).',
    'Ship Manager: choosing “Saved address book” gives 7 Quarry Bend, and a warning says the saved entry differs from Directory.'],
  diagnosis:'Separate hardware from software first. A working remote session plus a Code 43 error on the panel proves the operating system is healthy and the screen is broken, so no remote fix exists. Uninstalling the driver and scanning again brings the same error back. For a remote user with customer calls booked, the answer is to ship a replacement and recover the broken unit. Covered damage means it goes for repair, not disposal. The real trap is logistics: the courier tool’s address book is out of date, and the authoritative address is HR’s record in Directory, which matches what she said.',
  perfectSteps:['Open Voicemails, read Clara’s message and select Log as ticket. Open INC-1054 and select Assign to me.',
    'Open Tools › Remote Desktop, search “NS-SALES-019”, Connect, open Device Manager: note “Northbook 14 internal display panel · Error (Code 43)”.',
    'Open Tools › Asset Management, search “NS-SALES-019”, Open › Details: note warranty 2027-06-30 and Accidental damage cover: Yes.',
    'Open Tools › Directory, search “clara”, Profile: note the home address and “Updated Oct 1 (HR)”.',
    'Open Tools › PC Shelf: pick an Available, Wiped Northbook 14 laptop that isn’t reserved (for example NSA-S121).',
    'Open Tools › Computer Deployment. Device: that spare, Build profile / image: Sales Mobile · Northstar Sales 24.2, Assign to: Clara Keller (ckeller), Location: Remote (home). Select Run deployment and note the new NS-SALES-1xx host name.',
    'Open Tools › Ship Manager. Type: Outbound to a person, Item: the new NS-SALES-1xx host, Recipient: Clara Keller, Address from: Directory (HR record), Service: Next day. Select Create shipment.',
    'Still in Ship Manager: Type: Return label (person sends to IT), Item: NS-SALES-019, Recipient: Clara Keller, Address from: Directory (HR record). Select Create return label. NS-SALES-019 becomes Return in transit.',
    'On the outbound shipment row select Mark delivered (simulates the courier).',
    'Open Company Chat › Clara Keller and select “INC-1054 · Ask to confirm the fix”. Clara confirms sign-in and the CRM.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Ship Manager: the outbound shipment to 22 Lantern Row shows Delivered, and the return for NS-SALES-019 shows Label created.',
    'Asset Management: the new host is owned by Clara Keller and In use. NS-SALES-019 is Return in transit.',
    'Company Chat: Clara confirms sign-in and the CRM.'],
  commonMistakes:['Accepting the saved address book entry without cross-checking HR.',
    'Shipping a device that hasn’t been deployed or assigned to her.',
    'Retiring a laptop that is covered for repair.',
    'Forgetting the return label, which leaves a “ghost” asset with the user.'],
  realWorldNote:'Remote swaps are where asset tracking breaks down. Every outbound device should have a matching return, and the shipping address should come from HR, not the courier tool’s history. Next-day signed-for delivery protects the company if a box goes missing.',
  idealNotes:'Cause: physical panel damage (drop). Code 43 on the internal display; the OS is fine over Remote Desktop. NS-SALES-019 has accidental-damage cover until 2027-06-30. Action: deployed a spare Northbook 14 with Northstar Sales 24.2 to ckeller and shipped it next day to her Directory address (Flat 3, 22 Lantern Row, updated Oct 1). Didn’t use the stale saved address 7 Quarry Bend. Return label created for NS-SALES-019 (warranty repair), state Return in transit. Verified: delivered, and Clara confirmed sign-in and the CRM in chat.'}},

{ref:'INC-1055', shift:2, pri:'medium', cat:'Hardware / Performance & updates', req:'pshah', asset:'NS-HR-003', assetType:'Windows laptop', created:'09:20',
 arrive:s=>{ Object.assign(s.workstations['NS-HR-003'], {storage:{totalGB:256, cats:{System:76, Apps:52, Documents:61, Downloads:24, 'Temporary files':12, 'Update cache':12, 'Recycle Bin':18}},
   updates:{status:'Failed', error:'0x80070070: not enough free space (needs 20 GB)', pending:['2026-10 Cumulative Update (KB-NS-26104)'], paused:false, needGB:20}}); },
 title:'Laptop crawling, “restart to update” every afternoon',
 desc:'My laptop has been really slow for about a week. Every afternoon it tells me it needs to restart to finish updates, and after the restart the same message is back. Opening the HR system takes ages now.',
 impact:'One HR user is slowed down and their laptop is missing this month’s security update.',
 tried:'Restarted it most days and closed browser tabs.',
 hints:['“Restart to update” coming back after every restart means the update isn’t installing. Find out why in System Update.',
   'The error is 0x80070070: not enough disk space. Settings › Storage shows what is using C: and which items are safe to remove.',
   'Clean up Temporary files and the Update cache, empty the Recycle Bin, select Retry install, restart, then ask Priya in Company Chat.'],
 model:'System Update showed the October cumulative update failing with 0x80070070 (C: had 1 GB free, 20 GB needed), which caused both the restart loop and the slowness. Freed 42 GB by cleaning temporary files and the update cache (24 GB) and emptying the Recycle Bin (18 GB). Documents and Downloads were left alone. Retried the update, restarted, and confirmed it is up to date with 43 GB free. Priya confirmed the laptop is fast again.',
 keys:['ns-hr-003','0x80070070','kb-ns-26104','disk space','update'],
 penalties:{'cleanup:NS-HR-003':[3,'Deleted the user’s downloads without asking her first', (s,a)=>a[1]==='Downloads' && !s.chat.facts.pshahDownloadsOk],
   'updPause:NS-HR-003':[2,'Paused security updates on an HR laptop to hide the symptom', s=>!s.workstations['NS-HR-003'].updates.paused]},
 chatActions:[{id:'ps-dl', user:'pshah', label:'INC-1055 · Ask Priya if old downloads can be removed', ask:'Your C: drive is full. Is it OK if I remove files in Downloads that are older than 30 days?',
   reply:'Yes, that’s fine, it’s mostly old installers and PDFs.', set:s=>{ s.chat.facts.pshahDownloadsOk=true; }}],
 chatConfirm:{user:'pshah', ok:s=>TK['INC-1055'].obj[0].ok(s) && TK['INC-1055'].obj[2].ok(s), ask:'The update has installed and I’ve freed up disk space. Is the HR system faster now?',
   yes:'Much better, the HR system opens straight away and the restart message has gone. Thank you!', no:'It’s still crawling, and it still wants to restart for updates.'},
 obj:[O(s=>{ const w=s.workstations['NS-HR-003']; return w.storage.totalGB-diskUsed(w)>=20; }, 'At least 20 GB free on C:', 'C: still has less than 20 GB free'),
   O(s=>s.workstations['NS-HR-003'].storage.cats.Downloads===24 || s.chat.facts.pshahDownloadsOk, 'Priya’s own files untouched (or removed with her agreement)', 'Priya’s downloads were deleted without her agreement'),
   O(s=>{ const u=s.workstations['NS-HR-003'].updates; return u.status==='Up to date' && !u.paused && !u.pending.length; }, 'October cumulative update installed and the laptop restarted', 'The October update still isn’t installed'),
   O(s=>s.chat.confirmed['INC-1055']==='pshah', 'Priya confirmed the laptop is responsive', 'Priya hasn’t confirmed performance is back')],
 guide:{
  symptomsToNotice:['The “restart to update” prompt comes back after every restart, so an install is failing, not just waiting.',
    'Slow for about a week: something has been building up, not a sudden fault.',
    'System Update: Status Failed, last error 0x80070070 “not enough free space (needs 20 GB)”, free disk space 1 GB.',
    'Settings › Storage: 1 GB free of 256 GB. Temporary files 12 GB, Update cache 12 GB, Recycle Bin 18 GB, Downloads 24 GB, Documents 61 GB (Protected).'],
  diagnosis:'Read the failure code instead of restarting again. 0x80070070 means the disk is full. A nearly full system drive also explains the slowness: there is no room for the page file and the disk is constantly busy. One root cause gives two symptoms. The order matters: free space safely first (system-generated temporary files, the update cache and the Recycle Bin, never the user’s files), then retry the update, then restart, then check both the free space and the update status.',
  perfectSteps:['Open INC-1055 and select Assign to me.',
    'Open Tools › Remote Desktop, search “NS-HR-003”, Connect. Open System Update: read Status Failed and the 0x80070070 error, and note “updates need 20 GB”.',
    'Open Settings › Storage: read the category list. Documents is Protected; Downloads belongs to Priya.',
    'Select Clean up on Temporary files, then Clean up on Update cache. Free space rises to 25 GB.',
    'Select Empty Recycle Bin. Free space rises to 43 GB.',
    'Open System Update and select Retry install. Status becomes “Restart required”.',
    'Select Restart now (or ⏻ Restart on the taskbar) and confirm. System Update now shows Up to date.',
    'Open Settings › Storage again and confirm at least 20 GB is free.',
    'Open Company Chat › Priya Shah and select “INC-1055 · Ask to confirm the fix”. Priya confirms it is fast again.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Settings › Storage shows 43 GB free, with Documents still 61 GB and Downloads still 24 GB.',
    'System Update shows Up to date with nothing pending, and updates aren’t paused.',
    'Company Chat: Priya confirms the laptop is responsive.'],
  commonMistakes:['Restarting again without reading the update error.',
    'Removing Downloads without asking Priya first.',
    'Pausing updates to stop the prompt.',
    'Forgetting the restart, which leaves the update half-installed.'],
  realWorldNote:'Full system drives are one of the most common causes of “slow PC” tickets and failed patching. Built-in clean-up of update caches and temporary files is safe. User folders are not, especially where records must be kept. Patch-compliance reports usually flag these machines before users do.',
  idealNotes:'Cause: C: full (1 GB free), so KB-NS-26104 kept failing with 0x80070070 and the laptop was paging heavily. Action: cleaned temporary files and the update cache (24 GB), emptied the Recycle Bin (18 GB), retried the update, restarted. Documents and Downloads untouched. Verified: 43 GB free, System Update shows Up to date, Priya confirmed performance in chat.'}},

   addPerson(s, user('iduarte','Ines Duarte','Support','Team Lead',2,'4214','NS-SUP-007',['Support-Share'],{manager:'Dana Okafor'}), w, mbx(1.3)); },
 title:'Second monitor says “No signal” after a boardroom presentation',
