 tried:'Unplugged and replugged the dock cable and pressed the monitor’s power button.',
 hints:['She presented yesterday. Something may have changed on the laptop then, not on the monitor. First check whether the laptop can see the monitor at all.',
   'Device Manager lists the dock and the NSM-27 as working, and Settings › Display shows 2 detected but 1 active. Look at the Multiple displays setting.',
   'Settings › Display › Multiple displays: choose “Extend these displays”, select Keep changes, then confirm with Ines in Company Chat.'],
 model:'Device Manager showed the dock and the NSM-27 monitor working, so the hardware was fine. The display mode had been left on “Show only on 1” after yesterday’s boardroom presentation. Set Multiple displays to Extend and kept the change. Two displays are now active and Ines confirmed she can drag the queue onto the second screen. No hardware ordered.',
 keys:['ns-sup-007','extend','display','show only on 1','presentation'],
 penalties:{'createShipment:iduarte':[2,'Shipped hardware when Device Manager showed the monitor connected'],
   'issueAccessory:mon24':[2,'Issued a new monitor for a display-settings fault', (s,a)=>a[1]==='NS-SUP-007'],
   'issueAccessory:dock':[2,'Issued a new dock for a display-settings fault', (s,a)=>a[1]==='NS-SUP-007']},
 chatConfirm:{user:'iduarte', ok:s=>TK['INC-1056'].obj[0].ok(s), ask:'Your laptop was still set to show only on the laptop screen after the presentation. I’ve set it back to Extend. Can you drag a window to the second screen?',
   yes:'Both screens are back and the queue is on the big one. Thanks!', no:'Not quite. I need the second screen as extra space so I can drag the queue across, and I can’t yet.'},
 obj:[O(s=>{ const w=s.workstations['NS-SUP-007']; return w.display.mode==='Extend these displays' && monitors(w).active===2 && w.devices.every(d=>d.status==='OK'); }, 'Both screens active in Extend mode', 'Only one display is in use'),
   O(s=>!s.ship.shipments.some(x=>x.recipient==='iduarte') && !s.workstations['NS-SUP-007'].accessories.length, 'No unnecessary hardware sent', 'Replacement hardware was sent for a settings fault'),
   O(s=>s.chat.confirmed['INC-1056']==='iduarte', 'Ines confirmed she can drag windows to the second screen', 'Ines hasn’t confirmed the fix')],
 guide:{
  symptomsToNotice:['“No signal” on the monitor means it isn’t receiving a picture. That can be a cable or a setting.',
    '“Presented in the boardroom yesterday”: presenting often changes the display mode.',
    'Device Manager: Northstar USB-C Dock DK-2 Working (firmware current), NSM-27 monitor Working. The laptop can see it.',
    'Settings › Display: 2 displays detected, 1 active, mode “Show only on 1”.'],
  diagnosis:'Work up the stack. Physical: the dock and monitor are detected, so the cable and dock are fine. Driver: working. Configuration: one of two detected displays is active, and the mode is “Show only on 1”. That matches the timeline (a projector session yesterday). “Detected but not active” is the key evidence that rules out replacing hardware.',
  perfectSteps:['Open the chat from Ines (dashboard › Incoming contacts › Open chat) and select Log as INC-1056. Open the ticket and select Assign to me.',
    'Open Tools › Remote Desktop, search “NS-SUP-007”, Connect, open Device Manager: confirm the dock and the NSM-27 monitor are Working.',
    'Open Settings › Display: note “2 displays detected · 1 active” and Multiple displays “Show only on 1”.',
    'In Multiple displays choose “Extend these displays”, then select Keep changes in the confirmation box.',
    'Check Settings › Display again: 2 displays detected · 2 active.',
    'Open Company Chat › Ines Duarte and select “INC-1056 · Ask to confirm the fix”. Ines confirms.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Settings › Display: Extend these displays, 2 of 2 displays active.',
    'Device Manager: every device Working (no driver removed).',
    'Company Chat: Ines confirms she can drag the queue across.'],
  commonMistakes:['Ordering a monitor or dock because it says “No signal”.',
    'Uninstalling display drivers before checking the settings.',
    'Choosing Duplicate, which lights up the screen but not the way she works.',
    'Not asking what changed recently (the boardroom presentation).'],
  realWorldNote:'Projection settings (Win+P) stick after meetings and cause a steady stream of “monitor broken” tickets. Asking what changed recently, then checking whether the operating system can detect the device, solves most peripheral calls without a desk visit.',
  idealNotes:'Cause: display mode left on “Show only on 1” after a boardroom presentation. Dock DK-2 working (firmware current), NSM-27 detected but not active. Action: Settings › Display › Multiple displays set to Extend these displays and kept. Verified: 2 active displays; Ines confirmed in chat she can drag windows to the second screen. No hardware ordered.'}},

{ref:'INC-1057', shift:2, pri:'critical', cat:'Security / Social engineering (device)', reqName:'Caller claiming to be Avery Wilson', reqDept:'Executive Office (unverified)', reqLoc:'Unknown', reqExt:'—', reqEmail:'not given',
 asset:'NS-EXEC-001', assetType:'Windows laptop', created:'08:51', security:true,
 intake:{via:'voicemail', name:'Caller says: Avery Wilson', role:'Claims to be Chief of Staff · Executive Office', ext:'—', callerId:'+1 555-0187 (external · not in Directory)', dur:'0:38',
   text:'Hi, this is Avery Wilson, Chief of Staff. My laptop was stolen from my car at the airport. I need a replacement couriered today to the Corvane Hotel, 88 Wharf Street, room 1214. I’m presenting to the board tomorrow. Please also reset my password and text the new one to this number, 555-0187. Thanks.'},
 arrive:s=>{ const u=s.users.awilson; u.lastSignIn='Today 08:02 · NS-EXEC-001 (Floor 2, wired)'; s.chat.facts.awResets=u.pwdResetCount||0; },
 title:'Voicemail: “Avery Wilson” wants a laptop couriered to a hotel today',
 desc:'Hi, this is Avery Wilson, Chief of Staff. My laptop was stolen from my car at the airport. I need a replacement couriered today to the Corvane Hotel, 88 Wharf Street, room 1214. I’m presenting to the board tomorrow. Please also reset my password and text the new one to this number, 555-0187. Thanks.',
 impact:'If the request is fake, an executive’s device and credentials would go to an attacker. If it’s real, an executive is without a device.',
 tried:'Voicemail only. No portal ticket and no call from the extension on file.',
 hints:['Before acting on an urgent request to send a device or credentials somewhere new, check the story against what your systems already show.',
   'The callback number isn’t on Avery’s record, Directory shows she signed in at 08:02 from NS-EXEC-001, and Asset Management shows that laptop online and wired on Floor 2. Contact Avery through a trusted channel.',
   'Ask Avery in Company Chat, record the evidence in your notes, change nothing, and escalate to Security.'],
 model:'The voicemail came from an unregistered external number and asked to ship to a hotel and text a password, both strong signs of pretexting. Directory shows Avery signed in today from NS-EXEC-001, and Asset Management shows that laptop online on the Floor 2 switch. Avery confirmed in Company Chat that she made no call and still has her laptop. Made no changes: no shipment, no password reset, no lock or wipe. Escalated to Security with the caller number, time and requested address.',
 keys:['awilson','avery','555-0187','corvane','ns-exec-001','pretext','social engineering'],
 penalties:{'createShipment:awilson':[6,'Sent an executive laptop to an unverified address from a voicemail'],
   'resetPassword:awilson':[5,'Reset an executive’s password for an unverified caller'],
   'resetMfa:awilson':[5,'Removed an executive’s MFA for an unverified caller'],
   'remoteWipe:NS-EXEC-001':[6,'Wiped the real executive’s working laptop on a fake theft report'],
   'remoteLock:NS-EXEC-001':[3,'Locked out the real user on an unverified claim'],
   'setAsset:NS-EXEC-001':[3,'Marked a laptop that is online on Floor 2 as stolen', (s,a)=>a[1]==='state' && a[2]==='Lost/Stolen']},
 chatActions:[{id:'aw-verify', user:'awilson', label:'INC-1057 · Ask Avery if she called about a stolen laptop', ask:'Quick check from the service desk: did you just leave us a voicemail about your laptop being stolen?',
   reply:'No, I haven’t called anyone. I’m at my desk on Floor 2 and my laptop is right here. Please don’t change anything, and let Security know.', set:s=>{ s.chat.verified['INC-1057']='awilson'; }}],
 obj:[O(s=>s.chat.verified['INC-1057']==='awilson', 'Claim checked with the real Avery through Company Chat', 'The caller’s story hasn’t been checked through a trusted channel'),
   O(s=>!s.ship.shipments.some(x=>x.recipient==='awilson'), 'Nothing shipped on the strength of the voicemail', 'A device was shipped for the caller'),
   O(s=>{ const u=s.users.awilson, w=s.workstations['NS-EXEC-001']; return u.enabled && u.mfa && !u.mustChange && (u.pwdResetCount||0)===(s.chat.facts.awResets||0) && w.state==='In use' && !w.locked && !w.wiped; },
     'Avery’s account and laptop left untouched', 'Avery’s account or laptop was changed because of an unverified call'),
   O(s=>s.tickets['INC-1057'].status==='escalated', 'Routed to Security', 'Not yet routed to Security')],
 guide:{
  symptomsToNotice:['Urgency, authority (Chief of Staff, board meeting) and a new delivery channel (a hotel, a password by text) together: classic pretexting.',
    'Caller ID +1 555-0187 is external and doesn’t match the mobile on Avery’s record (+1 555-0110).',
    'Directory › Avery Wilson › Authentication: last sign-in “Today 08:02 · NS-EXEC-001 (Floor 2, wired)”.',
    'Asset Management › NS-EXEC-001 › Health: Heartbeat Live, network Floor 2 Switch. The “stolen” laptop is in the building.',
    'The request skips the normal process: no portal ticket, and it asks for a password over text message.'],
  diagnosis:'The question isn’t how to replace a laptop. It’s whether the request is genuine. Never use contact details the requester supplies; check against what you already hold. Live data contradicts the story (the “stolen” laptop is online on Floor 2), and the real person, reached through a trusted internal channel, denies calling. That makes this an attempted social-engineering attack. The safe action is to change nothing (any change, even a protective wipe, causes harm here), keep the details and hand off to Security.',
  perfectSteps:['Open Voicemails, read the message and caller ID, and select Log as ticket. Open INC-1057 and select Assign to me.',
    'Open Tools › Directory, search “avery”, select Avery Wilson. On Profile compare Mobile (+1 555-0110) with the caller ID (+1 555-0187). On Authentication note the last sign-in at 08:02 from NS-EXEC-001.',
    'Open Tools › Asset Management, search “NS-EXEC-001”, Open › Health: Heartbeat Live, network Floor 2 Switch.',
    'Open Company Chat › Avery Wilson and select “INC-1057 · Ask Avery if she called about a stolen laptop”. She didn’t call and still has her laptop.',
    'Don’t create a shipment, reset the password or MFA, or lock or wipe the laptop.',
    'Optional: on the voicemail select Save to INC-1057 and Forward to Security.',
    'Select Escalate to Security and write the evidence: caller number, time 08:51, the hotel address and the password-by-text request, and the facts that contradict the claim.'],
  verify:['Company Chat shows Avery’s denial.',
    'Ship Manager has no shipment for Avery Wilson.',
    'Directory: Avery is Enabled, MFA Enrolled, no password reset today. Asset Management: NS-EXEC-001 is In use, not locked or wiped.',
    'The ticket status is Escalated.'],
  commonMistakes:['Calling back the number the caller left instead of using a trusted channel.',
    'Wiping or locking the laptop “to be safe”, which disrupts the real executive.',
    'Resetting the password because the caller is senior and in a hurry.',
    'Closing the ticket instead of reporting the attempt to Security.'],
  realWorldNote:'Help-desk pretexting, impersonating a senior person to get a password reset or a device, is behind several well-known breaches. Strong desks require a call back to the number on file, or a verified internal channel, for any credential or device request, however senior or urgent the caller sounds. They report every attempt, because one targeted call often means others.',
  idealNotes:'Suspected social engineering. Voicemail 08:51 from external number +1 555-0187 (not on file; Avery’s mobile is +1 555-0110) claimed NS-EXEC-001 was stolen and asked to courier a replacement to the Corvane Hotel, 88 Wharf St, room 1214, and to text a new password. Evidence against: Directory shows awilson signed in 08:02 from NS-EXEC-001; Asset Management shows NS-EXEC-001 live on the Floor 2 switch. Avery confirmed in Company Chat she didn’t call and has her laptop. No changes made (no shipment, reset, lock or wipe). Escalated to Security with the caller details.'}},

{ref:'INC-1058', shift:2, pri:'low', cat:'Hardware / Power & accessories', req:'dasante', asset:'NS-OPS-026', assetType:'Windows laptop', created:'09:31',
 intake:{via:'chat', from:'dasante', text:['my laptop battery keeps going down even though it’s plugged in. it’s at 18% now','it’s plugged in to the charger at my desk, the light on the cable is on']},
 arrive:s=>{ const w=ws('NS-OPS-026','dasante',1,'NSA-1026','NB14-56301',{battery:{pct:18, charging:false, adapterW:45, health:91, cycles:212, saver:false},
     accessories:['USB-C charger 65 W (CHG-65W-118): reported missing Oct 6, taken to a meeting room']});
   w.devices.push({id:'usbc', name:'USB-C Power Delivery', cat:'Batteries', status:'OK', code:null, note:'Source: 45 W adapter (third-party, not issued by Northstar)'});
   addPerson(s, user('dasante','Daniel Asante','Operations','Field Coordinator',1,'3527','NS-OPS-026',['Operations-Share'],{manager:'Jordan Price'}), w, mbx(0.8));
   if (!s.shelf.accessories.some(a=>a.id==='batnb14')) s.shelf.accessories.push({id:'batnb14', name:'Northbook 14 replacement battery', qty:1}); },
 title:'Laptop battery drains while plugged in',
 desc:'My laptop battery keeps going down even though it’s plugged in. It’s at 18% now. It’s plugged in to the charger at my desk, and the light on the cable is on.',
 impact:'One user will lose their laptop within the hour unless charging is fixed. Nothing else is affected.',
 tried:'Tried a different wall socket.',
 hints:['“Plugged in but draining” can be the battery, the laptop or the charger. Remote Desktop › Settings › Power & battery tells you which.',
   'The laptop reports a 45 W adapter, and a Northbook 14 needs 65 W. Battery health is 91%. Asset Management › Accessories shows his issued charger went missing on Oct 6.',
   'Issue a USB-C charger 65 W from PC Shelf › Accessories to NS-OPS-026, ask Daniel in Company Chat to swap chargers, check Power & battery shows Charging, then get his confirmation.'],
 model:'Power & battery showed “Not charging” on a 45 W adapter, below the 65 W a Northbook 14 needs. Daniel was using a third-party charger because his issued 65 W charger (CHG-65W-118) went missing on Oct 6. Battery health is 91%, so no battery or laptop swap was needed. Issued a 65 W charger from stock against NS-OPS-026, Daniel swapped it in, and Power & battery now shows Charging at 65 W. Daniel confirmed.',
 keys:['dasante','daniel','ns-ops-026','65 w','45 w','charger'],
 chatActions:[{id:'da-swap', user:'dasante', label:'INC-1058 · Ask Daniel to swap to the issued charger', ask:'I’ve issued you a 65 W charger; it’s at the service desk on Floor 1. Could you swap it for the one you’re using?',
   reply:s=>has65(s) ? 'Swapped! The light’s on and it says charging now.' : 'I went to the desk, but there’s no charger with my name on it.',
   set:s=>{ if (!has65(s)) return; const w=s.workstations['NS-OPS-026']; Object.assign(w.battery,{adapterW:65, charging:true}); w.devices.find(d=>d.id==='usbc').note='Source: 65 W Northstar charger'; }}],
 chatConfirm:{user:'dasante', ok:s=>TK['INC-1058'].obj[1].ok(s), ask:'Is the battery percentage going up now?', yes:'Yep, 31% and climbing. Thanks!', no:'No, it’s still going down. 17% now.',
   onYes:s=>{ s.workstations['NS-OPS-026'].battery.pct=31; }},
 obj:[O(has65, 'A 65 W charger issued and recorded against NS-OPS-026', 'No 65 W charger has been issued to Daniel’s laptop'),
   O(s=>{ const b=s.workstations['NS-OPS-026'].battery; return b.adapterW>=65 && b.charging; }, 'Laptop is charging at 65 W', 'The laptop still isn’t charging'),
   O(s=>s.workstations['NS-OPS-026'].state==='In use' && ownedHosts(s,'dasante').length===1 && s.shelf.accessories.find(a=>a.id==='batnb14').qty===1,
     'Laptop and battery kept in service (the battery is healthy)', 'A healthy laptop was swapped or its battery replaced'),
   O(s=>s.chat.confirmed['INC-1058']==='dasante', 'Daniel confirmed the battery is charging', 'Daniel hasn’t confirmed')],
 guide:{
  symptomsToNotice:['“The light on the cable is on”: power is arriving, so the question is how much.',
    'Settings › Power & battery: Status Not charging, power adapter 45 W USB-C with the warning “Below the 65 W this laptop needs”. Battery health 91%, 212 cycles.',
    'Device Manager › Batteries: USB-C Power Delivery, source a 45 W third-party adapter.',
    'Asset Management › NS-OPS-026 › Accessories: CHG-65W-118 reported missing Oct 6.'],
  diagnosis:'Split the power path into charger, port, battery and operating system. The battery is healthy (91%, low cycle count) and the operating system clearly reports the adapter’s wattage, which is below what this model needs. Every USB-C charger fits, so people grab whatever is on the desk. The asset record explains why: his own charger went missing. The cheapest correct fix is the accessory, recorded against the asset so the inventory stays accurate.',
  perfectSteps:['Open the chat from Daniel (dashboard › Incoming contacts › Open chat) and select Log as INC-1058. Open the ticket and select Assign to me.',
    'Open Tools › Remote Desktop, search “NS-OPS-026”, Connect, open Settings › Power & battery: read Not charging, 45 W adapter, health 91%, 212 cycles.',
    'Open Device Manager › Batteries: USB-C Power Delivery source is a 45 W third-party adapter.',
    'Open Tools › Asset Management, search “NS-OPS-026”, Open › Accessories: note CHG-65W-118 reported missing Oct 6.',
    'Open Tools › PC Shelf › Accessories. On USB-C charger 65 W choose NS-OPS-026 · Daniel Asante and select Issue. Stock drops by one and the asset lists the charger.',
    'Open Company Chat › Daniel Asante and select “INC-1058 · Ask Daniel to swap to the issued charger”. He swaps it.',
    'Back in Remote Desktop › Settings › Power & battery: Status Charging, power adapter 65 W.',
    'In Company Chat select “INC-1058 · Ask to confirm the fix”. Daniel confirms the percentage is going up.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Power & battery shows Charging on a 65 W adapter.',
    'Asset Management › NS-OPS-026 › Accessories lists USB-C charger 65 W. The replacement battery is still on the shelf.',
    'Company Chat: Daniel confirms it’s charging.'],
  commonMistakes:['Replacing the battery or the whole laptop without reading the battery health.',
    'Issuing the 45 W charger, which is no better than the one he has.',
    'Not recording the issued accessory against the asset.',
    'Using Battery saver as a “fix”.'],
  realWorldNote:'Under-powered USB-C chargers are a common modern cause of “battery won’t charge” tickets: the plug fits and the light comes on, but the wattage is too low. Tracking chargers and docks as accessories against the laptop saves money and finds the ones that walk off to meeting rooms.',
  idealNotes:'Cause: under-powered 45 W third-party USB-C charger (a Northbook 14 needs 65 W). Issued charger CHG-65W-118 reported missing Oct 6. Battery health 91%, 212 cycles, no fault. Action: issued a USB-C charger 65 W from stock against NS-OPS-026 for dasante and asked him to swap. Verified: Power & battery shows Charging at 65 W; Daniel confirmed in chat.'}},

/* ===== Shift 3 · joiners, movers, leavers and account security ===== */
{ref:'INC-1059', shift:3, pri:'high', cat:'Identity / Joiner', req:'pshah', asset:'HR-2291', assetType:'HR starter record', created:'09:14',
 arrive:s=>{ addRosa(s);
   addPerson(s, user('kmensah','Kwame Mensah','Operations','Operations Coordinator',1,'3533',null,['Operations-Share'],{enabled:false, presence:'offline', lastSignIn:'Mar 14 2025, 16:58', licences:[], startDate:'2019-06-03'}),
     null, mbx(3.1,'Leaver hold (7 years)',{enabled:false}));
   s.hr.leavers.push({id:'HR-LVR-0031', user:'kmensah', lastDay:'Fri Mar 14 2025', manager:'Jordan Price', notes:'Left in 2025. Mailbox is on a 7-year legal hold. Keep the account disabled. Never reuse it or its username.'});
   s.hr.starters.push({id:'HR-2291', first:'Kofi', last:'Mensah', dept:'Sales', title:'Account Executive', manager:'Rosa Delgado', startDate:'Tomorrow 09:00', roleTemplate:'Sales · same access as the rest of the Sales team',
     floor:1, ext:'3113', personalEmail:'kofi.m.home@mailbox.example', mobile:'+1 555-0163', equipment:'Standard Sales laptop',
     notes:'Licences: Office Suite (Standard) and Sales Hub CRM. Needs to sign in and see the Sales files on day one. Rosa will meet him at reception.'});
   s.licences.crm.total=licUsed(s,'crm').length+1; ['office','endpoint'].forEach(l=>{ const f=licFree(s,l); if (f<2) s.licences[l].total+=2-f; });
   addShelf(s,{tag:'NSA-S131', model:'Northbook 14 laptop', serial:'NB14-56131', cond:'New · boxed', bay:'Shelf A1'}); },
 title:'New starter tomorrow: Sales account, laptop and licences',
 desc:'Hi IT, Kofi Mensah starts in Sales tomorrow at 09:00 and nothing is set up yet. Sorry, the starter form got stuck in my drafts. The full details are on starter record HR-2291. He needs to be able to sign in and see the Sales files on day one. Rosa is meeting him at reception.',
 impact:'A new hire arrives tomorrow morning with no account, mailbox or laptop. The Sales manager has blocked out the morning for onboarding.',
 tried:'HR filled in starter record HR-2291 (Directory › Starters). Nothing else.',
 hints:['Open the HR starter record first. Then read the Username standard in Documentation before you type anything into Create user.',
   'Search Directory for “mensah”: a 2025 leaver already holds kmensah. Follow the standard for the next name, and copy the group set from his manager, Rosa Delgado.',
   'Create komensah (Sales, manager Rosa Delgado, Sales-Share). Assign Office Suite and Sales Hub CRM, deploy a laptop with Northstar Sales 24.2, reset the password with must-change sent to his manager, run Test sign-in, then confirm with Priya.'],
 model:'Processed starter HR-2291 for Kofi Mensah. kmensah belongs to a 2025 leaver on a legal hold, so I left it disabled and created komensah under the Username standard (no middle initial, so the next letter of the first name). Set Sales / Account Executive with manager Rosa Delgado and matched Rosa’s groups (Domain Users, Sales-Share). Assigned Office Suite (which provisioned the mailbox) and the last free Sales Hub CRM seat. Deployed a Northbook 14 with Northstar Sales 24.2. Issued a temporary password that must change at first sign-in and sent it to Rosa through Company Chat, not the personal address on the form. The sign-in test passed and Priya confirmed in chat.',
 keys:['komensah','kofi','hr-2291','username standard','sales-share','kmensah'],
 penalties:{'enable:kmensah':[4,'Re-enabled a 2025 leaver’s account: Kofi would get a stranger’s mailbox and Operations access'],
   'editUser:kmensah':[4,'Repurposed a leaver’s account instead of creating a new one'],
   'renameUsername:kmensah':[4,'Repurposed a leaver’s account instead of creating a new one'],
   'resetPassword:komensah':[4,'Sent a temporary password to a personal email address, outside the company', (s,a)=>a[2]==='personal']},
 chatConfirm:{user:'pshah', ok:s=>TK['INC-1059'].obj.slice(0,6).every(o=>o.ok(s)) && s.users.komensah.signInOk,
   ask:'Kofi Mensah’s account, laptop and licences are ready for tomorrow, and Rosa has his first-day password. Can you tick off HR-2291 on your side?',
   yes:'Perfect, HR-2291 is ticked off. Thank you, and sorry again for the late form!', no:'I checked the starter checklist and something’s still missing for Kofi. Can you look again?'},
 obj:[O(s=>{ const u=s.users.komensah; return !!u && !u.deleted && u.name==='Kofi Mensah' && u.dept==='Sales' && u.manager==='Rosa Delgado'; }, 'Account komensah created for Kofi Mensah in Sales, managed by Rosa Delgado', 'There’s no account for Kofi that follows the Username standard'),
   O(s=>!s.users.kmensah.enabled && s.users.kmensah.name==='Kwame Mensah' && !s.users.kmensah.renamed, 'The 2025 leaver account kmensah is untouched and disabled', 'The leaver account kmensah was re-enabled or changed'),
   O(s=>{ const u=s.users.komensah; return !!u && u.groups.slice().sort().join()==='Domain Users,Sales-Share'; }, 'Groups match the Sales team: Domain Users and Sales-Share', 'Kofi’s groups don’t match the Sales team'),
   O(s=>{ const u=s.users.komensah; return !!u && ['office','crm'].every(l=>u.licences.includes(l)) && !!s.mail.mailboxes.komensah; }, 'Office Suite and Sales Hub CRM assigned, mailbox provisioned', 'Kofi is missing a licence or a mailbox'),
   O(s=>Object.values(s.workstations).some(w=>w.owner==='komensah' && /Northbook/.test(w.model) && w.state==='In use' && w.image==='Northstar Sales 24.2'), 'A laptop with Northstar Sales 24.2 is deployed to Kofi', 'No Sales laptop has been deployed to Kofi'),
   O(s=>{ const u=s.users.komensah; return !!u && u.mustChange && u.credsTo==='manager'; }, 'Temporary password must change at first sign-in and went to his manager', 'The first-day password isn’t set up securely'),
   O(s=>{ const u=s.users.komensah; return !!u && u.signInOk && s.chat.confirmed['INC-1059']==='pshah'; }, 'Sign-in test passed and Priya confirmed the starter is ready', 'The new account hasn’t been tested or confirmed with HR')],
 guide:{
  symptomsToNotice:['Only a name is given. The ticket never states a username, so you have to work it out from the standard.',
    'The starter record says access should be “the same as the rest of the Sales team”. That is vague, so compare against a real Sales account instead of guessing.',
    'The record has a personal email address. It is there to tempt you into sending credentials to it.',
    'Licence pools › Sales Hub CRM shows exactly 1 free seat.',
    'The PC Shelf has a faulty laptop (NSA-S305) that can’t be deployed.'],
  diagnosis:'This joiner ticket checks whether you follow the identity standard instead of improvising. Searching Directory for “mensah” returns kmensah (Kwame Mensah), disabled since 2025, with a leaver record that says the mailbox is on a 7-year hold. The Username standard (Documentation) says: first initial + surname; if taken, add the middle initial, or with no middle initial the next letter of the first name. Kofi has no middle initial, so the account is komensah. Never reuse the leaver: Kofi would get a former employee’s mailbox, groups and audit trail. “Same as the team” means the minimum set a peer holds: Rosa Delgado, his manager, has Domain Users + Sales-Share. Licences come from the starter record; Office Suite provisions the mailbox. The first-day password goes to the manager through an internal channel, never to a personal mailbox. Verify with a sign-in test, then close the loop with HR, who own the joiner process.',
  perfectSteps:['Open INC-1059 and select Assign to me.',
    'Open Tools › Directory › Starters, select Kofi Mensah (HR-2291) and note dept Sales, title Account Executive, manager Rosa Delgado, floor 1, ext 3113, licences Office Suite + Sales Hub CRM.',
    'Open Tools › Documentation, search “username” and read “Username standard”.',
    'In Directory › Users search “mensah”: kmensah is Kwame Mensah, Disabled. Directory › Leavers › Kwame Mensah (HR-LVR-0031) says never reuse it. Change nothing.',
    'Search “delgado”, select Rosa Delgado › Groups: Domain Users + Sales-Share is the team baseline.',
    'Directory › Starters › Kofi Mensah › Create account from this record…. Change Username to komensah (the hint turns green). Keep Department Sales, Manager Rosa Delgado. Tick Sales Hub CRM as well as Office Suite and Endpoint Protection, keep “Add the department share group” ticked, and select Create user.',
    'Check komensah › Groups (Domain Users, Sales-Share) and › Licences (Office Suite, Sales Hub CRM assigned; the flash said the mailbox was provisioned).',
    'Open Tools › Computer Deployment. Device: an Available, Wiped Northbook 14 (for example NSA-S131), image Sales Mobile · Northstar Sales 24.2, Assign to: Kofi Mensah (komensah), Location: Floor 1. Select Run deployment. Leave the faulty NSA-S305 alone.',
    'Directory › komensah › Authentication › Reset password…: keep “User must change password at next sign-in” ticked and set delivery to “Company Chat to their manager”. Select Reset password.',
    'Select Test sign-in. Expect “Sign-in test passed for komensah. They’ll be asked to choose a new password.”',
    'Open Company Chat › Priya Shah and select “INC-1059 · Ask to confirm the fix”. Priya ticks off HR-2291.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Directory › komensah › Authentication: Enabled, Not locked, Must change at next sign-in, sent via Company Chat to their manager, last sign-in test Passed.',
    'Directory › komensah › Groups lists exactly Domain Users and Sales-Share.',
    'Directory › Licence pools › Sales Hub CRM shows 0 free, with Kofi as a holder.',
    'Asset Management lists a NS-SALES-1xx laptop owned by Kofi Mensah, In use, image Northstar Sales 24.2.',
    'Directory › kmensah still shows Disabled · Kwame Mensah.',
    'Company Chat shows Priya’s confirmation.'],
  commonMistakes:['Typing kmensah without searching first, then “fixing” the conflict by re-enabling the leaver.',
    'Inventing a username (kmensah2) instead of following the written standard.',
    'Copying groups from someone in another department, or adding every share “just in case”.',
    'Sending the password to the personal email because it is the only address on the form.',
    'Forgetting Sales Hub CRM, or the Office licence, so there is no mailbox on day one.',
    'Skipping the sign-in test and the confirmation with HR.'],
  realWorldNote:'In real joiner/mover/leaver processes, account reuse is one of the most common audit findings. A new hire who shares a surname with a leaver can inherit their mailbox, files and access. Most organisations make usernames permanent and never recycle them. First-day credentials usually go to the line manager, or through a temporary access pass, so they never pass through personal email.',
  idealNotes:'Starter HR-2291 Kofi Mensah (Sales, AE, manager Rosa Delgado, start tomorrow 09:00). kmensah is held by leaver Kwame Mensah (disabled, 7-year hold), so I left it untouched and created komensah under the Username standard. Groups match Rosa: Domain Users, Sales-Share. Licences: Office Suite (mailbox kofi.mensah@northstar.example provisioned) plus Sales Hub CRM (last free seat). Laptop deployed with Northstar Sales 24.2. Temp password must change at first sign-in, sent to Rosa via Company Chat, not the personal address. Sign-in test passed. Priya (HR) confirmed in chat.'}},

 title:'Name changed after marriage but email still shows old name',
 desc:'Hi, I got married last month and HR updated my surname to Osei on payroll (HR-CHG-0417), but my email, chat and the address book all still say Hannah Clarke. Could you switch everything over to my new name? Suppliers email me invoices all day, so I really can’t afford to miss anything.',
 impact:'One user. Cosmetic but visible to suppliers, with a risk to accounts-payable mail flow if it’s done wrong.',
 tried:'Changed my email signature myself. Nothing else.',
 hints:['Open Hannah’s Directory profile and read the Pending HR change banner. Then run a Message trace for her old address. Who still sends there?',
   'Change what people see (display name and primary address), not what she signs in with. Read the Username standard in Documentation.',
   'Edit profile: display name Hannah Osei. Add hannah.osei@northstar.example and make it primary, keep the old address as an alias, send a test to the old address, then ask Hannah to confirm in Company Chat.'],
 model:'Verified the legal name change against HR record HR-CHG-0417. Changed the display name to Hannah Osei and made hannah.osei@northstar.example the primary address. Kept hannah.clarke@northstar.example as an alias, because today’s trace shows suppliers still invoicing the old address. Left the sign-in username hclarke unchanged so her Windows profile and mapped drives keep working. A test to the old address was delivered to her mailbox, and Hannah confirmed the change in chat.',
 keys:['hclarke','hannah','osei','alias','hr-chg-0417'],
 penalties:{'renameUsername:hclarke':[3,'Renamed the sign-in username: NS-FIN-024 now creates a new empty profile and mapped drives fail'],
   'removeAlias:hclarke':[3,'Removed the old address: supplier invoices to hannah.clarke@ now bounce', (s,a)=>a[1]==='hannah.clarke@northstar.example'],
   'createUser:*':[3,'Created a second identity for Hannah instead of updating her account', (s,a)=>a[0] && /^hannah$/i.test(String(a[0].first||'').trim())],
   'createDuplicate:*':[3,'Created a second identity for Hannah instead of updating her account', (s,a)=>a[0] && /^hannah$/i.test(String(a[0].first||'').trim())]},
 chatConfirm:{user:'hclarke', ok:s=>TK['INC-1060'].obj.slice(0,4).every(o=>o.ok(s)), ask:'I’ve updated your name and email address. Can you check how it looks in the address book and on a new email?',
   yes:'It says Hannah Osei everywhere now, and invoices are still coming in. Thank you!', no:'It still looks wrong on my side. My name or email hasn’t changed properly yet.'},
 obj:[O(s=>s.users.hclarke.name==='Hannah Osei', 'Display name updated to Hannah Osei', 'The display name still shows the old surname'),
   O(s=>s.users.hclarke.email==='hannah.osei@northstar.example', 'Primary email is hannah.osei@northstar.example', 'The primary address hasn’t changed'),
   O(s=>s.users.hclarke.aliases.includes('hannah.clarke@northstar.example'), 'Old address kept as an alias so supplier mail still arrives', 'hannah.clarke@ isn’t an alias, so supplier mail would bounce'),
   O(s=>!s.users.hclarke.renamed && loginOf(s.users.hclarke)==='hclarke', 'Sign-in username left unchanged', 'The sign-in username was renamed, so Hannah’s profile and drives will break'),
   O(s=>s.mail.mailboxes.hclarke.aliasTestOk && s.users.hclarke.aliases.includes('hannah.clarke@northstar.example'), 'Test mail to the old address delivered to Hannah’s mailbox', 'Delivery to the old address hasn’t been tested since the change'),
   O(s=>s.chat.confirmed['INC-1060']==='hclarke', 'Hannah confirmed the new name looks right', 'Hannah hasn’t confirmed the change')],
 guide:{
  symptomsToNotice:['HR has already recorded the change (the Pending HR change banner), so the request is legitimate and authorised.',
    'Message trace for “clarke” shows 6 supplier messages to hannah.clarke@ today. Removing that address would bounce real invoices.',
    'Her username hclarke is what her laptop NS-FIN-024 and her mapped drives use.'],
  diagnosis:'A name change touches three different identifiers: the display name (what people see), the email addresses (where mail goes) and the sign-in name (what devices and apps rely on). Only the first two should change. The message trace shows active external senders, so the old address must stay as an alias or invoices will bounce. The Username standard explains why the username stays: renaming it breaks saved sign-ins, mapped drives and scripts, for a cosmetic gain nobody sees. The HR record is the authority for the new legal name, so no extra approval is needed. Test the risky part, mail to the old address, and confirm the visible part with Hannah.',
  perfectSteps:['Open INC-1060 and select Assign to me.',
    'Open Tools › Directory, search “hannah”, select Hannah Clarke. Profile shows “Pending HR change: HR records this person as Hannah Osei”.',
    'Open Tools › Mail Admin › Message trace, type “clarke” and select Search. Note the supplier invoices delivered to hannah.clarke@ today.',
    'Optional: Tools › Documentation › “Username standard”.',
    'Back in Directory › Hannah Clarke › Profile, select Edit profile…, set Display name to Hannah Osei, leave Username as hclarke, and select Save changes.',
    'Open the Email addresses tab, type hannah.osei@northstar.example and select Add address, then select Make primary on it. hannah.clarke@ is kept as an alias. Leave it there.',
    'Open Mail Admin › Mailboxes, choose Hannah’s mailbox, set “Send test to” to hannah.clarke@northstar.example and select Send test message. Expect “delivered to Hannah Osei’s mailbox”.',
    'Open Company Chat › Hannah Osei and select “INC-1060 · Ask to confirm the fix”. She confirms.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Directory Profile: Display name Hannah Osei, Username hclarke, Email hannah.osei@northstar.example; Email addresses lists hannah.clarke@ as an alias.',
    'Mail Admin: the mailbox shows “Alias delivers”.',
    'Re-run the trace for “clarke”: the supplier mail still shows Delivered (alias).',
    'Hannah’s confirmation appears in Company Chat.'],
  commonMistakes:['Renaming the username for consistency. It breaks the profile, drives and sign-in links.',
    'Removing the old address as housekeeping and silently bouncing supplier invoices.',
    'Creating a fresh account under the new name.',
    'Asking for more approval when the HR record already authorises the change. Not an error, but it wastes time.'],
  realWorldNote:'Most organisations treat the sign-in name as permanent and keep previous email addresses as aliases indefinitely, or at least for a year. Legal name changes can be sensitive (marriage, divorce, transition), so handle them promptly and discreetly, and never ask for justification beyond the HR record.',
  idealNotes:'Name change per HR-CHG-0417: Hannah Clarke to Hannah Osei. Display name updated, primary address now hannah.osei@northstar.example, old hannah.clarke@ kept as an alias (6 supplier invoices to the old address today, per trace). Username hclarke deliberately unchanged to protect the NS-FIN-024 profile and mapped drives. Test to the old address delivered via alias. User confirmed in chat.'}},

     signins:[{t:'Today 07:51', host:'Web browser', loc:'Home broadband (81.2.69.160)', app:'Web mail', result:'Success'},{t:'Fri 16:40', host:'NS-OPS-024', loc:'Northstar HQ · Floor 1', app:'Desktop sign-in', result:'Success'}]}),

 title:'Leaver offboarding: Operations coordinator finished Friday',
 desc:'Marcus Hale’s last day was Friday and his leaver form is HR-LVR-0088. Please could you close him down? Jordan needs to keep an eye on supplier emails that come to Marcus for a while. Marcus dropped his laptop at reception this morning.',
 impact:'A departed employee still has working credentials and access to Operations data and supplier contracts.',
 tried:'HR completed the leaver form. Reception has the laptop.',
 hints:['Read leaver record HR-LVR-0088 in full: it says what happens to the mailbox, the laptop and the account. Then check Marcus’s sign-in log. When did he last sign in?',
   'Order matters. Cut access first (disable and revoke sessions), then convert the mailbox to shared before you remove licences.',
   'Disable, revoke sessions, remove Operations-Share. In Mail Admin convert to shared, grant Jordan Full Access and set the auto-reply. Remove the licences, return NS-OPS-024 to the shelf, then run Test sign-in and Test access as Jordan.'],
 model:'Actioned leaver HR-LVR-0088 for Marcus Hale. He had an active web mail session from home at 07:51 today, after his leaving date, so I disabled the account and revoked both web and mobile sessions first. Removed Operations-Share. Converted the mailbox to shared, granted Jordan Price Full Access for 90 days and set HR’s auto-reply, with no forwarding. Removed the Office, Endpoint and Design licences only after the conversion, so the mailbox is kept, and kept the account for the 2-year retention. Returned laptop NS-OPS-024 (NSA-1024) to the shelf for wiping. Verified the sign-in test is blocked and Jordan can open the shared mailbox.',
 keys:['mhale','marcus','hr-lvr-0088','shared mailbox','revoke','ns-ops-024'],
 penalties:{'deleteUser:mhale':[6,'Deleted the account and mailbox: HR-LVR-0088 requires 2-year retention and Jordan loses the supplier mail']},
 obj:[O(s=>!s.users.mhale.enabled, 'Account disabled', 'Marcus’s account is still enabled'),
   O(s=>s.users.mhale.sessions.length===0, 'Active web and mobile sessions revoked', 'Marcus still has active sessions (web mail at 07:51 today)'),
   O(s=>s.users.mhale.groups.every(g=>g==='Domain Users'), 'Removed from Operations-Share', 'Marcus still has department access'),
   O(s=>{ const m=s.mail.mailboxes.mhale; return m.type==='shared' && m.perms.some(p=>p.who==='jprice' && p.right==='Full Access') && m.autoReply.on && !m.forward && !m.pendingDelete; },
     'Mailbox converted to shared, Jordan has Full Access, auto-reply on, no forwarding', 'The mailbox isn’t handled the way HR asked'),
   O(s=>s.users.mhale.licences.length===0 && !s.users.mhale.deleted, 'Licences reclaimed and the account kept for retention', 'Licences are still assigned, or the account was deleted'),
   O(s=>{ const w=s.workstations['NS-OPS-024']; return ['Returned · Pending wipe','In stock'].includes(w.state) && !w.owner; }, 'Laptop NS-OPS-024 returned to IT for wiping', 'The laptop is still recorded as Marcus’s'),
   O(s=>s.users.mhale.leaverVerified && s.mail.mailboxes.mhale.accessTests.jprice===true, 'Verified: Marcus can’t sign in and Jordan can open the mailbox', 'The offboarding hasn’t been verified')],
 guide:{
  symptomsToNotice:['Last sign-in Today 07:51 from home broadband, after employment ended. Treat this as urgent, not routine.',
    'Sessions shows two: web mail and a mobile mail app on a personal phone.',
    'HR’s form says don’t forward and don’t delete, and asks for 2-year retention.',
    'The mailbox is still a user mailbox, so removing the Office licence first would start a 30-day deletion.'],
  diagnosis:'Offboarding comes down to cutting access first, keeping data, then reclaiming resources, all to HR’s written instructions rather than habit. Directory shows Marcus signed in after he left, so the first moves are disable plus session revoke: disabling stops new sign-ins, but existing web and mobile sessions keep working until revoked. The leaver record is the authority: convert to shared (which needs no licence) so Jordan can work the supplier mail, set an auto-reply, and don’t forward, because forwarding hides the mail trail and is against the form. The trap is the order of operations: a user mailbox without an Office licence goes into 30-day deletion, so convert before you reclaim. Deleting the account destroys retained data. Finish by returning the laptop so it gets wiped and reissued, then verify both sides: the leaver is blocked and the manager has access.',
  perfectSteps:['Open INC-1061 and select Assign to me.',
    'Open Tools › Directory › Leavers › Marcus Hale (HR-LVR-0088) and read the HR instructions.',
    'Select Open account. On Authentication read the sign-in log: web mail at 07:51 today from home broadband.',
    'Select Disable account and confirm.',
    'Open the Sessions tab and select Revoke all sessions. Both sessions disappear.',
    'Open Groups and select Remove beside Operations-Share. Domain Users stays.',
    'Open Tools › Mail Admin › Mailboxes, choose Marcus’s mailbox and select Convert to shared, then Convert.',
    'Under Permissions choose Jordan Price, Full Access, expiry “90 days (Jan 10)”, and select Grant. Don’t add Send As.',
    'Under Automatic replies choose On, paste HR’s text and select Save. Leave Forwarding empty.',
    'Back in Directory › Marcus Hale › Licences, select Remove on Office Suite (Standard), Endpoint Protection and Design Studio. No deletion warning appears because the mailbox is shared.',
    'Open Tools › Asset Management, search “NS-OPS-024”, Open › Health › Return to shelf, and confirm. It becomes Returned · Pending wipe with no owner.',
    'In Directory › Marcus Hale › Authentication select Test sign-in. “Sign-in test failed: the account is disabled” is the expected result for a leaver.',
    'In Mail Admin › Marcus’s mailbox › Test access as…, choose Jordan Price and select Test access. Expect “jprice can open …”.',
    'Select Check fix, write a resolution note and select Close ticket.'],
  verify:['Authentication: Disabled, no active sessions, sign-in test failed (blocked as expected).',
    'Groups: Domain Users only.',
    'Mailbox: Type Shared, Jordan Price Full Access, automatic replies On, Forwarding None, no deletion warning.',
    'Licences: none; Licence pools gain the seats back.',
    'Asset Management: NS-OPS-024 Returned · Pending wipe, unassigned.'],
  commonMistakes:['Disabling without revoking sessions, so the leaver keeps reading mail on a phone.',
    'Deleting the account for tidiness and destroying retained mail.',
    'Removing licences first and starting a 30-day mailbox deletion.',
    'Forwarding everything to the manager instead of shared access, against HR’s instruction.',
    'Forgetting the laptop, which then sits unwiped in a drawer.'],
  realWorldNote:'Sign-ins after someone has left are a classic insider-risk signal and a common audit finding. In most cloud suites the sequence is block sign-in, revoke sessions, convert to shared, then remove licences. Shared mailboxes under the size limit need no licence. Keep the disabled account for as long as the retention policy requires.',
  idealNotes:'Leaver HR-LVR-0088 Marcus Hale (Ops). He signed in to web mail at 07:51 today after his Oct 9 leaving date, so I disabled the account and revoked 2 sessions (web mail, mobile mail app). Removed Operations-Share. Mailbox converted to shared, Full Access for Jordan Price (90 days), HR auto-reply on, no forwarding per HR. Licences removed after conversion and returned to the pools. Account kept for the 2-year policy, not deleted. NS-OPS-024 returned to the shelf, pending wipe. Verified: sign-in blocked; Jordan can open the shared mailbox.'}},

{ref:'INC-1062', shift:3, pri:'high', cat:'Security / MFA reset', req:'jprice', asset:'NSM-0098', assetType:'Company phone (Pixelon 7a)', created:'07:38',
 intake:{via:'voicemail', from:'jprice', callerId:'+1 555-0418 (not on record)', dur:'0:31',
   text:'Hi, it’s Jordan Price from Operations. I lost my phone on the tram last night, so the authenticator app’s gone and I can’t get into anything that asks for approval. Can someone reset my MFA? Call me back on 555-0418. It’s my partner’s phone, mine’s gone. Cheers.'},
 arrive:s=>{ const u=s.users.jprice; u.presence='away';
   u.verifyFail=['code-mobile','manager'];
   u.verifyText={'code-mobile':`No response. The code went to ${u.mobile}, the phone that was lost.`,
     'callback-record':'You called Jordan’s desk extension on record (x3520). He answered and quoted employee ID E35201, which matches Directory. Verified.',
     'callback-given':'Someone answered at 555-0418 and said they were Jordan, but that number isn’t on his record, so it proves nothing.',
     'manager':'Dana Okafor replied in chat that she is in back-to-back meetings and can’t vouch for anyone today. Not verified.'};
   u.sessions.push({id:'jp-mob', device:'NSM-0098 (Pixelon 7a)', app:'Mobile mail app', loc:'Mobile network', t:'Oct 2'});
   const m=s.mail.mobiles.find(x=>x.id==='mob3'); if (m) m.lastSync='Yesterday 18:02'; },
 title:'Voicemail: lost phone, can’t approve sign-ins',
 desc:'I lost my phone on the tram last night, so the authenticator app’s gone and I can’t get into anything that asks for approval. Can someone reset my MFA? Call me back on 555-0418. It’s my partner’s phone, mine’s gone.',
 impact:'An operations lead can’t reach MFA-protected apps. A lost company phone may still have mail synced on it.',
 tried:'Tried signing in on the web and got stuck at the approval prompt.',
 hints:['A voicemail proves nothing about who called. Compare the callback number with Jordan’s record in Directory before you change his account.',
   'A code to the registered phone can’t work: that phone is lost. Use a callback to a number that was already on his record.',
   'Verify identity… › Callback to number on record (his desk extension). Then Reset MFA…, set phone NSM-0098 to Lost/Stolen, revoke its session, and ask Jordan in Company Chat to re-enrol and confirm.'],
 model:'Received a voicemail asking for an MFA reset from an off-record number (555-0418) and didn’t call it. Called Jordan on his desk extension on record (x3520); he gave employee ID E35201, which matches Directory. After verifying, reset his MFA, marked company phone NSM-0098 Lost/Stolen and revoked its mail session. Jordan re-enrolled the authenticator on his replacement phone and confirmed in Company Chat that he can sign in.',
 keys:['jprice','jordan','callback','nsm-0098','mfa','e35201'],
 penalties:{'resetMfa:jprice':[5,'Removed a security factor for a caller who wasn’t verified through a number on record', s=>s.users.jprice.verified!=='callback-record']},
 chatConfirm:{user:'jprice', ok:s=>s.users.jprice.mfaResetBy==='callback-record', ask:'I’ve reset your MFA. Could you sign in on your replacement phone, set up the authenticator again and tell me when you’re in?',
   yes:'Done. Authenticator set up on the new phone and I’m signed in. Thanks for calling me on my desk line.', no:'It still asks me to approve on my old phone, so I can’t get in.',
   onYes:s=>{ const u=s.users.jprice; u.mfa=true; u.mfaReenrolled=true; }},
 obj:[O(s=>s.users.jprice.verified==='callback-record' || s.users.jprice.mfaResetBy==='callback-record', 'Identity verified by calling back a number on record', 'Jordan’s identity hasn’t been verified through a trusted channel'),
   O(s=>s.users.jprice.mfaResetBy==='callback-record', 'MFA reset after verification', 'Jordan’s MFA is still tied to the lost phone, or was reset before he was verified'),
   O(s=>{ const m=s.mail.mobiles.find(x=>x.id==='mob3'); return m.assetState==='Lost/Stolen' && !s.users.jprice.sessions.some(x=>/NSM-0098/.test(x.device)); }, 'Lost phone NSM-0098 marked Lost/Stolen and its session revoked', 'The lost phone is still trusted and signed in'),
   O(s=>s.users.jprice.mfaReenrolled && s.chat.confirmed['INC-1062']==='jprice', 'Jordan re-enrolled MFA and confirmed he can sign in', 'Jordan hasn’t confirmed re-enrolment')],
 guide:{
  symptomsToNotice:['A voicemail is not proof of identity. Anyone can say “it’s Jordan”.',
    'The callback number in the message (555-0418) differs from the mobile on record. The caller explains why, but you still can’t trust it.',
    'The registered phone is the lost device, so a code sent to it proves nothing and reaches no one.',
    'A company phone is lost with an active mail session: that is a data exposure, separate from the access problem.'],
  diagnosis:'An MFA reset removes a security factor, so it is one of the riskiest service-desk actions and a favourite target of social engineers. The request came through an unauthenticated channel (voicemail) with a new callback number, which is exactly the pattern attackers use. It sounds plausible, and that is the point: plausible is not verified. Directory › Profile lists his mobile and his desk extension x3520. The only trusted channels are ones already on record before the request. The mobile is lost, so the desk extension is the right callback (his manager can’t vouch today). Once identity is confirmed, reset MFA so Jordan re-enrols, and separately contain the lost device: mark it Lost/Stolen and revoke its session so mail stops syncing to a phone on a tram. Verify with Jordan’s own confirmation after he re-enrols.',
  perfectSteps:['Open Voicemails and read the 07:38 message from Jordan Price. Select Log as ticket, then Save to INC-1062 so the transcript is on the ticket.',
    'Open INC-1062 and select Assign to me.',
    'Open Tools › Directory, search “jordan”, select Jordan Price. On Profile note the Mobile, Ext. 3520 and Employee ID. The voicemail number doesn’t match.',
    'Select Verify identity…, choose “Callback to number on record” and select Run check. The flash confirms Jordan quoted his employee ID.',
    'On Authentication select Reset MFA… and confirm.',
    'Open Sessions and select Revoke beside NSM-0098 (Pixelon 7a) · Mobile mail app.',
    'Open Tools › Asset Management › Mobiles and set the state of NSM-0098 to Lost/Stolen. Optional: Queue remote wipe.',
    'Open Company Chat › Jordan Price and select “INC-1062 · Ask to confirm the fix”. Jordan re-enrols and confirms he can sign in.',
    'Select Check fix, write a resolution note (include the verification method) and select Close ticket.'],
  verify:['Directory › Authentication: Identity check “Callback to number on record”, MFA Enrolled again after Jordan’s confirmation.',
    'Sessions: no session from NSM-0098.',
    'Asset Management › Mobiles: NSM-0098 is Lost/Stolen.',
    'Company Chat shows Jordan’s confirmation, and the notes record how he was verified.'],
  commonMistakes:['Calling the number from the voicemail and treating whoever answers as verified.',
    'Resetting MFA first and planning to verify later.',
    'Sending a code to the lost phone and waiting.',
    'Fixing access but forgetting that the lost phone still syncs company mail.',
    'Not recording which verification method was used.'],
  realWorldNote:'Help-desk MFA resets after a phone call were the way in for several well-known breaches: attackers research the target, then phone the service desk claiming a lost phone. Mature desks require verification through a channel already on record (a call back to a known number, manager confirmation, in-person ID or a video check) and log the method on the ticket.',
  idealNotes:'Voicemail 07:38 asked for an MFA reset and gave callback 555-0418, which is NOT on record; I didn’t use it. Verified Jordan by calling his desk extension x3520 on record; he gave employee ID E35201, which matches Directory. Then reset MFA. Lost company phone NSM-0098 marked Lost/Stolen and its mail session revoked. Jordan re-enrolled on his replacement phone and confirmed sign-in in chat. Voicemail saved to the ticket.'}},

 guide:{
  symptomsToNotice:['The requester cites approval from his line manager, who doesn’t own the mailbox.',
    'Mail Admin › Shared mailboxes › Sales Orders lists an Owner (Rosa Delgado) and an access policy that asks for her written approval.',
    'The cover is temporary (next week), so the access should be time-boxed.',
    'Order confirmations go to customers, so Send As matters.'],
  diagnosis:'Nothing is broken; the job is to apply access control correctly. Mail Admin › Shared mailboxes › Sales Orders shows the owner is Rosa Delgado and the policy needs her written approval. A line manager vouching for an employee is not the same as the data owner authorising access to their data. Get the approval in Company Chat, where it is written and attributable, and grant only what was approved: Full Access (read and manage), no Send As, ending on the approved date. Then verify from the user’s side.',
  perfectSteps:['Open INC-1064 and select Assign to me.',
    'Open Tools › Mail Admin › Shared mailboxes and select Open on Sales Orders. Note Owner: Rosa Delgado, the access policy, and the current permissions (Nina: Full Access + Send As; Rosa: Full Access).',
    'Optional: Tools › Directory › Evan Brooks › Profile shows Manager: Dana Okafor, who isn’t the owner.',
    'Open Company Chat › Rosa Delgado and select “INC-1064 · Ask Rosa to approve Evan’s access to Sales Orders”. Rosa approves read and manage only, until Fri Oct 23, and no Send As.',
    'Back in Mail Admin › Shared mailboxes › Sales Orders › Permissions: choose Evan Brooks, Full Access, expiry “Fri Oct 23”, and select Grant. The row shows Owner approved. Don’t add Send As.',
    'Under Test access as…, choose Evan Brooks and select Test access. Expect “ebrooks can open sales-orders@northstar.example”.',
    'Open Company Chat › Evan Brooks and select “INC-1064 · Ask to confirm the fix”. Evan confirms the mailbox appears in Outlook.',
    'Select Check fix, write a note that quotes Rosa’s approval, and select Close ticket.'],
  verify:['Sales Orders › Permissions shows Evan Brooks: Full Access, expires 2026-10-23, Owner approved, and no Send As row.',
    'Test access shows Evan Brooks: Can open.',
    'Company Chat holds Rosa’s approval text and Evan’s confirmation.'],
  commonMistakes:['Accepting “my manager said it’s OK” as approval.',
    'Ticking Send As because it is next to Full Access.',
    'Granting open-ended access for a one-week cover.',
    'Not recording the approval in the ticket notes, which leaves nothing for an audit.'],
  realWorldNote:'Shared mailbox access is a frequent audit finding because grants are rarely removed. Recording the owner’s approval and setting an expiry keeps permissions from piling up. Send As matters because messages appear to come from the team or company and can be used for fraud.',
  idealNotes:'Request for Sales Orders (sales-orders@) access to cover for Nina next week. Policy requires owner approval; the owner is Rosa Delgado (Dana, Evan’s manager, deferred to Rosa). Rosa approved in Company Chat: “read and manage only, until Fri Oct 23. No Send As.” Granted Evan Full Access expiring 2026-10-23, no Send As. Tested access as Evan (can open); Evan confirmed in chat.'}},

{ref:'INC-1067', shift:2, pri:'medium', cat:'Network / DHCP', req:'lferreira', asset:'NS-FIN-031', assetType:'Northbook 14 laptop (new)', created:'09:05',
 intake:{via:'chat', from:'lferreira', text:['Hi! It’s my first day. My new laptop is connected to Northstar-Staff but the icon says “No internet” and Outlook won’t load.','Maya’s laptop right next to me works fine. Is something wrong with my account?']},
 arrive:s=>{ addPerson(s, user('lferreira','Lucia Ferreira','Finance','Financial Analyst',2,'4436','NS-FIN-031',['Finance-Share'],{manager:'Rafael Ortiz', startDate:'Today', lastSignIn:'Today 08:58 (cached sign-in)'}),
     ws('NS-FIN-031','lferreira',2,'NSA-2031','NB14-56304',{image:'Northstar Finance 24.2', ip:{mode:'apipa', addr:null}}), mbx(0.1,'Finance (7 years)'));
   const guests=Array.from({length:31},(_,i)=>({client:'EVT-WS-'+String(i+1).padStart(2,'0'), mac:'7A:11:E0:'+(16+i).toString(16).toUpperCase()+':4C:'+(40+i*3).toString(16).toUpperCase(), seen:'Yesterday 17:05 · partner workshop guest', active:false}));
   Object.assign(scopeF2(s), {range:'10.0.2.100 – 10.0.2.149', size:50, leaseH:192, leases:mkLeases(2,19,0).concat(guests)});
   s.net.servers.DC01.events.unshift({t:'08:58', level:'Warning', source:'DHCP Server', id:1020, text:'Scope 10.0.2.0 (Floor 2) is 100 percent full with only 0 IP addresses remaining.'}); },
 title:'New laptop on Floor 2 says “No internet”',
 desc:'Hi! It’s my first day. My new laptop is connected to Northstar-Staff but the icon says “No internet” and Outlook won’t load. Maya’s laptop right next to me works fine. Is something wrong with my account?',
 impact:'A new starter can’t work on her first day. Any other new device on Floor 2 will fail the same way.',
 tried:'Turned Wi-Fi off and on, restarted the laptop and signed in again.',
 hints:['Her account isn’t the problem. A device that can’t get an address can’t reach anything. Check what address the laptop has.',
   'Remote into NS-FIN-031 and run ipconfig. A 169.254.x.x address means DHCP gave it nothing. Then look at the Floor 2 scope in Server Room › DHCP.',
   'Delete only the inactive EVT-WS leases from yesterday’s workshop, set the lease duration to 8 hours, then run ipconfig /renew and ping 10.0.0.1 on NS-FIN-031.'],
 model:'The account was fine; the device was the issue. NS-FIN-031 had a 169.254 self-assigned address, so DHCP wasn’t answering it. DC01 event 1020 showed the Floor 2 scope 100% full: 31 of its 50 leases belonged to EVT-WS guest devices from yesterday’s partner workshop, held by an 8-day lease. Deleted only the inactive leases, cut the lease to 8 hours, renewed the lease on NS-FIN-031 (now 10.0.2.1xx) and confirmed the gateway replies. Told Lucia she’s set.',
 keys:['ns-fin-031','169.254','apipa','evt-ws','lease','dhcp'],
 penalties:{'dhcp:f2':[4,'Deleted every Floor 2 lease: 19 working colleagues dropped off and had to renew', (s,a)=>a[1]==='purgeAll'],
   'dhcp:f2#range':[4,'Widened the Floor 2 scope over fixed addresses: PRN-F2-01 (10.0.2.50) now clashes', (s,a)=>a[1]==='range' && Number(a[2])>150],
   'reboot:sw2':[3,'Rebooted the Floor 2 switch: the whole floor dropped and the scope was still full'],
   'off:sw2':[3,'Powered off the Floor 2 switch: the whole floor dropped and the scope was still full']},
 obj:[O(s=>{ const sc=scopeF2(s); return sc.leases.length<sc.size && sc.size<=150; }, 'Floor 2 scope has free addresses and doesn’t overlap fixed devices', 'The Floor 2 scope is still full, or now overlaps fixed devices'),
   O(s=>scopeF2(s).leaseH<=24, 'Floor 2 lease time is a day or less', 'Floor 2 leases still last 8 days, so guest devices will fill it again'),
   O(s=>s.workstations['NS-FIN-031'].ip.mode==='dhcp', 'NS-FIN-031 has a 10.0.2.x lease', 'NS-FIN-031 still has a 169.254 self-assigned address'),
   O(s=>s.workstations['NS-FIN-031'].netOk===true && s.workstations['NS-FIN-031'].ip.mode==='dhcp', 'Connectivity tested from NS-FIN-031', 'Connectivity hasn’t been tested from Lucia’s laptop')],
 guide:{
  symptomsToNotice:['Only a brand-new device fails. The colleague at the next desk works, so the floor network is fine.',
    '“No internet” while connected to the right Wi-Fi means the link works but IP configuration failed.',
    'The requester suspects her account, but she signed in with cached credentials. Don’t chase the account.'],
  diagnosis:'A Windows device that gets no DHCP answer gives itself a 169.254.x.x (APIPA) address. When you see one, stop looking at accounts and Wi-Fi profiles and look at DHCP. The DHCP Server service is running (restarting it changes nothing), so ask whether it has an address to give. The Floor 2 scope is small (50 addresses) and shows 50 / 50 in use. Its lease list explains why: 31 EVT-WS devices from a one-day workshop still hold addresses because the lease lasts 8 days. Existing colleagues keep working because they already hold leases; only new devices are refused. The safe fix removes only the stale leases, and a shorter lease stops it happening again. Wiping every lease, or widening the range carelessly, creates conflicts.',
  perfectSteps:['Open the chat from Lucia (dashboard › Incoming contacts › Open chat) and select Log as INC-1067. Open the ticket and select Assign to me.',
    'Open Tools › Remote Desktop, search “NS-FIN-031” and select Connect, then Connect in the dialog. The status bar reads “Self-assigned 169.254 address (no DHCP lease)”.',
    'Open Terminal and run ipconfig. Note the 169.254.x.x (Autoconfiguration) address and the empty Default Gateway.',
    'Run ping 10.0.0.1. It fails with “General failure”, which confirms there’s no usable address.',
    'Open Tools › Server Room › Servers, select Services on DC01: DHCP Server is Running. Select “Event log & scheduled tasks” and read event 1020: the Floor 2 scope is 100% full.',
    'Open the DHCP tab. Floor 2 shows 50 / 50 in use, lease 8 days. Select View leases: 31 EVT-WS-xx leases last seen yesterday at 17:05, Inactive.',
    'Select Delete inactive leases (not Delete all leases). Floor 2 now shows 19 / 50 in use.',
    'In the lease duration list choose 8 hours and select Set lease duration.',
    'Leave the range alone. If you ever widen it, use “100 addresses (.100–.199)”, never the .20–.219 range that covers the printer at 10.0.2.50.',
    'Back in Remote Desktop › NS-FIN-031 › Terminal, run ipconfig /renew. It returns a 10.0.2.1xx address with gateway 10.0.0.1.',
    'Run ping 10.0.0.1 and expect replies. This sets the connectivity requirement.',
    'Optional: tell Lucia in Company Chat that she’s connected. Select Check fix, write notes and select Close ticket.'],
  verify:['Server Room › DHCP › Floor 2 shows free addresses (for example 20 / 50 in use) and a lease of 8 hours.',
    'ipconfig on NS-FIN-031 shows a 10.0.2.x address and gateway 10.0.0.1.',
    'ping 10.0.0.1 replies from NS-FIN-031.',
    'All four requirements are ticked.'],
  commonMistakes:['Resetting the new starter’s password or checking her groups: an identity rabbit hole.',
    'Deleting every lease, which knocks 19 working people off the network.',
    'Widening the range into the fixed-address block where printers and switches live.',
    'Fixing the scope but not renewing on the laptop. A 169.254 address doesn’t heal instantly.',
    'Not shortening the lease, so the next event fills the scope again.'],
  realWorldNote:'Guest and event devices belong on a guest network with its own short-lease scope, never the staff scope. Set DHCP alerts at about 80% use, and keep fixed devices (printers, switches, access points) in an excluded range or reservation so a range change can’t collide with them.',
  idealNotes:'NS-FIN-031 (new starter lferreira) had a 169.254 APIPA address, so DHCP wasn’t answering. DC01 DHCP Server was running, but event 1020 showed the Floor 2 scope (10.0.2.100–149) 100% full: 31 of 50 leases were EVT-WS guest devices from yesterday’s workshop, kept by an 8-day lease. Deleted only the inactive leases (19 / 50 in use) and set the lease to 8 hours. Verified: ipconfig /renew gave 10.0.2.1xx and ping 10.0.0.1 replies. Recommend a guest network for future events.'}},

 title:'New phone won’t sync company email',
 desc:'Hey, I got my new phone yesterday. The mail app says “Your administrator must approve this device before it can sync,” and the calendar is empty too. I’m out at a client from 2pm, so it’d be great to have it working before then.',
 impact:'One user has no mobile email or calendar on the road. Desktop email works.',

 model:'Mail Admin showed two quarantined requests from Talia’s new phone with the same Device ID (NSD-7Q4K-A7F3). One used Northstar Mail, the approved app; the other used MailSync Pro, which isn’t approved and relays mail through a vendor cloud. Confirmed the Device ID with Talia in chat, approved the Northstar Mail partnership, blocked MailSync Pro and asked her to uninstall it. She confirmed the old Aster X2 was traded in, so I removed its mail partnership (no full wipe on a phone we no longer control). Test sync passed and Talia confirmed mail and calendar arrived.',
 keys:['treyes','talia','nsd-7q4k-a7f3','mailsync','quarantine','partnership'],

   'mobileAct:mob12':[3,'Sent a full wipe to a traded-in phone that now belongs to someone else', (s,a)=>a[1]==='wipe'],
   'setQuarantine:false':[5,'Turned off mobile quarantine for every user to fix one phone']},
 chatActions:[
   {id:'tr-devid', user:'treyes', label:'INC-1071 · Ask Talia for the new phone’s Device ID', ask:'Could you open Settings › About on the new phone and read me the Device ID?',
    reply:'Settings › About says Device ID NSD-7Q4K-A7F3. Oh, and I tried some other app first, MailSync something, before I found Northstar Mail.', set:s=>{ s.chat.facts.treyesDevice=true; }},

    reply:'I traded it in at the phone shop on Saturday. They reset it in front of me.', set:s=>{ s.chat.facts.treyesOld=true; }}],
 chatConfirm:{user:'treyes', ok:s=>mobile(s,'mob10').state==='Allowed' && mobile(s,'mob10').syncOk, ask:'Your new phone is approved. Can you check mail and calendar are there now?',
   yes:'Mail and calendar are there now, perfect! I’ve deleted that MailSync app too.', no:'Still nothing on the phone. It says it’s waiting for approval.'},
 obj:[O(s=>!!s.chat.facts.treyesDevice, 'Device ID confirmed with Talia', 'The new phone’s Device ID hasn’t been confirmed with Talia'),
   O(s=>mobile(s,'mob10').state==='Allowed', 'New phone’s Northstar Mail access approved', 'Talia’s new phone is still waiting for approval'),
   O(s=>mobile(s,'mob11').state==='Blocked', 'Unapproved MailSync Pro access blocked', 'The MailSync Pro request is still waiting or allowed'),
   O(s=>['Removed','Account wipe pending'].includes(mobile(s,'mob12').state), 'Old phone’s mail access removed', 'The traded-in phone still has mail access'),
   O(s=>mobile(s,'mob10').syncOk && s.chat.confirmed['INC-1071']==='treyes', 'Sync tested and Talia confirmed mail and calendar arrived', 'Mail sync hasn’t been confirmed on the new phone')],
 guide:{
  symptomsToNotice:['The error names the cause: admin approval (quarantine), not a password or server problem.',
    'There are two waiting requests with the same Device ID but different apps.',
    'The old phone is still listed as Allowed, which is a lingering access path.'],
  diagnosis:'The mobile access policy quarantines new devices until IT approves them. The question isn’t whether to approve, but what exactly to approve. Two requests share one Device ID, so they’re the same phone using two different apps. Policy allows only Northstar Mail; MailSync Pro would put the user’s credentials in someone else’s cloud. Before approving anything, prove the phone is Talia’s by matching the Device ID she reads off her own handset. While you’re there, clean up the old phone. It was traded in, so remove the partnership instead of sending a full wipe to hardware nobody here controls. Finish by confirming sync works.',
  perfectSteps:['Open the chat from Talia (dashboard › Incoming contacts › Open chat) and select Log as INC-1071. Open the ticket and select Assign to me.',
    'Open Tools › Mail Admin › Mobile devices. Read Talia Reyes’s three rows: Aster X5 · Northstar Mail 6.1 (Quarantined, NSD-7Q4K-A7F3), Aster X5 · MailSync Pro 3.4 (Quarantined, same ID, “Not on the approved list”), Aster X2 · Northstar Mail 5.8 (Allowed, last sync Oct 10).',
    'Open Company Chat › Talia Reyes and select “INC-1071 · Ask Talia for the new phone’s Device ID”. She reads NSD-7Q4K-A7F3 and mentions trying MailSync first.',
    'In Mail Admin › Mobile devices select Approve on the Northstar Mail 6.1 row.',
    'Select Block on the MailSync Pro 3.4 row.',
    'In Company Chat select “INC-1071 · Ask Talia what happened to her old phone”. She traded it in and the shop reset it.',
    'Select Remove partnership on the Aster X2 row. Don’t use Remote wipe.',
    'Select Test sync on the Northstar Mail 6.1 row. Expect “sync test passed”.',
    'In Company Chat select “INC-1071 · Ask to confirm the fix”. Talia confirms mail and calendar.',
    'Select Check fix, write notes and select Close ticket.'],
  verify:['Northstar Mail 6.1 shows Allowed with “test OK”.',
    'MailSync Pro 3.4 shows Blocked and the Aster X2 shows Removed.',
    'Talia confirms in Company Chat that mail and calendar arrived.',
    'All five requirements are ticked.'],
  commonMistakes:['Approving both waiting requests to “make it work”.',
    'Turning off quarantine for everyone to fix one user.',
    'Approving without checking the Device ID with the user.',
    'Full-wiping a traded-in phone, which may now belong to someone else.',
    'Leaving the old phone’s partnership active.'],
  realWorldNote:'Mobile quarantine and approved-app lists are a standard data-protection control in mail systems and MDM. When someone gets a new phone, retire the old partnership in the same visit. Use an account-only (selective) wipe for personal or traded devices, and keep the full wipe for company-owned devices that are lost or stolen.',
  idealNotes:'Talia’s new Aster X5 (Device ID NSD-7Q4K-A7F3, confirmed by Talia in chat) had two quarantined requests: Northstar Mail (approved app) and MailSync Pro (not approved, third-party cloud relay). Approved Northstar Mail, blocked MailSync Pro and asked her to uninstall it. Old Aster X2 (NSD-2M9P-41C0) was traded in, so I removed the partnership (no full wipe). Verified: test sync passed and Talia confirmed mail and calendar in chat.'}},
