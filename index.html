    'Keep “User must change password at next sign-in” ticked.',
    'Under “Deliver the temporary password” keep “Read to user on a verified call” unless the ticket’s process says otherwise. A starter whose manager is meeting them can use “Company Chat to their manager” (INC-1059). Never use “Personal email on file”.',
    'Select Reset password. If Lockout still reads Locked, select Unlock account too.',
    'Select Test sign-in.'],
  verify:['Password reads Current with the chip “Must change at next sign-in”, and the reset line names the delivery route.','Test sign-in passes with “They’ll be asked to choose a new password.”'],
  escalate:['You can’t verify the caller through any number or code on record: don’t reset. Ask their manager to raise it, or escalate to Security if the caller pushes.','Several resets on the same account in one day, or someone requesting a reset on an executive’s behalf: escalate to Security.']},

 {id:'kb3', cat:'Identity', title:'Share access denied: group membership', tools:['Directory','Remote Desktop'], rel:['INC-1044','INC-1053'],
  purpose:'Give someone access to a shared drive through the group the share trusts, granting no more than their role needs.',
  prereq:['Sign-in works (Authentication shows Enabled and Not locked).','You know which group the share needs, and the access matches the person’s role or role template.'],
  steps:['Directory › person › Groups: compare their groups with the group the share needs (for example Finance-Share for \\\\FILE01\\Finance).',
    'Choose the missing group in “Add to group” and select Add. Add only that group.',
    'A warning reads “Group changes apply after … signs in again”. Select “Ask user to sign out & back in”.',
    'Verify from the user’s PC: Remote Desktop › Connect › File Explorer › Open on the share’s drive letter.'],
  verify:['The warning has gone and File Explorer reads “Opened \\\\FILE01\\…”.'],
  escalate:['The person needs a group their role doesn’t include: get the data owner’s or manager’s approval in writing first.','The share fails for everyone in the group: it’s a server problem (see “File server volume full”, or check FILE01’s services).']},

 {id:'kb4', cat:'Network', title:'Triaging a floor-wide outage', tools:['Server Room','Remote Desktop'], rel:['INC-1045'],
  purpose:'Find and restore the one shared network device behind an outage that affects a single floor.',
  prereq:['You know the scope: which floors or groups of people are affected and which still work.'],
  steps:['Scope first: one user, one floor, or the whole office?',
    'Open Tools › Server Room › Overview and read Devices and Device status.',
    'Open Topology and follow the path from Internet › MetroFiber ISP › Edge Router › Main Firewall down to the affected floor.',
    'If the other floors work, the ISP, edge router and firewall are fine. Don’t reboot or power them off.',
    'Select the narrowest failed device (usually that floor’s switch) and select Power on, or Reboot if it’s online but misbehaving.',
    'Confirm hosts on that floor are reachable again in Remote Desktop.'],
  verify:['Topology shows every box green and the dashboard reads Floor switches 3/3 online.','Hosts on the floor show Online in Remote Desktop.'],
  escalate:['The device won’t come back, or drops again: send it to the network team or Facilities (power, UPS, hardware).','More than one floor or the core is down: treat it as a major incident and tell the service desk manager.']},

 {id:'kb5', cat:'Network', title:'Fixing a broken Wi-Fi profile', tools:['Remote Desktop'], rel:['INC-1046'],
  purpose:'Get one laptop back on the staff Wi-Fi when its saved network profile is corrupt.',
  prereq:['Other people in the same area are connected, so the access points are healthy.','The laptop appears in Remote Desktop.'],
  steps:['Open Tools › Remote Desktop, search the hostname, select Connect and confirm.',
    'Open Network & Wi-Fi and read Saved networks. A profile reading “Can’t connect: saved security settings don’t match the network” is broken.',
    'Select Forget on that profile.',
    'Under Available networks select Connect on Northstar-Staff. Northstar-Guest gives internet only, with no access to company drives.',
    'Open Terminal and run ping 10.0.0.1.'],
  verify:['Status reads connected to Northstar-Staff · On the office network.','ping 10.0.0.1 returns 3 replies.'],
  escalate:['Several laptops drop at once, or the profile breaks again after a fresh connect: suspect the access points or a driver and pass it to the network team.']},

 {id:'kb6', cat:'Email', title:'Finding and releasing quarantined mail', tools:['Mail Admin','Mail Security'], rel:['INC-1047'],
  purpose:'Find an expected message that never arrived, and release it only if it is legitimate.',
  prereq:['You know the recipient and roughly when the message was sent.'],
  steps:['Open Tools › Mail Admin › Message trace, type the recipient (for example priya.shah) and select Search.',
    'Status Quarantined means the content filter is holding the message. Read the reason under the subject.',
    'Open Tools › Mail Security › Quarantine. Check the sender, recipient, subject, reason and score on every row.',
    'Select Release only on legitimate business mail the user expects (a low-scoring policy hold from a known supplier).',
    'Phishing or malware stays held: select Keep blocked or Report to Security, never Release.',
    'Run the Message trace search again.'],
  verify:['The trace shows the message as Delivered (“Released from quarantine and delivered to inbox”).'],
  escalate:['The user insists on a message scored as phishing: don’t release it; send it to Security.','The same supplier is held repeatedly: ask Security to review the policy or allow-list the sender.']},

 {id:'kb7', cat:'Email', title:'Mailbox over quota', tools:['Mail Admin'], rel:['INC-1048'],
  purpose:'Restore mail delivery to a mailbox that has reached its storage quota, using an approved remedy.',
  prereq:['Sign-in to webmail works (so it isn’t an identity problem).','You know the mailbox’s retention policy.'],
  steps:['Mail Admin › Message trace for the address: bounces read 550 5.2.2 Recipient mailbox full.',
    'Open Mail Admin › Mailboxes and choose the mailbox. Read Storage, Delivery and Online archive.',
    'Preferred: select Enable online archive. Older items move out and the mailbox drops to under half its size.',
    'Alternative for executives: choose “10 GB (approved for executives)” in Quota and select Apply quota. 50 GB is for shared mailboxes only.',
    'Under “Send test to” keep the primary address and select Send test message.',
    'Tell the user that senders whose mail bounced need to send it again.'],
  verify:['Delivery reads Receiving and “Last test delivered” appears.'],
  escalate:['The archive is already enabled and the mailbox is still full at 10 GB: raise it with the messaging team rather than deleting mail under retention.']},

 {id:'kb8', cat:'Security', title:'Suspicious inbox forwarding rules', tools:['Mail Admin','Directory'], rel:['INC-1049'],
  purpose:'Recognise a forwarding rule that points to a mailbox compromise and preserve it for Security.',
  prereq:['The ticket mentions disappearing mail, unknown forwarding, or Directory › Mailbox warns that a rule forwards outside the organization.'],
  steps:['Open Tools › Mail Admin › Inbox rules and choose the mailbox.',
    'A rule tagged “Forwards outside org” is a compromise indicator, especially with a hidden name such as “.”.',
    'Select View details and note the name, condition, action, target address and Created time and source.',
    'Optional: Message trace for the user shows copies forwarded by the rule.',
    'Don’t select Delete: the rule is evidence, and deleting it doesn’t remove the attacker’s access.',
    'Follow “Escalating to Security with evidence”.'],
  verify:['The rule still exists, inspected, and the ticket is escalated with the details in the evidence box.'],
  escalate:['Always: any rule forwarding outside the company that the user didn’t create goes to Security.']},

 {id:'kb9', cat:'Server', title:'Print jobs stuck for everyone', tools:['Server Room'], rel:['INC-1050'],
  purpose:'Restore office-wide printing when every queue is stuck.',
  prereq:['The fault affects every printer or model, not a single device.'],
  steps:['Open Tools › Server Room › Servers. A Degraded print server points to a stopped service.',
    'Select Services on PRINT01 and read each service.',
    'Optional: select “Event log & scheduled tasks” and read the error (7031 means the service crashed).',
    'Select Start next to Print Spooler. Avoid a full server Reboot when one service is down.',
    'Select Send test page on the PRINT01 row.'],
  verify:['PRINT01 reads Healthy and the test page prints.','Dashboard › Service health shows Printing Healthy.'],
  escalate:['The spooler stops again soon after starting: a bad driver or job is crashing it. Send it to the server team with the event IDs.']},

 {id:'kb10', cat:'Network', title:'VPN profile invalid', tools:['Remote Desktop'], rel:['INC-1051'],
  purpose:'Reconnect a remote worker whose VPN client still uses a retired profile.',
  prereq:['The user’s ordinary internet works.','Their account can sign in (an expired or locked account fails even with the VPN up).'],
  steps:['Remote Desktop › Connect to the laptop. The session bar reads “Off-site — VPN not connected”.',
    'Open VPN Client. Northstar-Legacy points to a retired gateway.',
    'Choose Northstar-Staff in Connection profile, then select Connect.',
    'Open File Explorer and Open a mapped drive, or run ping file01 in Terminal.'],
  verify:['VPN Client reads Connected and the drive opens (“Opened \\\\FILE01\\…”).'],
  escalate:['Northstar-Staff also fails for several remote users: the VPN gateway is down; tell the network team.']},

 {id:'kb11', cat:'Identity', title:'Username standard', tools:['Directory','Documentation'], rel:['INC-1059','INC-1060'],
  purpose:'Give every person one predictable, permanent username and keep sign-ins stable through name changes.',
  prereq:['You have the person’s legal first and last name from HR.'],
  steps:['Usernames are the first initial plus the surname, lowercase, with no spaces or accents: Maya Chen becomes mchen.',
    'If that username is taken, add the middle initial (mjchen). If there is no middle initial, add the next letter of the first name (machen).',
    'Never reuse a leaver’s username, even if the account is disabled or in the recycle bin.',
    'The email address is first.last@northstar.example and is generated from the display name when the account is created.',
    'Don’t rename a username for a name change. Change the display name, add the new email address as an alias, make it primary and keep the old one.'],
  verify:['Create user shows the username hint in green (“… is available”).'],
  escalate:['Two people would end up with the same username and display name: ask HR how they want them told apart before creating the account.']},

 {id:'kb12', cat:'Hardware', title:'Deploying a computer from the PC Shelf', tools:['PC Shelf','Computer Deployment','Asset Management'], rel:['INC-1052','INC-1053','INC-1054','INC-1059'],
  purpose:'Build and hand over a clean, correctly imaged device to the right person.',
  prereq:['You know who it’s for, their role (which decides the image) and where they sit or work.','A domain controller is running (domain join needs one).'],
  steps:['Open Tools › PC Shelf › Devices. Pick an Available device that reads Wiped. A Reserved device belongs to someone else’s request unless it’s reserved for this person.',
    'Never deploy a device that reads Not wiped: wipe it first (Wipe) or pick another.',
    'Open Tools › Computer Deployment. Set Device, Build profile / image (matching the role: Finance, Sales Mobile, Standard Office…), Assign to and Location.',
    'If a “Check before deploying” warning appears, stop and read it. “Deploy anyway” is almost never right.',
    'Select Run deployment and read the five stages: image, domain join, apps, encryption, hand-over.',
    'Open Asset Management to see the new host record (owner, image, location, state In use).',
    'Deal with the old device: Return to shelf, retire it, or send a return label if the person is remote.'],
  verify:['Last job shows five green stages.','Asset Management shows the new host owned by the right person with the right image.'],
  escalate:['A stage fails (for example domain join because a domain controller is down): fix that first or pass it to the server team.','No suitable clean spare is available: tell the manager and order one; don’t take a reserved device.']},

 {id:'kb13', cat:'Hardware', title:'Replacing a remote worker’s laptop', tools:['Remote Desktop','Asset Management','Directory','Ship Manager','Company Chat'], rel:['INC-1054'],
  purpose:'Get a working replacement to someone working from home, ship to the right address and recover the damaged device for repair.',
  prereq:['You’ve confirmed it’s a hardware fault (Device Manager shows Error with a code that a driver reinstall won’t clear).','You know the warranty and accidental-damage cover from Asset Management › Details.'],
  steps:['Remote Desktop › Device Manager: note the failing device and its code (for example Code 43 on the internal display).',
    'Asset Management › Open › Details: warranty and Accidental damage cover decide repair rather than scrap.',
    'Directory › person › Profile: read the home address and when HR last updated it.',
    'Deploy a spare with the person’s role image and Location Remote (home) (see “Deploying a computer from the PC Shelf”).',
    'Ship Manager: Type Outbound to a person, Item the new host, Recipient the person, Address from Directory (HR record). If the preview warns that the saved address book differs, trust Directory. Select Create shipment.',
    'Ship Manager: Type Return label (person sends to IT), Item the damaged host, Address from Directory (HR record), then Create return label.',
    'When the courier delivers, select Mark delivered on the outbound row.',
    'Company Chat: ask the person to confirm they can sign in and work.'],
  verify:['The outbound shipment reads Delivered to the Directory address.','The old device reads Return in transit; the user confirms in chat.'],
  escalate:['The address in Directory looks wrong or outdated: confirm with HR before shipping.','The damage isn’t covered: ask the manager to approve the replacement cost.']},

 {id:'kb14', cat:'Identity', title:'Verifying a caller’s identity', tools:['Directory'], rel:['INC-1057','INC-1062','INC-1063','INC-1065'],
  purpose:'Make sure the person asking for a change to an account really is the account owner.',
  prereq:['You have the account open in Directory, with the person’s Mobile, extension and Employee ID visible on Profile.'],
  steps:['Never reset a password or MFA, enable an account, or ship a device for an unverified caller.',
    'Select Verify identity… on Profile or Authentication.',
    'Preferred: “Callback to number on record” (the desk extension or mobile already in Directory) or “Code to registered mobile”.',
    '“Callback to number the caller gave” proves nothing: an attacker can give their own number.',
    'A code to a phone the caller says is lost won’t work. Use a callback to another number on record.',
    '“Manager attestation” is acceptable only when the manager confirms through a channel you trust, such as Company Chat.',
    'A message typed from someone else’s account (a colleague’s chat) proves nothing about the person it’s about.',
    'Write the verification method in the ticket notes.'],
  verify:['Identity check reads Verified with the method you used.'],
  escalate:['The caller can’t be verified but pushes for urgency, uses an executive’s name, or offers a new phone number or address: change nothing and escalate to Security.']},

 {id:'kb15', cat:'Server', title:'DNS outage: names fail, IP addresses work', tools:['Remote Desktop','Server Room'], rel:['INC-1066'],
  purpose:'Restore name resolution when people can’t reach servers by name even though the network is up.',
  prereq:['A user PC on the office network to test from (Remote Desktop).'],
  steps:['From the PC’s Terminal run ping 10.0.0.20 (works) and ping file01 (“could not find host”). Names failing while IPs work means DNS.',
    'Run nslookup file01: “DNS request timed out” from dc01.northstar.local points at DC01.',
    'Optional: nslookup file01 10.0.0.11 answers from DC02; ipconfig /all shows DNS Servers lists only 10.0.0.10, which is why PCs don’t fail over.',
    'Open Tools › Server Room › Servers › Services on DC01: DNS Server reads stopped. Read the event (7031) under “Event log & scheduled tasks”.',
    'Select Start next to DNS Server. Don’t Reboot a domain controller for one stopped service, and never stop DNS on DC02.',
    'On the PC run ipconfig /flushdns to clear the cached failure, then nslookup intranet.northstar.local.'],
  verify:['nslookup returns an Address (10.0.0.40 for the intranet) from DC01.','Mapped drives open again in File Explorer.'],
  escalate:['DNS Server stops again after starting: send it to the server team with the event ID.','Both DCs fail to answer: major incident; tell the service desk manager.']},

 {id:'kb16', cat:'Security', title:'Reported phishing: analyse, purge, block', tools:['Mail Security','Mail Admin'], rel:['INC-1072'],
  purpose:'Contain a phishing campaign that staff have reported, without destroying the evidence.',
  prereq:['A message is listed under Mail Security › Reported messages.'],
  steps:['Never select Open link on a reported message. Select Analyze and read the verdict (domain age, SPF, DKIM, reply-to, clicks).',
    'Mail Admin › Message trace: search the sender domain to see every recipient of the campaign.',
    'Mail Security › Reported messages: select Report to Security so they have the headers and indicators.',
    'Select Search & purge…, Scope “Every copy, all recipients”, Mode “Soft delete (recoverable by admins)”, then Purge.',
    'Select Block sender, or block the whole lookalike domain on Blocked senders (@domain.example). Never block northstar.example.',
    'Trace the sender again.'],
  verify:['Every copy shows Purged in Message trace, and the sender or domain is on Blocked senders.'],
  escalate:['Anyone clicked the link or entered credentials (the verdict shows clicks): escalate to Security immediately and reset that user’s password with them.','A legitimate newsletter was reported: tell the user it’s safe instead of purging it.']},

 {id:'kb17', cat:'Hardware', title:'Dead PC: swap or repair?', tools:['Asset Management','PC Shelf','Computer Deployment','Company Chat'], rel:['INC-1052'],
  purpose:'Decide quickly between repairing and replacing a PC that won’t power on, and keep the asset register accurate.',
  prereq:['The user has tried another socket, and the monitor works (so building power is fine).'],
  steps:['Asset Management › Open › Health: Power, Heartbeat and the Last event show when it died and why.',
    'Details: the warranty and User data (where the user’s files live). If folders are redirected to a server, a swap loses nothing.',
    'Out of warranty or business-critical: deploy a clean spare (Available and Wiped) rather than wait for a repair.',
    'Set the dead unit’s State to “Retired, awaiting disposal” so the disk goes through certified destruction. The owner clears automatically.',
    'Never set it straight to Disposed, and never set an out-of-warranty unit to In repair while the desk is down.',
    'Company Chat: ask the user to confirm they can work on the new PC.'],
  verify:['New host In use for the user; old unit Retired, awaiting disposal with no owner.'],
  escalate:['User data is stored locally on the dead PC: send the disk to the hardware team for recovery before retiring it.']},

 {id:'kb18', cat:'Hardware', title:'Updates fail and the PC is slow (full disk)', tools:['Remote Desktop','Company Chat'], rel:['INC-1055'],
  purpose:'Free enough disk space for updates to install, without touching the user’s own files.',
  prereq:['Remote Desktop session to the PC; the user knows you are working on it.'],
  steps:['Remote Desktop › System Update: read Status and Last error. 0x80070070 means not enough free space; the line shows how much updates need.',
    'Settings › Storage shows what uses the disk. Documents is Protected.',
    'Select Clean up on Temporary files and Update cache, and Empty Recycle Bin.',
    'Ask the user in Company Chat before selecting “Remove downloads older than 30 days”: downloads are theirs.',
    'System Update › Retry install, then Restart now once the user has saved their work.',
    'Never select Pause updates for 7 days to hide the prompt.'],
  verify:['System Update reads Up to date and Storage shows at least the space updates need.'],
  escalate:['Space is still short after safe clean-up: the disk is too small for the role. Raise a hardware request rather than deleting user data.']},

 {id:'kb19', cat:'Hardware', title:'Second screen shows “No signal”', tools:['Remote Desktop','Company Chat'], rel:['INC-1056'],
  purpose:'Bring back an external monitor when the hardware is fine but Windows isn’t using it.',
  prereq:['The user can tell you what changed (a presentation, a projector, a new dock).'],
  steps:['Remote Desktop › Device Manager: if the dock and monitor read Working, the hardware is fine.',
    'Settings › Display: compare “displays detected” with “active”.',
    'In Multiple displays choose “Extend these displays” (Duplicate mirrors the screen, which isn’t what most people want at a desk).',
    'Select Keep changes before the 15-second timer reverts it.',
    'Ask the user in Company Chat to confirm both screens work.'],
  verify:['Settings › Display reads 2 displays detected · 2 active.'],
  escalate:['Device Manager shows the monitor or dock with an error that a rescan doesn’t clear: then it’s hardware, so issue a replacement.']},

 {id:'kb20', cat:'Hardware', title:'Laptop not charging while plugged in', tools:['Remote Desktop','PC Shelf','Asset Management','Company Chat'], rel:['INC-1058'],
  purpose:'Find out whether the battery, the laptop or the charger is at fault, and fix it with the cheapest correct part.',
  prereq:['Remote Desktop session to the laptop.'],
  steps:['Settings › Power & battery: read Status, Power adapter wattage, Battery health and Charge cycles.',
    'Device Manager › Batteries shows the USB-C power source.',
    'A Northbook needs a 65 W charger. Any USB-C plug fits, so a weaker charger lights up but can’t keep up.',
    'Battery health above 80% with few cycles is healthy: don’t replace the battery or the laptop.',
    'Asset Management › Accessories shows what was issued or reported missing.',
    'PC Shelf › Accessories: choose the device on the USB-C charger 65 W row and select Issue, so the asset record stays accurate.',
    'Ask the user in Company Chat to swap chargers, then check Power & battery again.'],
  verify:['Power & battery reads Charging with a 65 W adapter, and the user confirms the percentage is rising.'],
  escalate:['Status stays Not charging on a 65 W charger, or battery health is poor: send the laptop for hardware repair.']},

 {id:'kb21', cat:'Security', title:'Urgent requests to send devices or passwords somewhere new', tools:['Voicemails','Directory','Asset Management','Company Chat'], rel:['INC-1057','INC-1065'],
  purpose:'Spot pretexting (social engineering by phone or voicemail) and stop it without harming the real user.',
  prereq:['A request arrives by phone or voicemail asking for a password, an MFA reset or a device to be sent to a new address or number.'],
  steps:['Urgency + authority (an executive or their “assistant”) + a new address or phone number is the classic pattern.',
    'Never use contact details the requester gives you. Compare the caller ID with Directory › Profile.',
    'Look for evidence: Directory › Authentication shows a recent sign-in; Asset Management › Health shows whether the “lost” device is online.',
    'Search Directory for the named assistant or caller; check Profile › Assistant.',
    'Contact the real person through a trusted channel (Company Chat) using the ticket’s quick action.',
    'If it’s fake, change nothing: no shipment, reset, lock, wipe or asset change. Don’t delete the voicemail.',
    'On the voicemail select Save to the ticket and Forward to Security, then escalate the ticket.'],
  verify:['The real person has denied the request in chat and the ticket is escalated with the caller details.'],
  escalate:['Always escalate a confirmed fake to Security, with the caller ID, time, what was asked for and the facts that contradict it.']},

 {id:'kb22', cat:'Identity', title:'Offboarding a leaver', tools:['Directory','Mail Admin','Asset Management'], rel:['INC-1061'],
  purpose:'Remove a leaver’s access completely while keeping their mail and data as HR requires.',
  prereq:['An HR leaver record (Directory › Leavers) with the last day and instructions.'],
  steps:['Directory › Leavers: read the HR instructions, then select Open account.',
    'Authentication: read the sign-in log for activity after the last day, then select Disable account.',
    'Sessions › Revoke all sessions. Disabling alone leaves existing sessions working.',
    'Groups: Remove the department groups (Domain Users stays).',
    'Mail Admin › Mailboxes: Convert to shared, then Grant the manager Full Access with the expiry HR asked for. Don’t add Send As unless asked.',
    'Automatic replies: On, with HR’s text, then Save. Leave Forwarding empty unless HR asks for it.',
    'Back in Directory › Licences: Remove each licence (the mailbox is shared now, so it isn’t deleted).',
    'Asset Management › Open › Health › Return to shelf for the laptop, so it’s wiped before reuse.',
    'Never select Delete account for an account under retention.'],
  verify:['Test sign-in fails with “the account is disabled”.','Mail Admin › Test access as… the manager reads “can open”.'],
  escalate:['The sign-in log shows activity after the last day from an unknown place: escalate to Security before anything else.']},

 {id:'kb23', cat:'Identity', title:'Lost phone and MFA reset', tools:['Voicemails','Directory','Asset Management','Company Chat'], rel:['INC-1062'],
  purpose:'Let someone who lost their phone sign in again, and make sure the lost phone can’t be used.',
  prereq:['The request is logged as a ticket (voicemails: Log as ticket and Save to the ticket).'],
  steps:['Verify first. A code to the registered phone won’t work if that phone is lost, and a number the caller gives proves nothing.',
    'Directory › Verify identity… › “Callback to number on record” (the desk extension or another number already on file) › Run check.',
    'Only then select Reset MFA… and confirm. The user re-enrols at next sign-in.',
    'Sessions: Revoke the session belonging to the lost phone.',
    'Asset Management › Mobiles: set the phone’s state to Lost/Stolen; optionally Queue remote wipe for a company phone.',
    'Ask the user in Company Chat to sign in and re-enrol.'],
  verify:['Identity check reads Callback to number on record, MFA re-enrolled, the phone reads Lost/Stolen, and the user confirms.'],
  escalate:['The caller can’t be reached on any number on record: don’t reset MFA; ask the manager to vouch through Company Chat or escalate to Security.']},

 {id:'kb24', cat:'Identity', title:'Returning from long leave', tools:['Company Chat','Directory','Remote Desktop'], rel:['INC-1063'],
  purpose:'Reactivate a returner’s own account safely, rather than creating a new identity.',
  prereq:['A Directory HR note confirms the return date.'],
  steps:['A request typed from someone else’s chat account proves nothing. Verify the returner through their own record: callback to the number on record, or a code to their registered mobile.',
    'Read the HR note in Directory: leave workflows often disable the account, let the password expire and release licences.',
    'Authentication: Enable account, then Reset password… with “must change at next sign-in”, read to the user on the verified call.',
    'Licences: if Assign is greyed out, the pool is full. Follow “Licence pools: assigning and reclaiming seats”.',
    'Test sign-in, then Remote Desktop › the user’s PC › Office Suite › Refresh licence.'],
  verify:['Test sign-in passes and Office Suite reads Licensed (“Product activated”).'],
  escalate:['You can’t verify the returner: leave the account disabled and ask HR or the manager to confirm through a trusted channel.']},

 {id:'kb25', cat:'Email', title:'Shared mailbox access requests', tools:['Mail Admin','Company Chat'], rel:['INC-1064'],
  purpose:'Grant exactly the shared-mailbox access the owner approved, for as long as they approved it.',
  prereq:['Mail Admin › Shared mailboxes shows the mailbox owner and access policy.'],
  steps:['Approval comes from the mailbox owner, not from the requester or their line manager. Ask the owner in Company Chat so it’s written down.',
    'Grant exactly what was approved: Full Access and Send As are separate rights.',
    'Under Permissions choose the person, the right and the Expiry for temporary cover, then select Grant.',
    'Under Test access as…, choose the person and select Test access.',
    'Ask the person to confirm the mailbox appears, and quote the approval in your notes.'],
  verify:['The permission row reads Owner approved with the right expiry, and Test access reads “can open”.'],
  escalate:['The owner refuses or can’t be reached: don’t grant anything; tell the requester and their manager.']},

 {id:'kb26', cat:'Network', title:'Internet down, internal services fine', tools:['Remote Desktop','Server Room','Company Chat'], rel:['INC-1068'],
  purpose:'Handle a provider outage: prove where the break is, get the provider working on it and keep staff informed.',
  prereq:['Drives and internal servers still work while websites don’t.'],
  steps:['From an office PC’s Terminal: ping 10.0.0.1 and ping file01 work; ping web.example fails.',
    'tracert web.example shows the last hop that answers. If fw01 and edge01 answer, don’t reboot them.',
    'Server Room › Overview or Topology › MetroFiber ISP: Check provider status and note the incident.',
    'Keep the main circuit selected and select Log fault with provider. Note the reference.',
    'Company Chat › office-announcements: post Full status update (impact, workaround, next update). Never post “Ask everyone to restart”.',
    'Check provider status again until the circuit is restored, then post Resolved.'],
  verify:['ping web.example from an office PC gets replies.'],
  escalate:['The outage passes the provider’s next-update time with no progress: escalate with the provider through your manager and consider the backup circuit.']},

 {id:'kb27', cat:'Server', title:'File server volume full', tools:['Server Room','Remote Desktop'], rel:['INC-1069'],
  purpose:'Free space on a full file-server volume safely and stop it filling again.',
  prereq:['Reads work but every save fails on every share.'],
  steps:['Server Room › Servers › Services on FILE01: if both services run, it isn’t an outage.',
    'Storage (server FILE01): find the full volume and the folder that grew, using the “Older than 30 days” column.',
    'Select Purge older than 30 days on that folder. Don’t use Delete entire folder.',
    'Never select Delete all shadow copies to free space: they are everyone’s restore points.',
    'Events & tasks (choose FILE01 in the Server list): find why it grew, often a clean-up task left Disabled after maintenance, and select Enable.',
    'Back on Storage select Test write.'],
  verify:['Test write reads “Test file written to D: and removed”, and a user can save to a share.'],
  escalate:['Purging old files doesn’t free enough space: ask the server team to extend the volume or add storage.']},

 {id:'kb28', cat:'Server', title:'Restoring a deleted file from a share', tools:['Server Room','Remote Desktop','Company Chat'], rel:['INC-1070'],
  purpose:'Bring back one deleted or damaged file without disturbing anything else on the share.',
  prereq:['You know the share and the file name.'],
  steps:['Deletes on network drives skip the Recycle Bin. Server Room › Shadow copies › File audit shows who deleted what and when.',
    'Set Share, select the file and compare its previous versions by modified time and size, not by snapshot label.',
    'Select Restore to original location on the right version (or Restore as a copy if the user wants to compare).',
    'Never select Revert entire share to recover one file: it overwrites everyone’s changes since the snapshot.',
    'If no snapshot holds the file, select Request restore from nightly backup.',
    'Ask the user in Company Chat to open it and confirm the content.'],
  verify:['File Explorer lists the file again and the user confirms it holds the expected content.'],
  escalate:['No snapshot or backup holds the version needed: tell the user honestly and involve the server team.']},

 {id:'kb29', cat:'Email', title:'Approving a new phone for company mail', tools:['Mail Admin','Company Chat'], rel:['INC-1071'],
  purpose:'Let a user’s new phone sync company mail, using the approved app, and retire the old one correctly.',
  prereq:['The new phone is listed as Quarantined in Mail Admin › Mobile devices.'],
  steps:['Ask the user in Company Chat for the Device ID from Settings › About and match it before approving.',
    'Select Approve only on the Northstar Mail row. Select Block on third-party mail apps that store the password in someone else’s cloud.',
    'Ask what happened to the old phone. Use Remove partnership or Account-only wipe for personal or traded-in phones; Remote wipe is for lost company phones only.',
    'Select Test sync on the approved row.',
    'Never select Disable quarantine for all to fix one phone.'],
  verify:['Test sync reads “sync test passed” and the user confirms mail and calendar.'],
  escalate:['The Device ID doesn’t match what the user reads out: don’t approve; treat it as unknown and tell Security.']},

 {id:'kb30', cat:'Network', title:'DHCP scope full (169.254 address)', tools:['Remote Desktop','Server Room'], rel:['INC-1067'],
  purpose:'Get a PC a valid address when the floor’s DHCP scope has run out, without disrupting working devices.',
  prereq:['The affected PC is reachable in Remote Desktop.'],
  steps:['Terminal › ipconfig: a 169.254.x.x (Autoconfiguration) address with no gateway means no DHCP lease. ping 10.0.0.1 fails with General failure.',
    'Server Room › Servers › Services on DC01: DHCP Server should be running. Its event log shows the scope-full event.',
    'DHCP tab: read the floor’s “in use” count and lease time, then View leases to find stale, inactive clients.',
    'Select Delete inactive leases. Never Delete all leases: every working device on the floor drops.',
    'Choose a shorter lease (8 hours or 1 day) and select Set lease duration, so one-day guests can’t fill the scope again.',
    'Never widen the range over fixed addresses below .100 (printers live there).',
    'On the PC run ipconfig /renew, then ping 10.0.0.1.'],
  verify:['ipconfig shows a 10.0.x.1xx address with gateway 10.0.0.1, and ping 10.0.0.1 replies.'],
  escalate:['The scope fills with active devices: the floor has outgrown it. Ask the network team to plan a bigger scope.']},

 {id:'kb31', cat:'Identity', title:'New starter: account, access and day-one handover', tools:['Directory','Documentation','Computer Deployment','Company Chat'], rel:['INC-1053','INC-1059'],
  purpose:'Have a new starter able to sign in, reach their team’s files and use the right laptop on day one, with no more access than the role needs.',
  prereq:['An HR starter record (Directory › Starters) or role template on the account.'],
  steps:['Directory › Starters: read the start date, department, manager, licences and equipment.',
    'Read the Username standard; search Directory for the surname to catch clashes, including leavers.',
    'Select Create account from this record…, fix the Username if the hint shows it’s taken, tick the licences HR listed, keep “Add the department share group”, and select Create user.',
    'Compare Groups with the role template or the manager’s groups, and add nothing extra.',
    'Deploy a laptop with the role’s image (see “Deploying a computer from the PC Shelf”).',
    'Day-one password: the starter gets it in person after an ID check. Where the starter record says the manager is meeting them, use Reset password… with “Company Chat to their manager”. Never personal email, and never type a password into a chat yourself.',
    'Select Test sign-in, then confirm with HR or the manager.'],
  verify:['Groups and licences match the template, the laptop is In use for the starter, and Test sign-in passes.'],
  escalate:['The starter record is missing details or conflicts with the role template: ask HR before creating anything.']},

 {id:'kb32', cat:'Identity', title:'Name change: display name and email alias', tools:['Directory','Mail Admin','Company Chat'], rel:['INC-1060'],
  purpose:'Update someone’s name everywhere people see it, without breaking their sign-in or losing mail sent to the old address.',
  prereq:['HR has recorded the new name (Profile shows “Pending HR change”).'],
  steps:['Directory › Profile › Edit profile…: change Display name. Leave Username as it is.',
    'Email addresses: type the new first.last@northstar.example, select Add address, then Make primary on it.',
    'Keep the old address as an alias: suppliers and colleagues still use it.',
    'Mail Admin › Mailboxes › Send test to: the old address, then Send test message.',
    'Ask the person in Company Chat to confirm.'],
  verify:['The test to the old address reads “delivered to <new name>’s mailbox” and Profile shows the new display name.'],
  escalate:['The person asks for a new username too: explain the impact (new profile, mapped drives, saved sign-ins) and get their manager’s agreement first.']},

 {id:'kb33', cat:'Identity', title:'Licence pools: assigning and reclaiming seats', tools:['Directory','Remote Desktop'], rel:['INC-1059','INC-1061','INC-1063'],
  purpose:'Keep licences with the people who need them, and free seats correctly when a pool runs out.',
  prereq:['Directory › person › Licences shows what they have and how many seats are free.'],
  steps:['Assign the licences the role needs: Office Suite (which also provisions the mailbox), Endpoint Protection, and department licences such as Sales Hub CRM.',
    'If Assign is greyed out, select View licence pools and read each holder’s Account state and Last sign-in.',
    'Reclaim a seat only from a Disabled leaver. Never take one from an active colleague.',
    'For a leaver, convert their mailbox to shared before removing Office Suite, or the mailbox is scheduled for deletion.',
    'After assigning Office Suite to someone who was unlicensed, refresh it on their PC: Remote Desktop › Office Suite › Refresh licence.'],
  verify:['The pool never goes negative, the user reads Assigned and Office reads Licensed.'],
  escalate:['No disabled leaver holds a seat: ask the licence owner (IT manager) to buy more rather than taking one from a colleague.']},

 {id:'kb34', cat:'Service desk', title:'Escalating to Security with evidence', tools:['Mail Admin','Directory','Voicemails'], rel:['INC-1049','INC-1057','INC-1065'],
  purpose:'Hand a suspected compromise or social-engineering attempt to Security fast, with the evidence intact.',
  prereq:['You have a security concern: a compromise indicator, an unverifiable urgent request, or a confirmed fake.'],
  steps:['Stop changing things on the affected account or device. Evidence (rules, voicemails, sign-in logs) must stay as it is.',
    'Collect the facts: who, what, when, from where (caller ID, address, rule target, timestamps) and what contradicts the request.',
    'Save voicemails to the ticket and Forward to Security; don’t delete them.',
    'Add work notes as you go so the timeline is on the ticket.',
    'Select Escalate to Security, write the evidence (at least 15 characters) and select Escalate.'],
  verify:['Past tickets shows Routed to Security, and the preview included “Correct security escalation +12”.'],
  escalate:['Escalation is the end of your part. Don’t escalate routine fixes: a needless escalation costs 8 points.']},

 {id:'kb35', cat:'Service desk', title:'Logging chat messages and voicemails as tickets', tools:['Company Chat','Voicemails'], rel:['INC-1054','INC-1056','INC-1057','INC-1058','INC-1062','INC-1063','INC-1065','INC-1067','INC-1068','INC-1071'],
  purpose:'Turn a request that arrives outside the queue into a ticket, so it’s tracked and scored.',
  prereq:['The dashboard shows it under Incoming contacts, or the Voicemails badge has a new message.'],
  steps:['Dashboard › Incoming contacts: select Open chat or Open voicemails to read the full message.',
    'Read the caller ID or chat sender, and compare it with who the request is about. A chat sent from someone else’s account isn’t proof of identity.',
    'Select Log as ticket (or Log as INC-… in the chat). The ticket joins the Incidents queue.',
    'Voicemails: select Save to INC-… so the transcript is on the ticket. Never delete a suspicious voicemail.',
    'Open the ticket and select Assign to me.'],
  verify:['The ticket is in My Queue and the contact no longer appears under Incoming contacts.'],
  escalate:['A voicemail asks for something risky for someone else (an executive’s password, a device to a new address): see “Urgent requests to send devices or passwords somewhere new”.']},

 {id:'kb36', cat:'Service desk', title:'Verifying, documenting and closing a ticket', tools:['Company Chat'], rel:[],
  purpose:'Close tickets only when the fix is proven, with notes the next technician can use.',
  prereq:['You have made the fix.'],
  steps:['Select Check fix. Every requirement must be green; if not, the list tells you what’s missing.',
    'Where the ticket offers it, ask the requester in Company Chat to confirm (“Ask to confirm the fix”).',
    'Select Close ticket. In Resolution notes write cause, action and verification: at least 40 characters, a specific name (user, host or service) and a verification word (verified, confirmed or tested) earn up to +3.',
    'Check the points preview, then select Close ticket. “Close anyway” means it’s still unresolved and costs points.',
    'Security cases use Escalate to Security instead.'],
  verify:['Past tickets shows Resolved with your notes and the model answer for comparison.'],
  escalate:['You can’t make Check fix go green without a risky change: ask a colleague, use the hint ladder (free), or read the solution guide in Documentation.']},

 {id:'kb37', cat:'Email', title:'Following a message with Message trace', tools:['Mail Admin'], rel:['INC-1047','INC-1048','INC-1060','INC-1072'],
  purpose:'Find out what happened to a message: delivered, quarantined, failed, pending or purged.',
  prereq:['A sender, recipient, display name or domain to search for.'],
  steps:['Open Tools › Mail Admin › Message trace.',
    'Type part of an address, a display name or a domain in “Sender, recipient or display name”; optionally set Status and Received.',
    'Select Search and read each row’s status and detail line (for example 550 5.2.2 Recipient mailbox full, or Held by the content filter).',
    'After a fix, select Search again: the new status is the evidence.'],
  verify:['The status matches what you expect after the fix (Delivered, or Purged for phishing).'],
  escalate:['Messages fail for many recipients at once: check MAIL01 in Server Room and tell the messaging team.']}
];

   2. STATE + PERSISTENCE — one root object S, saved to localStorage.
   ===================================================================== */
const KEY = 'deskops-lab-v3'; // older saves live under other keys and are ignored (fresh seed)
let S, memoryOnly = false, bootNote = null;
function validSave(s){
  return !!(s && s.v===3 && s.users && s.workstations && s.net && s.net.dhcp && s.mail && s.mail.lists && s.ui && s.ui.chat && s.ui.form && s.profile && s.tickets && s.chat && s.chat.facts &&
    s.voicemails && s.shelf && s.ship && s.deploy && s.hr && s.licences && s.fs && typeof s.shift==='number' && TICKETS.every(t=>s.tickets[t.ref]));
}
function load(){
  let raw;
  try { raw = localStorage.getItem(KEY); } catch(e){ memoryOnly = true; return seed(); }
  if (!raw) return seed();
  try { const s = JSON.parse(raw); if (validSave(s)) return s; } catch(e){}
  bootNote = 'Saved progress couldn’t be read, so a fresh shift was started.';
  return seed();
}
function save(){
  if (memoryOnly) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memoryOnly = true; document.getElementById('memNote').classList.remove('hide'); }
}

/* Whether a workstation is reachable and has internal (company network) access.
   power:false (or wiped) is the "unreachable" flag: Remote Desktop and ping both fail. */
function netState(s, w){
  if (!w.power) return {up:false, internal:false, why:'Powered off / not reachable'};
  if (w.wiped) return {up:false, internal:false, why:'Wiped: no operating system'};
  if (w.remote) return {up:true, internal:w.vpn.connected, why:w.vpn.connected?'Connected over VPN':'Off-site — VPN not connected'};
  const d = s.net.devices;
  if (d.edge.status!=='online' || d.fw.status!=='online') return {up:false, internal:false, why:'Core network (edge router / firewall) is down'};
  const sw = Object.values(d).find(x=>x.kind==='switch' && x.floor===w.floor);
  if (sw && sw.status!=='online') return {up:false, internal:false, why:`Unreachable: ${sw.name} is down`};
  if (w.ip && w.ip.mode==='apipa') return {up:true, internal:false, apipa:true, why:'Self-assigned 169.254 address (no DHCP lease)'};
  const wifiOk = w.wifi.connected==='Northstar-Staff' || /Desk/.test(w.model);
  return {up:true, internal:wifiOk, why: wifiOk ? 'On the office network' : (w.wifi.connected ? 'On guest Wi-Fi (no internal access)' : 'Wi-Fi disconnected')};
}
const wsAddr = w => w.remote ? '192.168.1.23' : (w.ip && w.ip.mode==='apipa') ? '169.254.'+(20+w.floor)+'.'+(40+Number(w.tag.slice(-2))||7)
  : (w.ip && w.ip.addr) || `10.0.${w.floor}.${40+(Number(w.tag.slice(-2))||0)}`;
const dnsUp = (s, srv) => svcUp(s, srv||'DC01', 'DNS Server');
const mbAddr = (s, id) => { const m=s.mail.mailboxes[id]; return (m && m.address) || (s.users[id] ? s.users[id].email : id); };
const mbName = (s, id) => { const m=s.mail.mailboxes[id]; return (m && m.name) || (s.users[id] ? s.users[id].name : id); };
const loginOf = u => u.login || u.id;
/* Which mailbox an address delivers to: primary address, alias or shared-mailbox address. */
function resolveAddr(s, addr){
  const a=String(addr||'').toLowerCase().trim();
  for (const [id,m] of Object.entries(s.mail.mailboxes)){ const u=s.users[id];
    if (mbAddr(s,id).toLowerCase()===a) return {box:id, alias:false};
    if (u && (u.aliases||[]).some(x=>x.toLowerCase()===a)) return {box:id, alias:true}; }
  return null;
}
const licUsed = (s, l) => Object.values(s.users).filter(u=>!u.deleted && u.licences.includes(l));
const licFree = (s, l) => s.licences[l].total - licUsed(s,l).length;
const ownedHosts = (s, uid) => Object.values(s.workstations).filter(w=>w.owner===uid);
const volUsed = (v, srv) => Math.round(v.folders.filter(f=>!f.deleted).reduce((a,f)=>a+f.gb,0) + (v.id==='D:' && srv && srv.shadows ? srv.shadows.reduce((a,x)=>a+x.gb,0) : 0));
const volFree = (v, srv) => v.totalGB - volUsed(v, srv);
const diskUsed = w => Object.values(w.storage.cats).reduce((a,b)=>a+b,0);
const dockOk = w => !w.devices.some(d=>d.dock && d.status!=='OK');
const monitors = w => ({detected:1+(dockOk(w)?w.display.external:0), active: /Extend|Duplicate/.test(w.display.mode) ? 1+(dockOk(w)?w.display.external:0) : 1});
const hist = (w, text) => { (w.history||(w.history=[])).unshift({t:now(), text}); if (w.history.length>40) w.history.length=40; };
const ev = (s, srv, level, source, id, text) => { const x=s.net.servers[srv]; (x.events||(x.events=[])).unshift({t:now(), level, source, id, text}); if (x.events.length>60) x.events.length=60; };
const thread = (s, id) => s.chat.threads[id] || (s.chat.threads[id]=[]);
const touchChat = (s, id) => { s.chat.recent=[id, ...s.chat.recent.filter(x=>x!==id)]; };
const DEPT_CODE = {Finance:'FIN', Sales:'SALES', 'Human Resources':'HR', Support:'SUP', Operations:'OPS', 'Executive Office':'EXEC', IT:'IT', Marketing:'MKT', Security:'SEC', 'Front Office':'FO'};
function nextHost(s, u){ const pre='NS-'+(u ? (DEPT_CODE[u.dept]||'GEN') : 'SHR')+'-';

/* Name resolution for the simulated terminal. Office PCs and VPN clients ask DC01 (or the server named). */
function resolveName(s, w, name, server){
  const n=String(name).toLowerCase();
  if (/^\d+\.\d+\.\d+\.\d+$/.test(n)) return {ip:n, literal:true, server:'—'};
  const wsHit=Object.values(s.workstations).find(x=>x.host.toLowerCase()===n);
  const ip = HOSTS[n] || HOSTS[n.replace(/\.northstar\.local$/,'')] || (wsHit ? wsAddr(wsHit) : null);
  const srvKey = server ? ({'dc02':'DC02','10.0.0.11':'DC02','dc01':'DC01','10.0.0.10':'DC01'}[server] || 'ext') : null;
  const st=netState(s,w);
  if (!srvKey && w.remote && !w.vpn.connected){ // home router: public names only
    return ip && !ip.startsWith('10.') ? {ip, server:'192.168.1.1'} : {err:'nx', server:'192.168.1.1'}; }
  if (srvKey==='ext') return (ip && !ip.startsWith('10.') && s.net.devices.isp.status==='online' && st.up && !st.apipa) ? {ip, server} : {err:'timeout', server};
  const dc = srvKey || 'DC01', srvName = dc.toLowerCase()+'.northstar.local';
  if (!st.internal || !dnsUp(s,dc) || (!srvKey && w.dnsStale)) return {err:'timeout', server:srvName, why: !st.internal?'network':'dns'};
  if (!ip) return {err:'nx', server:srvName};
  if (!ip.startsWith('10.') && s.net.devices.isp.status!=='online') return {err:'timeout', server:srvName, why:'isp', ip};
  return {ip, server:srvName, dc};
}

  unlock(s,id){ const u=s.users[id]; u.locked=false; u.signInOk=false;

  enable(s,id){ const u=s.users[id]; u.enabled=true; u.signInOk=false; return `${u.name}’s account is enabled.`; },
  disable(s,id){ const u=s.users[id]; u.enabled=false; u.signInOk=false; return `${u.name}’s account is disabled. They can’t sign in.`; },
  /* to: who receives the temporary password (CREDS_TO key); stored as u.credsTo */
  resetPassword(s,id,must,to){ const u=s.users[id]; u.pwdExpired=false; u.mustChange=!!must; u.signInOk=false; u.pwdResetCount=(u.pwdResetCount||0)+1; u.credsTo=to||'tech';

  /* f: {first,last,id,dept,title,manager,floor,ext,groups[],licences[],mailbox:bool,startDate,roleTemplate} */

  /* ----- Server room ----- */
  /* ISP restore rule: a logged fault + a full announcement + a re-check brings the circuit back. */

  /* op: purgeInactive | purgeAll | leaseHours (arg hours) | range (arg new size) */

  purgeOld(s,srv,vol,folder){ const f=s.net.servers[srv].volumes.find(v=>v.id===vol).folders.find(x=>x.name===folder), gb=f.oldGB||0;

  /* ----- Workstations (Remote Desktop) ----- */

      Object.assign(d, {status:'Deployed', reservedFor:null, image:img.name, host, wiped:false}); hist(w, `Deployed from the PC Shelf (${d.tag}) with ${img.name}${u?' for '+u.name:''}`); }
    if (u) u.host=host;
    return `${job.id}: ${host} deployed with ${img.name}${u?' for '+u.name:''}.` + (warn.length?' Warning: '+warn.join('; ')+'.':''); },
  /* f: {kind:'outbound'|'return', asset: host | 'acc:<id>', recipient, addrSource:'saved'|'directory'|'custom', custom, carrier, service} */
  createShipment(s,f){ const u=s.users[f.recipient]; if (!u) return 'Shipment: choose a recipient.';

  /* ----- Company chat, voicemail, intake, shifts ----- */
  chatSend(s,id,text,t){ const body=String(text||'').trim().slice(0,400); if (!body) return '';

  /* Ticket-declared confirmation: T.chatConfirm={user, ok:s=>bool, yes, no, onYes?:s=>void}. Sets s.chat.confirmed[ref] only when ok(s). */
  chatAskConfirm(s,ref,t){ const C=TK[ref].chatConfirm; if (!C) return ''; t=t||now();

/* =====================================================================
   4. SCENARIOS — per-ticket objective checks over shared state.
   ===================================================================== */
function check(s, ref){
  const T=TK[ref], done=[], todo=[];
  T.obj.forEach(o=>{ (o.ok(s)?done:todo).push(o); });
  return {done:done.map(o=>o.done), todo:todo.map(o=>o.todo), complete:todo.length===0};
}
const isResolved = (s, ref) => s.tickets[ref].status==='assigned' && check(s,ref).complete;
function statusWord(ref){ const t=S.tickets[ref];
  if (isResolved(S,ref)) return 'Resolved';
  return {open:'Open', assigned:'Assigned', closed:'Closed', escalated:'Escalated', waiting:'Not arrived', intake:'Awaiting intake'}[t.status]; }
const isDone = (s, ref) => ['closed','escalated'].includes(s.tickets[ref].status);
const shiftDone = s => TICKETS.filter(T=>(T.shift||1)===s.shift).every(T=>isDone(s,T.ref));
const hasNextShift = s => TICKETS.some(T=>(T.shift||1)>s.shift);
/* check() as if the ticket had already been escalated (for scoring an escalation before it happens). */
function asEscalated(s, ref){ const t=s.tickets[ref], st=t.status; t.status='escalated'; try { return check(s,ref).complete; } finally { t.status=st; } }

/* =====================================================================
   5. LIFECYCLE + SCORING
   ===================================================================== */
function notesBonus(T, notes){
  const n=(notes||'').toLowerCase(); let b=0;
  if (n.length>=40) b++;
  if (T.keys.some(k=>n.includes(k))) b++;
  if (/verif|confirm|test/.test(n)) b++;
  return b;
}
/* mode: 'close' | 'escalate'. Returns {lines:[[label,pts]], total, outcome}. */
function scoreFor(s, ref, mode, notes){
  const T=TK[ref], t=s.tickets[ref], P=PRI[T.pri], lines=[]; let outcome;
  const expect = T.expect || (T.security ? 'escalate' : 'close'); // what a correct finish looks like
  if (mode==='escalate' && expect!=='escalate'){ lines.push(['Routine escalation (work not needing Security)', -8]); outcome='Escalated'; }
  else if (mode==='escalate' || check(s,ref).complete){
    lines.push([`${P.w} ticket resolved`, P.pts]);
    if (mode==='escalate'){ if (asEscalated(s,ref)) lines.push(['Correct security escalation', 12]); outcome='Routed to Security'; }
    else outcome='Resolved';
    const nb=notesBonus(T,notes); if (nb) lines.push(['Resolution notes', nb]);
  } else { lines.push([`Closed while unresolved (${P.w})`, -P.pen]); outcome='Closed unresolved'; }
  Object.values(t.penalties).forEach(([p,why])=>lines.push([why,-p]));
  const raw=lines.reduce((a,l)=>a+l[1],0), total=Math.max(-20,Math.min(42,raw));
  if (total!==raw) lines.push(['Ticket score cap (−20…+42)', total-raw]);
  return {lines, total, outcome};
}
/* A ticket arrives: runs its arrive() hook and, for intake tickets, drops the chat message or voicemail. */
function arriveTicket(s, ref, quiet){
  const T=TK[ref], t=s.tickets[ref], I=T.intake;
  t.status = I ? 'intake' : 'open';
  if (T.arrive) T.arrive(s);
  if (I && I.via==='chat'){ const th=thread(s,I.from);
    [].concat(I.text).forEach(x=>th.push({from:I.from, text:x, t:T.created, intake:ref}));
    s.chat.unread[I.from]=(s.chat.unread[I.from]||0)+[].concat(I.text).length; touchChat(s,I.from); }
  if (I && I.via==='voicemail'){ const u=s.users[I.from];
    s.voicemails.unshift({id:'vm-'+ref, from:I.name||(u?u.name:'Unknown caller'), role:I.role||(u?`${u.title} · ${u.dept}`:'Caller not in the directory'), ext:I.ext||(u?u.ext:''),
      callerId:I.callerId||(u?'Internal x'+u.ext:'Withheld'), time:T.created, dur:I.dur||'0:45', ref, text:I.text, heard:false, saved:false, forwarded:false, deleted:false, intake:true}); }
  if (!quiet) logEntry(s,'Service Desk',ref, I ? `New ${I.via==='chat'?'chat message':'voicemail'} for ${ref}: ${T.title}` : `New ticket ${ref} arrived: ${T.title}`, null);
}
function arrivals(s){
  TICKETS.forEach(T=>{ if (s.tickets[T.ref].status==='waiting' && (T.shift||1)<=s.shift && (!T.after || isDone(s,T.after))) arriveTicket(s,T.ref); });
}
function logEntry(s, tool, entity, text, ref){
  s.log.unshift({t:now(), tool, entity, text, ref});
  if (s.log.length>400) s.log.length=400;
}
function finishTicket(ref, mode, notes){
  const t=S.tickets[ref], sc=scoreFor(S,ref,mode,notes);
  t.status = mode==='escalate' ? 'escalated' : 'closed';
  t.result = {mode, outcome:sc.outcome, lines:sc.lines, total:sc.total, notes, at:now(), model:TK[ref].model};
  S.profile.points += sc.total;
  logEntry(S,'Service Desk',ref,`${ref} ${mode==='escalate'?'escalated to Security':'closed'} · ${sc.outcome} · ${sc.total>=0?'+':''}${sc.total} pts`,ref);
  delete S.ui.drafts[ref];
  arrivals(S);
  return sc;
}

function topology(){
  const d=S.net.devices, sv=S.net.servers, healthy=Object.values(sv).filter(serverHealthy).length;
  const node=(id,x,y,name,sub,ok,warn)=>`<g class="node" data-act="${id==='servers'?'tab':'selDev'}" data-id="${id==='servers'?'srv':id}" ${id==='servers'?'data-arg="servers"':''} role="button" tabindex="0" aria-label="${name}, ${sub}">
    <rect x="${x-62}" y="${y-24}" width="124" height="48" rx="4" fill="${ok?'#0f1b23':warn?'#221a0c':'#261316'}" stroke="${S.ui.sel.dev===id?'#1ea7e1':ok?'#1d5f7f':warn?'#b7832f':'#c4474f'}" ${S.ui.sel.dev===id?'stroke-width="2.5"':''}/>
    <text x="${x}" y="${y-4}" text-anchor="middle" font-size="12" font-weight="600" fill="#e7ebef">${name}</text>
    <text x="${x}" y="${y+12}" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="${ok?'#3ccf8e':warn?'#f0a33a':'#ff6b6b'}">${sub.toUpperCase()}</text></g>`;
  const up=x=>x.status==='online', line=(x1,y1,x2,y2,ok)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ok?'#1d5f7f':'#c4474f'}" stroke-width="2" ${ok?'':'stroke-dasharray="5 4"'}/>`;
  const bottom=[['sw1',80],['sw2',210],['sw3',340],['ap1',470],['ap2',600]];
  return `<svg class="topo" viewBox="0 0 800 400" role="group" aria-label="Network topology">
    ${line(400,54,400,71,true)}${line(400,119,400,136,up(d.isp))}${line(400,184,400,201,up(d.edge))}
    ${bottom.map(([id,x])=>line(400,249,x,316,up(d.fw)&&up(d[id]))).join('')}${line(400,249,720,316,up(d.fw))}
    <g><rect x="345" y="10" width="110" height="40" rx="20" fill="#0f2633" stroke="#1ea7e1"/><text x="400" y="35" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#e7ebef">INTERNET</text></g>
    ${node('isp',400,95,'MetroFiber ISP',d.isp.status,up(d.isp))}${node('edge',400,160,'Edge Router',d.edge.status,up(d.edge))}${node('fw',400,225,'Main Firewall',d.fw.status,up(d.fw))}
    ${bottom.map(([id,x])=>node(id,x,340,d[id].name,d[id].status,up(d[id]))).join('')}
    ${node('servers',720,340,'Servers',`${healthy}/5 healthy`,healthy===5,true)}</svg>`;

        <div class="row" style="margin-top:6px"><button class="linkbtn small" data-act="srvEvents" data-id="${x.id}">Event log &amp; scheduled tasks ${icon('chev',14)}</button></div></td></tr>`:''}`; }).join('')}</tbody></table></div>`;
  if (t==='dhcp') body=`<p class="muted" style="margin-top:0">DHCP runs on DC01 (${svcUp(S,'DC01','DHCP Server')?stat(1,'running'):stat(0,'stopped')}). Each floor has one scope.</p>` + S.net.dhcp.scopes.map(sc=>{ const used=sc.leases.length, inact=sc.leases.filter(l=>!l.active).length, full=used>=sc.size, open=S.ui.sel.scope===sc.id;

      <div class="row small" style="flex-wrap:nowrap;margin-top:6px"><div class="bar ${full?'hot':''}" style="flex:1"><i style="width:${Math.min(100,used/sc.size*100)}%"></i></div><span class="mono">${used} / ${sc.size} in use</span></div>

      <div class="row">${envBtn('dhcp',[sc.id,'purgeInactive'],'Delete inactive leases','',{dis:!inact})}${envBtn('dhcp',[sc.id,'purgeAll'],'Delete all leases','danger',{confirm:`Every device on ${sc.name}, including working ones, loses its address and has to renew. Calls and file copies in progress will drop.`, title:`Delete all leases on ${sc.name}?`, ok:'Delete all leases'})}
        ${plainSel('lh-'+sc.id,[[1,'1 hour'],[8,'8 hours'],[24,'1 day'],[192,'8 days']],sc.leaseH,'Lease duration')}${envBtn('dhcp',[sc.id,'leaseHours','$val:lh-'+sc.id],'Set lease duration')}
        ${plainSel('rg-'+sc.id,[[50,'50 addresses (.100–.149)'],[100,'100 addresses (.100–.199)'],[200,'200 addresses (.20–.219)']],sc.size,'Scope range')}${envBtn('dhcp',[sc.id,'range','$val:rg-'+sc.id],'Edit range')}
        ${btn('sel','scope',open?'':sc.id,open?'Hide leases':'View leases','',`aria-expanded="${open}"`)}</div>
      ${open?`<div class="tablewrap scroll" style="margin-top:10px"><table><thead><tr><th>Client</th><th>MAC</th><th>Last seen</th><th>State</th></tr></thead><tbody>${sc.leases.map(l=>`<tr><td class="mono small">${esc(l.client)}</td><td class="mono small">${esc(l.mac)}</td><td class="small">${esc(l.seen)}</td><td>${l.active?stat(1,'Active'):'<span class="st off">Inactive</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No leases.</td></tr>'}</tbody></table></div>`:''}</div>`; }).join('');
  if (t==='storage'){ const [id,pick]=srvPick('srvst','FILE01'), x=S.net.servers[id];
    body=pick + x.volumes.map(v=>{ const used=volUsed(v,x), free=v.totalGB-used, hot=free<v.totalGB*.05;
      return `<div class="panel"><div class="row"><b>${v.id} ${esc(v.label)}</b><span class="spacer"></span>${hot?stat(0,free<2?'Full':'Low space'):stat(1,'Healthy')}</div>
        <div class="row small" style="flex-wrap:nowrap;margin-top:6px"><div class="bar ${hot?'hot':''}" style="flex:1"><i style="width:${Math.min(100,used/v.totalGB*100)}%"></i></div><span class="mono">${used} / ${v.totalGB} GB</span></div>
        <div class="small muted" style="margin:4px 0 8px">${free} GB free${v.unallocGB?` · ${v.unallocGB} GB unallocated on the disk`:''}${v.writeOk?' · last test write OK':''}</div>
        <div class="row">${envBtn('extendVolume',[id,v.id],'Extend volume','',{dis:!v.unallocGB})}${envBtn('testWrite',[id,v.id],'Test write')}</div>
        <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Folder</th><th>Size</th><th>Older than 30 days</th><th></th></tr></thead><tbody>
        ${v.folders.filter(f=>!f.deleted).map(f=>`<tr><td>${esc(f.name)}</td><td class="mono">${f.gb} GB</td><td class="mono">${f.oldGB||0} GB</td><td><div class="row" style="justify-content:flex-end">${envBtn('purgeOld',[id,v.id,f.name],'Purge older than 30 days','',{dis:!f.oldGB})}${envBtn('deleteFolder',[id,v.id,f.name],'Delete entire folder','danger',{confirm:`Everything in ${v.id}\\${f.name} is deleted, including current files people are using. This can’t be undone from here.`, title:`Delete ${f.name}?`, ok:'Delete folder'})}</div></td></tr>`).join('')}
        ${v.id==='D:'&&x.shadows?`<tr><td>Shadow copies <span class="small muted">(${x.shadows.length})</span></td><td class="mono">${x.shadows.reduce((a,z)=>a+z.gb,0)} GB</td><td></td><td><div class="row" style="justify-content:flex-end">${envBtn('deleteShadows',[id],'Delete all shadow copies','danger',{dis:!x.shadows.length, confirm:'Previous versions of every file on D: are lost. People can no longer restore files themselves.', title:'Delete all shadow copies?', ok:'Delete shadow copies'})}</div></td></tr>`:''}</tbody></table></div></div>`; }).join(''); }
  if (t==='shadows'){ const x=S.net.servers.FILE01, share=S.ui.sel.fsShare||'Sales', files=fsList(S,share), f=files.find(z=>z.name===S.ui.sel.fsFile);
    const shares=SHARES.map(z=>z.path.split('\\').pop());
    body=`<div class="two"><div><div class="label blue">Shadow copies on FILE01 D:</div>
        <table><tbody>${x.shadows.map(z=>`<tr><td class="mono">${z.id}</td><td>${esc(z.t)}</td><td class="mono">${z.gb} GB</td></tr>`).join('')||'<tr><td class="muted">No shadow copies. Previous versions are unavailable.</td></tr>'}</tbody></table>
        <div class="label blue" style="margin-top:16px">Previous versions</div>
        <div class="row" style="margin:6px 0"><label class="small muted" for="fsShare">Share</label><select id="fsShare" data-bind="sel" data-id="fsShare" data-key="fsShare">${shares.map(z=>`<option ${z===share?'selected':''}>${z}</option>`).join('')}</select></div>
        <ul class="ulist">${files.map(z=>`<li><button class="${f&&f.name===z.name?'on':''}" data-act="sel" data-id="fsFile" data-arg="${esc(z.name)}">${esc(z.name)} ${z.state!=='ok'?`<span class="chip ${z.state==='deleted'||z.state==='corrupt'?'bad':'ok'}">${z.state}</span>`:''}<small>${z.versions.length} previous version${z.versions.length===1?'':'s'}</small></button></li>`).join('')}</ul></div>
      <div>${f?`<div class="label blue">\\\\FILE01\\${esc(share)}\\${esc(f.name)}</div><p class="small muted">Current state: <b>${esc(f.state)}</b>${f.backupRequested?' · backup restore requested':''}${f.copy?' · restored copy present':''}</p>
        <div class="tablewrap"><table><thead><tr><th>Version</th><th>Modified</th><th>Size</th><th>Restore</th></tr></thead><tbody>
        ${f.versions.map(v=>{ const gone=!x.shadows.some(z=>z.id===v.shadow); return `<tr><td class="mono">${v.shadow}${gone?'':`<div class="small muted">snapshot ${esc(x.shadows.find(z=>z.id===v.shadow).t)}</div>`}</td><td>${esc(v.t)}${gone?' <span class="chip bad">Snapshot deleted</span>':''}</td><td class="mono">${esc(v.size)}</td>
          <td><div class="row">${envBtn('restoreVersion',[share,f.name,v.id,'original'],'Restore to original location','',{dis:gone})}${envBtn('restoreVersion',[share,f.name,v.id,'copy'],'Restore as a copy','',{dis:gone})}${envBtn('restoreVersion',[share,f.name,v.id,'readonly'],'Open read-only','',{dis:gone})}${envBtn('revertShare',[share,v.shadow],'Revert entire share','danger',{dis:gone, confirm:`Every file on \\\\FILE01\\${share} goes back to snapshot ${v.shadow}. Anything people saved since then is overwritten.`, title:`Revert all of ${share}?`, ok:'Revert share'})}</div></td></tr>`; }).join('')||'<tr><td colspan="4" class="muted">No previous versions: the file hasn’t changed since the oldest snapshot.</td></tr>'}</tbody></table></div>
        ${f.versions.length && f.versions.every(v=>!x.shadows.some(z=>z.id===v.shadow)) || (f.state!=='ok' && !f.versions.length) ? `<div class="note warn">No usable shadow copy. ${envBtn('requestBackup',[share,f.name],'Request restore from nightly backup','',{dis:!!f.backupRequested})}</div>`:''}`
        :'<p class="muted">Select a file to see its previous versions.</p>'}</div></div>
      <div class="label blue" style="margin-top:18px">File audit · FILE01</div>${search('audit','User, action or path','Filter file audit')}
      <div class="tablewrap scroll" style="margin-top:8px"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Path</th></tr></thead><tbody>
      ${x.audit.filter(a=>{ const q=(S.ui.q.audit||'').toLowerCase(); return !q || (a.user+' '+a.action+' '+a.path).toLowerCase().includes(q); }).map(a=>`<tr><td class="mono small">${esc(a.t)}</td><td class="mono small">${esc(a.user)}</td><td>${chipFor(a.action,['Opened','Created','Restored','Restored copy'],['Deleted','Renamed','Overwritten','Encrypted'])}</td><td class="mono small">${esc(a.path)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No audit entries match.</td></tr>'}</tbody></table></div>`; }
  if (t==='events'){ const [id,pick]=srvPick('srvev','DC01'), x=S.net.servers[id];
    body=pick+`<div class="label blue" style="margin-top:14px">Event log · ${id}</div><div class="tablewrap scroll"><table><thead><tr><th>Time</th><th>Level</th><th>Source</th><th>ID</th><th>Message</th></tr></thead><tbody>
      ${x.events.map(e=>`<tr><td class="mono small">${esc(e.t)}</td><td>${chipFor(e.level,['Info'],['Error','Critical'])}</td><td class="small">${esc(e.source)}</td><td class="mono small">${e.id}</td><td class="small">${esc(e.text)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No events.</td></tr>'}</tbody></table></div>
      <div class="label blue" style="margin-top:16px">Scheduled tasks · ${id}</div><div class="tablewrap"><table><thead><tr><th>Task</th><th>Schedule</th><th>Last run</th><th>Result</th><th></th></tr></thead><tbody>
      ${x.tasks.map(k=>`<tr><td><b>${esc(k.name)}</b><div>${k.enabled?stat(1,'Enabled'):'<span class="st off">Disabled</span>'}</div></td><td class="small">${esc(k.schedule)}</td><td class="mono small">${esc(k.last)}</td><td class="small">${esc(k.result)}</td>
        <td><div class="row" style="justify-content:flex-end">${k.enabled?envBtn('taskEnable',[id,k.name,false],'Disable'):envBtn('taskEnable',[id,k.name,true],'Enable')}${envBtn('taskRun',[id,k.name],'Run now')}</div></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No scheduled tasks.</td></tr>'}</tbody></table></div>`; }
  return `<div class="tabs">${tab('srv','overview','Overview')}${tab('srv','topology','Topology')}${tab('srv','devices','Devices')}${tab('srv','servers','Servers')}${tab('srv','dhcp','DHCP')}${tab('srv','storage','Storage')}${tab('srv','shadows','Shadow copies')}${tab('srv','events','Events & tasks')}</div><div class="cbody">${body}</div>`;
}
/* ===== Remote desktop ===== */
const DRIVES = {'Finance-Share':'F:','Sales-Share':'S:','HR-Share':'H:','Support-Share':'T:','Operations-Share':'O:','Executive-Share':'X:','Domain Users':'P:'};
const DEPT_GROUP = {'Finance':'Finance-Share','Sales':'Sales-Share','Human Resources':'HR-Share','Support':'Support-Share','Operations':'Operations-Share','Executive Office':'Executive-Share'};
const APPS = {wifi:'Network & Wi-Fi', vpn:'VPN Client', files:'File Explorer', term:'Terminal', settings:'Settings', update:'System Update', devmgr:'Device Manager', office:'Office Suite'};
const DISP_MODES = ['Duplicate these displays','Extend these displays','Show only on 1','Show only on 2'];
const CAT_COL = {System:'#4a5561', Apps:'#1584bb', Documents:'#3ccf8e', Downloads:'#c9c35c', 'Temporary files':'#f0a33a', 'Recycle Bin':'#ff8b3d', 'Update cache':'#9b7be0'};
function settingsBody(w){
  const t=curTab('set','display'), rail=`<div class="vtabs" role="group" aria-label="Settings">${[['display','Display'],['storage','Storage'],...(w.battery?[['power','Power & battery']]:[]),['about','About']].map(([k,l])=>`<button class="${t===k?'on':''}" data-act="tab" data-id="set" data-arg="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div>`;
  let p='';
  if (t==='display'){ const m=monitors(w), mode=w.display.pending||w.display.mode;
    p=`<h3>Display</h3><div class="mon">${Array.from({length:m.detected},(_,i)=>`<span class="${i<(w.display.pending?(/Extend|Duplicate/.test(mode)?m.detected:1):m.active)?'on':''}">${i+1}</span>`).join('')}</div>
      <p class="small muted">${m.detected} display${m.detected>1?'s':''} detected · ${m.active} active${w.display.external&&!dockOk(w)?' · the dock’s displays aren’t detected':''}</p>
      <label class="fld" style="max-width:300px">Multiple displays<select data-bind="disp" data-id="${w.host}" data-key="dispSel">${DISP_MODES.map(x=>`<option ${x===mode?'selected':''}>${x}</option>`).join('')}</select></label>
      ${w.display.pending?`<div class="note warn">Keep these display settings? Reverting in 15 seconds. <div class="row" style="margin-top:6px">${envBtn('displayKeep',[w.host],'Keep changes','primary')}${envBtn('displayRevert',[w.host],'Revert')}</div></div>`:''}
      <div class="row" style="margin-top:12px">${envBtn('devScan',[w.host],'Detect displays')}</div>`; }
  if (t==='storage'){ const used=diskUsed(w), free=w.storage.totalGB-used;
    p=`<h3>Storage · C:</h3><div class="small muted">${used} GB used · <b style="color:${free<10?'var(--down)':'inherit'}">${free} GB free</b> of ${w.storage.totalGB} GB</div>
      <div class="disk" aria-hidden="true">${Object.entries(w.storage.cats).map(([k,v])=>`<i style="width:${v/w.storage.totalGB*100}%;background:${CAT_COL[k]||'#666'}"></i>`).join('')}</div>
      <table><tbody>${Object.entries(w.storage.cats).map(([k,v])=>`<tr><td><span class="legend" style="background:${CAT_COL[k]||'#666'}"></span>${k}</td><td class="mono">${v} GB</td><td style="text-align:right">${
        ['System','Apps','Documents'].includes(k) ? (k==='Documents'?'<span class="small muted">Protected</span>':'') : envBtn('cleanup',[w.host,k], k==='Downloads'?'Remove downloads older than 30 days':k==='Recycle Bin'?'Empty Recycle Bin':'Clean up','',{dis:!v})}</td></tr>`).join('')}</tbody></table>
      <div class="note">Documents are the user’s own files. Clean-up never touches them. Ask the user to move files to their Northstar Drive instead.</div>`; }
  if (t==='power' && w.battery){ const b=w.battery, slow=b.adapterW<65;
    p=`<h3>Power &amp; battery</h3>${kv([['Battery level',`${b.pct}% ${usedBar(b.pct,100,b.pct<20).replace('margin-top:4px','margin-top:4px;max-width:200px')}`],
      ['Status', b.charging ? (slow?stat(0,'Slow charging',1):stat(1,'Charging')) : stat(0,'Not charging')],['Power adapter', b.adapterW?`${b.adapterW} W USB-C${slow?' <span class="chip warn">Below the 65 W this laptop needs</span>':''}`:'Not connected'],
      ['Battery health', `${b.health}% of design capacity`],['Charge cycles', b.cycles],['Battery saver', b.saver?'On':'Off']])}
      <div class="row">${envBtn('batterySaver',[w.host], b.saver?'Turn battery saver off':'Turn battery saver on')}</div>`; }
  if (t==='about') p=`<h3>About</h3>${kv([['Device name',w.host],['Model',esc(w.model)],['Serial',w.serial],['Image',esc(w.image)],['IP address',wsAddr(w)],['Installed apps',esc((w.apps||(IMAGES.find(i=>i.name===w.image)||IMAGES[0]).apps).join(', '))]])}`;
  return `<div class="setwin">${rail}<div>${p}</div></div>`;
}
function appBody(w, a){
  const n=netState(S,w);
  if (a==='wifi'){
    if (w.remote) return `<p>Connected to <b>${esc(w.wifi.connected)}</b> (home network).</p><div class="note">This device is off-site. Company resources need the VPN Client.</div>`;
    const avail=['Northstar-Staff','Northstar-Guest'].filter(x=>!w.wifi.profiles.some(p=>p.ssid===x));
    return `<p>Status: ${w.wifi.connected?`connected to <b>${esc(w.wifi.connected)}</b>`:'<b>disconnected</b> (retrying)'} · ${esc(n.why)}</p>
      <div class="label" style="margin-top:12px">Saved networks</div><table><tbody>${w.wifi.profiles.map(p=>`<tr><td><b>${esc(p.ssid)}</b><div class="small ${p.broken?'':'muted'}" style="${p.broken?'color:var(--down)':''}">${p.broken?'Can’t connect: saved security settings don’t match the network':w.wifi.connected===p.ssid?'Connected':'Saved'}</div></td>
        <td style="text-align:right">${w.wifi.connected===p.ssid?btn('rdpAct',w.host,'disconnectWifi','Disconnect'):btn('rdpAct',w.host,'connectWifi:'+p.ssid,'Connect')}${btn('rdpAct',w.host,'forgetWifi:'+p.ssid,'Forget')}</td></tr>`).join('')||'<tr><td class="muted">No saved networks.</td></tr>'}</tbody></table>
      ${avail.length?`<div class="label" style="margin-top:12px">Available networks</div><table><tbody>${avail.map(x=>`<tr><td>${x}</td><td style="text-align:right">${btn('rdpAct',w.host,'connectWifi:'+x,'Connect')}</td></tr>`).join('')}</tbody></table>`:''}`;
  }
  if (a==='vpn') return `<label class="small muted" for="vpnSel">Connection profile</label><div class="row" style="margin:4px 0 10px"><select id="vpnSel" data-bind="vpnProfile" data-id="${w.host}" data-key="vpnSel">${['Northstar-Legacy','Northstar-Staff'].map(p=>`<option ${w.vpn.profile===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <p>Status: ${w.vpn.connected?stat(1,'Connected'):stat(0,'Disconnected',1)}</p>
      <div class="row" style="margin-top:8px">${w.vpn.connected?btn('rdpAct',w.host,'vpnDisconnect','Disconnect'):btn('rdpAct',w.host,'vpnConnect','Connect','primary')}</div>
      ${w.remote?'':'<p class="muted small">This device is on the office network and doesn’t normally need the VPN.</p>'}`;
  if (a==='files'){ const u=S.users[w.owner]; if (!u) return '<p class="muted">Shared kiosk: no mapped drives.</p>';
    const grps=[DEPT_GROUP[u.dept],'Domain Users'], open=S.ui.sel.share && SHARES.find(x=>x.path===S.ui.sel.share);
    return `<table><thead><tr><th>Drive</th><th>Path</th><th></th></tr></thead><tbody><tr><td>C:</td><td>Local disk · ${w.storage.totalGB-diskUsed(w)} GB free</td><td></td></tr>
      ${grps.map(g=>SHARES.find(x=>x.group===g)).filter(Boolean).map(sh=>`<tr><td>${DRIVES[sh.group]}</td><td class="mono">${esc(sh.path)}</td><td style="text-align:right">${btn('rdpAct',w.host,'openShare:'+sh.path,'Open')}</td></tr>`).join('')}</tbody></table>
      ${open?`<div class="row" style="margin-top:12px"><span class="label">${esc(open.path)}</span><span class="spacer"></span>${btn('rdpAct',w.host,'writeShare:'+open.path,'Save a test file')}</div>
        <ul>${fsList(S,open.path.split('\\').pop()).filter(f=>f.state!=='deleted').map(f=>`<li>${esc(f.name)}${f.state==='corrupt'?' <span class="chip bad">Can’t open: damaged</span>':f.state==='encrypted'?' <span class="chip bad">Encrypted</span>':''}${f.copy?` <span class="small muted">· ${esc(f.name)} (restored copy)</span>`:''}</li>`).join('')}</ul>`:''}`; }
  if (a==='term'){ const lines=S.ui.term[w.host]||['DeskOps lab shell — type help for the command list.'];
    return `<div class="term" aria-live="polite">${lines.map(esc).join('\n')}</div><div class="termin"><label for="termIn">${w.host}&gt;</label><input id="termIn" data-key="termIn" data-term="${w.host}" autocomplete="off" spellcheck="false"></div>`; }
  if (a==='settings') return settingsBody(w);
  if (a==='update'){ const u=w.updates, free=w.storage.totalGB-diskUsed(w);
    return `${kv([['Status', u.status==='Up to date'?stat(1,u.status):u.status==='Failed'?stat(0,u.status):stat(0,u.status,1)],['Pending', u.pending.length?esc(u.pending.join(', ')):'Nothing pending'],
        ['Last error', u.error?`<span class="mono" style="color:var(--down)">${esc(u.error)}</span>`:'—'],['Free disk space', `${free} GB (updates need ${u.needGB||10} GB)`]])}
      <div class="row">${envBtn('updRetry',[w.host],'Retry install','primary',{dis:!u.pending.length||u.status==='Restart required'})}${envBtn('updPause',[w.host],u.paused?'Resume updates':'Pause updates for 7 days')}

/* Scoring summary for a guide: what a correct finish earns and what each trap costs (pure: no S). */
function scoreGuide(T){
  const P=PRI[T.pri], escal=(T.expect||(T.security?'escalate':'close'))==='escalate', rows=[[`${P.w} ticket resolved`, '+'+P.pts]];
  if (escal) rows.push(['Correct security escalation', '+12']);
  rows.push(['Resolution notes: 40+ characters, a ticket keyword, and “verified”, “confirmed” or “tested”', 'up to +3']);
  [...new Map(Object.values(T.penalties||{}).map(([p,why])=>[why,p]))].forEach(([why,p])=>rows.push([why, '−'+p]));
  rows.push([`Closed while unresolved (${P.w})`, '−'+P.pen]);
  if (!escal) rows.push(['Escalated to Security when it didn’t need it', '−8']);
  return {rows, best:Math.min(42, P.pts+(escal?12:0)+3), finish:escal?'Escalate to Security':'Close ticket'};
}

      <td><div class="row">${envBtn('analyze',[r.id],'Analyze','primary')}${envBtn('openLink',[r.id],'Open link')}${envBtn('reportSec',[r.id],'Report to Security','',{dis:r.toSecurity})}
        <button class="btn sm" data-act="purgeDlg" data-id="${m.id}" ${m.status==='Purged'?'disabled':''}>Search &amp; purge…</button>${envBtn('blockSender',[m.from],'Block sender','',{dis:S.mail.blocked.includes(m.from)})}</div></td></tr>`; }).join('')||'<tr><td colspan="5" class="muted">No reported messages.</td></tr>'}</tbody></table></div>`;

      ${img?`<p class="small muted" style="margin:8px 0 0">Apps in ${esc(img.name)}: ${esc(img.apps.join(', '))}</p>`:''}
