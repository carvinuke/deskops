/* Penalties: T.penalties['<action>:<entity>' or '<action>:*'] = [pts, why, when?]. when(s, args) is checked BEFORE the action runs; args are the ENV call's arguments when known. */
/* A key may carry a '#tag' suffix ('dhcp:f2#range') so one action can have several conditional penalties. */
function penaltyHits(s, action, entity, args){
  const key=action+':'+entity, hits=[], base=k=>k.split('#')[0];
  TICKETS.forEach(T=>{ const P=T.penalties||{}, t=s.tickets[T.ref]; if (t.status!=='assigned') return;
    let ks=Object.keys(P).filter(k=>base(k)===key); if (!ks.length) ks=Object.keys(P).filter(k=>base(k)===action+':*');
    ks.forEach(k=>{ const p=P[k]; if (!t.penalties[k] && (!p[2] || p[2](s, args||[]))) hits.push([T.ref,k,p]); }); });
  return hits;
}
function act(tool, entity, action, fn, args){
  const hits = penaltyHits(S, action, entity, args);
  const text = fn(S);
  const ref = S.ui.ticket && S.tickets[S.ui.ticket] && S.tickets[S.ui.ticket].status==='assigned' ? S.ui.ticket : null;
  if (text) { logEntry(S, tool, entity, text, ref); S.ui.flash = {tool, text}; }
  hits.forEach(([r,key,p])=>{ S.tickets[r].penalties[key]=[p[0],p[1]]; toast(`${r}: ${p[1]} (−${p[0]} pts at close)`, 'warn'); });
  render();
}

  S.ui.term[host] = /^\s*cls\b/i.test(line) ? [] : prev.concat([`${host}> ${line}`], out).slice(-80);

  if (e.key==='Escape' && !dlg.open && S.ui.chat.open && !document.querySelector(':popover-open')) { ACT.chat(); }

document.addEventListener('toggle', e=>{
  const p=e.target; if (!p.matches || !p.matches('[popover]:not(.modal)') || e.newState!=='open') return;
  const b=document.activeElement && document.activeElement.getAttribute('popovertarget')===p.id ? document.activeElement : document.querySelector(`[popovertarget="${p.id}"]`);
  if (!b) return; const r=b.getBoundingClientRect();
  p.style.top=(r.bottom+6)+'px'; p.style.left=Math.max(8, Math.min(r.right>innerWidth*.6 ? r.right-p.offsetWidth : r.left, innerWidth-p.offsetWidth-8))+'px';
}, true);

/* =====================================================================
   8. SELF-TEST — runs every scenario from a fresh seed (open index.html#selftest).
   ===================================================================== */
function selfTest(){
  const out=[], ok=(c,n)=>out.push([!!c,n]), done=(s,r)=>check(s,r).complete;
  /* fresh(ref): new seed with only this ticket (and its after-chain) arrived, so one ticket's arrive() can't leak into another's test. */
  const fresh=ref=>{ const s=seed(); s.shift=Math.max(s.shift, TK[ref].shift||1);
    const bring=r=>{ const T=TK[r]; if (T.after){ if (s.tickets[T.after].status==='waiting') bring(T.after); s.tickets[T.after].status='closed'; }
      if (s.tickets[r].status==='waiting') arriveTicket(s,r,true); if (s.tickets[r].status==='intake') s.tickets[r].status='open'; };
    bring(ref); return s; };
  let s, s2;
  s=fresh('INC-1042'); ok(!done(s,'INC-1042'),'1042 not complete at seed');

  asg(s,'INC-1067'); ok(penaltyHits(s,'dhcp','f2',['f2','purgeAll']).length===1 && penaltyHits(s,'dhcp','f2',['f2','range','200']).length===1 && !penaltyHits(s,'dhcp','f2',['f2','purgeInactive']).length,'1067 delete-all and an overlapping range penalised; inactive purge is not');
  ENV.dhcp(s,'f2','range','200'); ENV.dhcp(s,'f2','leaseHours','8'); ENV.term(s,'NS-FIN-031','ipconfig /renew'); ENV.term(s,'NS-FIN-031','ping 10.0.0.1');
  ok(!done(s,'INC-1067') && !objOk(s,'INC-1067',0) && w67.ip.mode==='dhcp','1067 widening the range over the printer does not complete it');
  s=fresh('INC-1067'); ENV.dhcp(s,'f2','purgeInactive'); ENV.dhcp(s,'f2','leaseHours','8'); ENV.term(s,'NS-FIN-031','ipconfig /renew');
  ok(!done(s,'INC-1067') && /^10\.0\.2\.1\d\d$/.test(wsAddr(s.workstations['NS-FIN-031'])),'1067 renew gives a 10.0.2.1xx lease; still needs a test');
  ENV.term(s,'NS-FIN-031','ping 10.0.0.1'); ok(done(s,'INC-1067'),'1067 complete: inactive leases purged + 8-hour lease + renew + ping');
  // 1068 ISP
  s2=seed(); ENV.announce(s2,'full'); s2.shift=3; arriveTicket(s2,'INC-1068',true); ENV.logFault(s2,'MF-PRI-88213'); ENV.checkIsp(s2);
  ok(s2.net.devices.isp.status!=='online' && !objOk(s2,'INC-1068',2),'1068 an announcement posted before the outage does not count');
  s=fresh('INC-1068'); ENV.restartService(s,'DC01','DNS Server'); ok(!done(s,'INC-1068') && s.net.devices.isp.status!=='online','1068 not complete; circuit down');
  ok(ENV.term(s,'NS-HR-003','ping web.example').some(l=>l.includes('100% loss')) && ENV.term(s,'NS-HR-003','tracert web.example').some(l=>l.includes('Request timed out')) && ENV.term(s,'NS-HR-003','nslookup web.example').some(l=>l.includes('timed out')),'1068 external ping and tracert fail; nslookup times out');
  ok(ENV.term(s,'NS-HR-003','ping file01').some(l=>l.includes('Received = 3')) && !s.net.ispVerified,'1068 internal still works and does not verify the internet');
  asg(s,'INC-1068'); ok(penaltyHits(s,'reboot','edge').length===1 && penaltyHits(s,'announce','restart').length===1 && !penaltyHits(s,'announce','full').length,'1068 core reboot and restart advice penalised');
  ENV.checkIsp(s); ok(s.net.devices.isp.checked && /MF-INC-5821/.test(ENV.checkIsp(s)),'1068 provider status shows the area incident');
  ENV.logFault(s,'MF-BKP-10442'); ok(!s.net.devices.isp.faultRef,'1068 the backup circuit logs no fault');
  ENV.logFault(s,'MF-PRI-88213'); ENV.announce(s,'restart'); ENV.checkIsp(s); ok(s.net.devices.isp.status!=='online','1068 restart advice is not a status update');
  ENV.announce(s,'full'); ENV.checkIsp(s); ok(s.net.devices.isp.status==='online' && !done(s,'INC-1068'),'1068 circuit restored; still needs a test from an office PC');
  ENV.term(s,'NS-HR-003','ping web.example'); ok(done(s,'INC-1068'),'1068 complete: status + fault + full update + recheck + external ping');
  // 1069 storage
  s=fresh('INC-1069'); ok(!done(s,'INC-1069') && volFree(fileD(s),s.net.servers.FILE01)<2 && ENV.extendVolume(s,'FILE01','D:').includes('no unallocated'),'1069 not complete; D: full and cannot be extended');
  asg(s,'INC-1069'); ok(penaltyHits(s,'deleteShadows','FILE01').length===1 && penaltyHits(s,'deleteFolder','FILE01',['FILE01','D:','Scans']).length===1 && !penaltyHits(s,'purgeOld','FILE01').length,'1069 deleting shadows or whole folders penalised; purging old files is not');
  ENV.deleteShadows(s,'FILE01'); ENV.taskEnable(s,'FILE01','Purge Scans older than 30 days',true); ENV.testWrite(s,'FILE01','D:');
  ok(!done(s,'INC-1069') && !objOk(s,'INC-1069',0) && !objOk(s,'INC-1069',1),'1069 deleting shadow copies loses restore points and leaves D: over 90%');
  s=fresh('INC-1069'); ENV.purgeOld(s,'FILE01','D:','Scans'); ENV.testWrite(s,'FILE01','D:'); ok(!done(s,'INC-1069') && fileD(s).writeOk,'1069 purge frees space; the clean-up task is still disabled');
  ENV.taskEnable(s,'FILE01','Purge Scans older than 30 days',true); ok(done(s,'INC-1069') && s.net.servers.FILE01.shadows.length===3,'1069 complete: purge old scans + task enabled + test write, shadows kept');
  // 1070 file restore
  s=fresh('INC-1070'); ok(!done(s,'INC-1070') && fsList(s,'HR').find(f=>f.name==='Starters_October.xlsx').state==='deleted','1070 not complete; file deleted');
  ENV.restoreVersion(s,'HR','Starters_October.xlsx','v2','original'); ENV.chatAskConfirm(s,'INC-1070'); ok(!done(s,'INC-1070') && s.chat.threads.pshah.slice(-1)[0].text.includes('missing'),'1070 the 11:20 version lacks the evening edits');
  ENV.restoreVersion(s,'HR','Starters_October.xlsx','v3','original'); ENV.chatAskConfirm(s,'INC-1070'); ok(done(s,'INC-1070'),'1070 complete: restore the 18:07 version over it + Priya confirms');
  s=fresh('INC-1070'); asg(s,'INC-1070'); ok(penaltyHits(s,'revertShare','HR').length===1,'1070 reverting the share is penalised');
  ENV.revertShare(s,'HR','sc3'); ENV.chatAskConfirm(s,'INC-1070'); ok(!done(s,'INC-1070') && !objOk(s,'INC-1070',2),'1070 reverting the whole share fails it');
  s=fresh('INC-1070'); ENV.deleteShadows(s,'FILE01'); ok(ENV.restoreVersion(s,'HR','Starters_October.xlsx','v3','original').includes('no longer exists'),'1070 deleted shadows block previous versions');
  ENV.requestBackup(s,'HR','Starters_October.xlsx'); ENV.chatAskConfirm(s,'INC-1070'); ok(done(s,'INC-1070'),'1070 the nightly backup fallback still completes it');
  // 1071 new phone
  s=fresh('INC-1071'); ok(!done(s,'INC-1071') && mobile(s,'mob10').state==='Quarantined','1071 not complete; new phone quarantined');
  asg(s,'INC-1071'); ok(penaltyHits(s,'mobileAct','mob11',['mob11','approve']).length===1 && penaltyHits(s,'mobileAct','mob10',['mob10','approve']).length===1 && penaltyHits(s,'setQuarantine','false',[false]).length===1 && penaltyHits(s,'mobileAct','mob12',['mob12','wipe']).length===1,'1071 MailSync approval, unverified approval, quarantine off and full wipe penalised');
  ENV.setQuarantine(s,false); ENV.chatAction(s,'INC-1071','tr-devid'); ENV.mobileAct(s,'mob12','remove'); ENV.mobileAct(s,'mob10','testSync'); ENV.chatAskConfirm(s,'INC-1071');
  ok(!done(s,'INC-1071') && mobile(s,'mob11').state==='Allowed','1071 disabling quarantine lets MailSync through and does not complete it');
  s=fresh('INC-1071'); ENV.chatAction(s,'INC-1071','tr-devid'); asg(s,'INC-1071'); ok(!penaltyHits(s,'mobileAct','mob10',['mob10','approve']).length,'1071 approving after the Device ID check is fine');
  ENV.mobileAct(s,'mob10','approve'); ENV.mobileAct(s,'mob11','block'); ENV.mobileAct(s,'mob12','remove'); ENV.chatAskConfirm(s,'INC-1071'); ok(!done(s,'INC-1071'),'1071 Talia can’t confirm before a sync test');
  ENV.mobileAct(s,'mob10','testSync'); ENV.chatAskConfirm(s,'INC-1071'); ok(done(s,'INC-1071'),'1071 complete: Device ID + approve + block MailSync + remove old + sync + confirm');
  // 1072 phishing
  s=fresh('INC-1072'); ok(!done(s,'INC-1072') && phishC1(s).length===6,'1072 not complete; 6 copies delivered');
  asg(s,'INC-1072'); ok(penaltyHits(s,'openLink','rp2').length===1 && penaltyHits(s,'purge','mp1',['mp1','campaign','hard']).length===1 && !penaltyHits(s,'purge','mp1',['mp1','campaign','soft']).length
    && penaltyHits(s,'blockSender','@northstar.example',['@northstar.example']).length===1 && !penaltyHits(s,'blockSender','x',['it-servicedesk@northstar-helpdesk.example']).length,'1072 open link, hard purge and blocking our own domain penalised');
  ENV.analyze(s,'rp2'); ENV.reportSec(s,'rp2'); ok(ENV.purge(s,'mp1','recipient','soft').includes('5 other copies'),'1072 purging one copy reports 5 left');
  ENV.blockSender(s,'it-servicedesk@northstar-helpdesk.example'); ENV.trace(s,{who:'northstar-helpdesk'}); ok(!done(s,'INC-1072') && !objOk(s,'INC-1072',2),'1072 purging only the reporter’s copy does not complete it');
  ENV.purge(s,'mp1','campaign','soft'); ok(!done(s,'INC-1072'),'1072 needs a fresh trace after the purge');
  ENV.trace(s,{who:'northstar-helpdesk'}); ok(done(s,'INC-1072'),'1072 complete: analyse + report + purge all + block + re-trace');
  ok(scoreFor(s,'INC-1072','escalate','x').lines[0][1]===-8,'1072 escalating a 0-click campaign is a routine escalation');
  return {pass: out.every(r=>r[0]), results: out};
}
window.selfTest = selfTest;

document.querySelectorAll('[data-ic]').forEach(e=>{ e.innerHTML=icon(e.dataset.ic, e.dataset.ic==='chevd'?16:20); });

if (memoryOnly) $('memNote').classList.remove('hide');

  const r=selfTest();
  openDlg(`<div class="dh"><h2 id="dlgTitle">Self-test: ${r.pass?'all passed':'FAILURES'}</h2></div><div class="db"><ul class="objs">${r.results.map(([p,n])=>`<li><span class="ck ${p?'y':''}">${p?'✓':''}</span><span>${esc(n)}</span></li>`).join('')}</ul></div><div class="df"><button class="btn primary" data-act="dlgCancel">Close</button></div>`);
} else if (S.profile.firstRun) { S.profile.firstRun=false; save(); guideDialog(true); }
